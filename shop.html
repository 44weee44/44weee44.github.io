<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>МАГАЗИН — кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
:root {
  --bg-0:#0a0a0c;
  --bg-1:#121216;
  --bg-2:#18181f;
  --line:#24242c;
  --line-2:#33333d;
  --text:#e8e8ec;
  --text-2:#8a8a92;
  --text-3:#5a5a62;
  --accent:#2a8a30;
  --accent-2:#7af080;
  --green:#4cd964;
  --red:#ff4a4a;
  --gold:#ffd76b;
}
html, body {
  background:#050506;
  width:100%; height:100%;
  margin:0;
  font-family:-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Arial, sans-serif;
  color:var(--text);
  overflow:hidden;
}
body { display:flex; justify-content:center; align-items:center; touch-action:manipulation; }

.game-container {
  width:100%; max-width:520px; height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  background:var(--bg-0);
  position:relative; min-height:0; overflow:hidden;
  animation:fadeInSoft 0.5s ease-out;
}
@keyframes fadeInSoft { from { opacity:0.6; } to { opacity:1; } }

.game-container::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
}
.game-container::after {
  content:'';
  position:absolute;
  top:-40%; left:50%;
  transform:translateX(-50%);
  width:500px; height:500px;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(42,138,48,0.06) 30deg, transparent 60deg,
    transparent 300deg, rgba(42,138,48,0.06) 330deg, transparent 360deg);
  animation:spotlight 24s linear infinite;
  pointer-events:none;
  z-index:0;
  filter:blur(30px);
}
@keyframes spotlight { 0% { transform:translateX(-50%) rotate(0); } 100% { transform:translateX(-50%) rotate(360deg); } }

/* ШАПКА */
.header {
  position:relative;
  z-index:5;
  padding:18px 20px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  min-height:64px;
  flex-shrink:0;
}
.header::after {
  content:'';
  position:absolute;
  left:20%; right:20%;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-2), transparent);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.header-title {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  font-weight:800;
  letter-spacing:3px;
  font-size:0.95rem;
  text-transform:uppercase;
}
.header-title::before {
  content:'';
  width:8px; height:8px;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transform:rotate(45deg);
}

/* СЧЁТ */
.score-board {
  position:relative;
  z-index:5;
  padding:8px 15px;
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.sexpah, .current-tool-info {
  flex:1;
  padding:5px 12px;
  border-radius:8px;
  background:var(--bg-1);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  font-size:0.82rem;
  font-weight:700;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:0.2px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.3s ease;
  white-space:nowrap;
}
.sexpah { flex:1.4; }
.current-tool-info { flex:1; }
.sexpah::before, .current-tool-info::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:3px; height:100%;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.sexpah.bump { transform:scale(1.06); box-shadow:0 0 20px rgba(42,138,48,0.6); }
.sexpah.flash-red { animation:redFlash 0.6s ease; }
@keyframes redFlash {
  0%, 100% { box-shadow:0 0 0 rgba(255,74,74,0); }
  30%      { box-shadow:0 0 25px rgba(255,74,74,1); transform:scale(1.04); }
}
.sexpah.flash-green { animation:greenFlash 0.6s ease; }
@keyframes greenFlash {
  0%, 100% { box-shadow:0 0 0 rgba(42,138,48,0); }
  30%      { box-shadow:0 0 25px rgba(42,138,48,1); transform:scale(1.04); }
}
.current-tool-info .weapon-svg { display:inline-block; width:1.15em; height:1.15em; vertical-align:middle; }

.current-tool-info.rarity-common { border-color:rgba(180,180,200,0.4) !important; background:linear-gradient(135deg, rgba(154,154,154,0.15), rgba(30,30,34,0.4)); }
.current-tool-info.rarity-common::before { background:#b4b4c8; }
.current-tool-info.rarity-rare { border-color:rgba(59,130,246,0.55) !important; background:linear-gradient(135deg, rgba(59,130,246,0.18), rgba(15,25,50,0.4)); }
.current-tool-info.rarity-rare::before { background:#5aa8ff; }
.current-tool-info.rarity-legendary { border-color:rgba(255,215,107,0.55) !important; background:linear-gradient(135deg, rgba(255,215,107,0.18), rgba(50,40,10,0.4)); }
.current-tool-info.rarity-legendary::before { background:#ffd76b; }
.current-tool-info.rarity-mythic { border-color:rgba(168,85,247,0.55) !important; background:linear-gradient(135deg, rgba(168,85,247,0.18), rgba(40,15,60,0.4)); }
.current-tool-info.rarity-mythic::before { background:#a855f7; }
.current-tool-info.rarity-divine { border-color:rgba(255,59,59,0.6) !important; background:linear-gradient(135deg, rgba(255,59,59,0.18), rgba(60,10,10,0.4)); }
.current-tool-info.rarity-divine::before { background:#ff3b3b; }

/* БАФФЫ */
.buffs-top {
  display:flex; gap:8px; align-items:center;
  padding:12px 16px; flex-shrink:0;
  border-bottom:1px solid var(--line);
  position:relative; z-index:5;
}
.buffs-top.hidden { display:none; }
.buff-chip {
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px;
  background:var(--bg-1);
  border:1px solid var(--line-2);
  border-radius:10px;
  font-size:0.75rem; font-weight:800;
  color:var(--accent-2);
  font-family:'Courier New', monospace;
  letter-spacing:0.5px;
  position:relative;
  overflow:hidden;
  animation:chipIn 0.4s ease;
}
.buff-chip::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:3px; height:100%;
  background:var(--accent-2);
  box-shadow:0 0 8px rgba(42,138,48,0.9);
}
@keyframes chipIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

/* ТАБЫ */
.shop-tabs {
  position:relative;
  z-index:20;
  display:flex;
  gap:10px;
  padding:12px 16px;
  flex-shrink:0;
}
.shop-tab {
  flex:1;
  background:linear-gradient(135deg, rgba(30,30,20,0.75), rgba(18,18,12,0.75));
  border:1px solid var(--line);
  color:var(--text-3);
  padding:12px 6px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  font-size:0.72rem;
  transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing:1.6px;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
  font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
}
.shop-tab::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent 30%, rgba(122,240,128,0.15) 50%, transparent 70%);
  transform:translateX(-100%);
  transition:transform 0.7s ease;
  pointer-events:none;
}
.shop-tab:hover:not(.active) {
  border-color:rgba(122,240,128,0.4);
  transform:translateY(-2px);
  color:var(--text-2);
  box-shadow:0 6px 18px rgba(0,0,0,0.6), 0 0 18px rgba(42,138,48,0.2);
}
.shop-tab.active {
  border-color:var(--accent-2);
  background:linear-gradient(135deg, rgba(42,138,48,0.35), rgba(20,60,24,0.25));
  color:var(--accent-2);
  box-shadow:0 0 25px rgba(42,138,48,0.5), inset 0 0 18px rgba(122,240,128,0.1), 0 4px 12px rgba(0,0,0,0.5);
  transform:translateY(-2px);
  text-shadow:0 0 10px rgba(122,240,128,0.6);
}
.shop-tab.active::before { transform:translateX(100%); }
.shop-tab:active { transform:translateY(0) scale(0.97); }

/* КОНТЕНТ */
.shop-content-area {
  position:relative;
  z-index:5;
  flex:1;
  min-height:0;
  overflow:hidden;
}
.shop-page {
  display:none;
  width:100%; height:100%;
  position:absolute; top:0; left:0;
}
.shop-page.active {
  display:block;
  animation:pageIn 0.35s ease;
}
@keyframes pageIn {
  from { opacity:0; transform:translateX(12px); }
  to   { opacity:1; transform:translateX(0); }
}
.shop-panel, .inventory-panel {
  padding:20px 16px 30px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  height:100%;
  scrollbar-width:thin;
  scrollbar-color:var(--line-2) transparent;
}
.shop-panel::-webkit-scrollbar, .inventory-panel::-webkit-scrollbar { width:5px; }
.shop-panel::-webkit-scrollbar-thumb, .inventory-panel::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:3px; }

.inventory-section { margin-bottom:20px; }
.inventory-section-title {
  display:flex;
  align-items:center;
  gap:12px;
  margin:8px 0 14px;
  font-size:0.66rem;
  font-weight:800;
  color:var(--text-3);
  letter-spacing:3px;
  text-transform:uppercase;
}
.inventory-section-title::after {
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}

/* КАРТОЧКА */
.shop-item {
  position:relative;
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  margin-bottom:8px;
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:12px;
  transition:all 0.18s ease;
  overflow:hidden;
  animation:cardIn 0.4s ease backwards;
}
@keyframes cardIn {
  from { opacity:0; transform:translateX(-10px); }
  to   { opacity:1; transform:translateX(0); }
}
.shop-item::before {
  content:'';
  position:absolute;
  left:0; top:14px; bottom:14px;
  width:2px;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transform:scaleY(0);
  transition:transform 0.22s ease;
}
.shop-item:hover::before { transform:scaleY(1); }
.shop-item:hover { border-color:var(--line-2); background:#16161b; transform:translateX(4px); }

.shop-item-info { display:contents; }
.shop-item-icon {
  position:relative;
  width:48px; height:48px;
  border-radius:10px;
  background:var(--bg-2);
  border:1px solid var(--line-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.7rem;
  flex-shrink:0;
}
.shop-item-icon::before,
.shop-item-icon::after {
  content:'';
  position:absolute;
  width:5px; height:5px;
  border-color:var(--accent-2);
  border-style:solid;
  opacity:0.9;
}
.shop-item-icon::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
.shop-item-icon::after  { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
.shop-item-icon svg { width:28px; height:28px; }
.shop-item-icon img { width:100%; height:100%; object-fit:contain; border-radius:8px; }

.shop-item-info-text { min-width:0; }
.item-name { font-weight:800; font-size:0.92rem; color:var(--text); letter-spacing:0.2px; margin-bottom:3px; }
.item-desc { font-size:0.72rem; color:var(--text-2); font-weight:600; }
.item-rarity { font-size:0.68rem; margin-top:3px; font-weight:700; color:var(--text-2); }

.rarity-common { border-color:rgba(154,154,154,0.6) !important; }
.rarity-common::before { background:#b4b4c8; }
.rarity-common:hover { box-shadow:0 0 18px rgba(180,180,200,0.3); }

.rarity-rare { border-color:rgba(59,130,246,0.6) !important; }
.rarity-rare::before { background:#5aa8ff; }
.rarity-rare:hover { box-shadow:0 0 18px rgba(59,130,246,0.5); }

.rarity-legendary { border-color:rgba(255,215,107,0.6) !important; }
.rarity-legendary::before { background:#ffd76b; }
.rarity-legendary:hover { box-shadow:0 0 22px rgba(255,215,107,0.6); }

.rarity-mythic { border-color:rgba(168,85,247,0.6) !important; }
.rarity-mythic::before { background:#a855f7; }
.rarity-mythic:hover { box-shadow:0 0 22px rgba(168,85,247,0.7); }

.rarity-divine { border-color:rgba(255,59,59,0.6) !important; }
.rarity-divine::before { background:#ff3b3b; }
.rarity-divine:hover { box-shadow:0 0 22px rgba(255,59,59,0.7); }

/* КНОПКИ */
.weapon-action {
  padding:9px 14px;
  border-radius:8px;
  font-weight:800;
  font-size:0.7rem;
  letter-spacing:1.2px;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
  border:1px solid;
  background:transparent;
  flex-shrink:0;
  font-family:inherit;
  transition:all 0.2s ease;
  position:relative;
  overflow:hidden;
  min-width:100px;
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.weapon-action::before {
  content:'';
  position:absolute;
  inset:0;
  background:currentColor;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform 0.22s ease;
  z-index:-1;
  opacity:0.15;
}
.weapon-action:hover::before { transform:scaleX(1); }

.weapon-action.buy {
  border-color:var(--accent-2);
  color:var(--accent-2);
}
.weapon-action.buy:hover:not(:disabled) { box-shadow:0 0 15px rgba(42,138,48,0.5); }
.weapon-action.buy:disabled {
  opacity:0.35;
  cursor:not-allowed;
  border-color:var(--line-2);
  color:var(--text-3);
}
.weapon-action.buy:disabled::before { display:none; }

.weapon-action.loading {
  border-color:var(--gold);
  color:var(--gold);
  cursor:wait;
  pointer-events:none;
}
.weapon-action.success {
  border-color:var(--green);
  color:var(--green);
  pointer-events:none;
}
.weapon-action.error {
  border-color:var(--red);
  color:var(--red);
  pointer-events:none;
  animation:btnShake 0.4s ease;
}
@keyframes btnShake {
  0%, 100% { transform:translateX(0); }
  25%      { transform:translateX(-4px); }
  50%      { transform:translateX(4px); }
  75%      { transform:translateX(-2px); }
}
.weapon-action .spinner {
  display:none;
  width:12px; height:12px;
  border:2px solid rgba(255,215,107,0.3);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spinner 0.7s linear infinite;
  margin-right:6px;
}
.weapon-action.loading .spinner { display:inline-block; }
@keyframes spinner { to { transform:rotate(360deg); } }

.weapon-action.owned {
  border-color:rgba(76,217,100,0.5);
  color:var(--green);
  cursor:default;
  background:rgba(76,217,100,0.08);
}
.weapon-action.equip {
  border-color:var(--accent-2);
  color:var(--accent-2);
}
.weapon-action.equip:hover { box-shadow:0 0 15px rgba(42,138,48,0.5); }
.weapon-action.equipped {
  border-color:rgba(76,217,100,0.5);
  color:var(--green);
  cursor:default;
  background:rgba(76,217,100,0.1);
}

/* ВЕРСТАК */
.kraft-btn {
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  margin-bottom:18px;
  background:linear-gradient(135deg, rgba(42,138,48,0.18), rgba(20,40,22,0.4));
  border:1px solid var(--accent-2);
  border-radius:12px;
  color:var(--accent-2);
  text-decoration:none;
  font-weight:800;
  font-size:0.9rem;
  letter-spacing:1.2px;
  text-transform:uppercase;
  transition:all 0.2s ease;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.kraft-btn::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(200,255,200,0.15), transparent);
  animation:kraftShine 3s ease-in-out infinite;
}
@keyframes kraftShine {
  0%   { left:-100%; }
  60%  { left:120%; }
  100% { left:120%; }
}
.kraft-btn:hover { box-shadow:0 0 25px rgba(42,138,48,0.5); transform:translateY(-2px); }
.kraft-btn:active { transform:translateY(0) scale(0.98); }
.kraft-btn-icon {
  font-size:1.5rem;
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px; height:48px;
  border-radius:10px;
  background:var(--bg-2);
  border:1px solid var(--line-2);
}
.kraft-btn-text { flex:1; }
.kraft-btn-arrow { font-size:1.2rem; opacity:0.7; transition:transform 0.2s ease; }
.kraft-btn:hover .kraft-btn-arrow { transform:translateX(4px); opacity:1; }

/* КАРТОЧКА ОРУЖИЯ В ИНВЕНТАРЕ */
.inv-weapon-card {
  position:relative;
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  margin-bottom:8px;
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  animation:cardIn 0.4s ease backwards;
  transition:all 0.18s ease;
}
.inv-weapon-card:hover { border-color:var(--line-2); background:#16161b; transform:translateX(4px); }

.inv-weapon-icon {
  width:48px; height:48px;
  border-radius:10px;
  background:var(--bg-2);
  border:1px solid var(--line-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.7rem;
  flex-shrink:0;
}
.inv-weapon-icon svg { width:28px; height:28px; }
.inv-weapon-info { min-width:0; }
.inv-weapon-name { font-weight:800; font-size:0.92rem; color:var(--text); letter-spacing:0.2px; margin-bottom:3px; }
.inv-weapon-dmg { font-size:0.7rem; color:var(--text-2); font-weight:600; }
.inv-weapon-dmg b { color:var(--accent-2); }

.weapon-svg { display:inline-block; vertical-align:middle; }
.weapon-svg svg { display:block; }

/* НИЖНИЕ ТАБЫ */
.tabs-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:0 30px 80px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px));
  flex-shrink:0; z-index:20; gap:10px;
  position:relative;
}
.tabs-bar::before {
  content:'';
  position:absolute;
  top:0; left:16px; right:16px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
}
.tab-btn {
  background:transparent; border:none; cursor:pointer;
  color:var(--text-3); opacity:0.7; padding:8px;
  text-decoration:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:12px;
  transition:all 0.3s ease;
  position:relative;
}
.tab-btn.active { opacity:1; color:var(--accent-2); transform:scale(1.1) translateY(-3px); }
.tab-btn.active::after {
  content:'';
  position:absolute;
  bottom:-2px; left:50%;
  transform:translateX(-50%);
  width:60%; height:2px;
  background:var(--accent-2);
  box-shadow:0 0 10px rgba(42,138,48,0.9);
}
.tab-btn:hover { opacity:1; transform:scale(1.08) translateY(-2px); }
.tab-btn:active { transform:scale(0.95); }
.tab-btn svg { width:30px; height:30px; }
.tab-btn.home-btn svg { width:38px; height:38px; }
.tab-btn.boss-btn svg { width:32px; height:32px; }
.tab-btn.boss-btn:hover { color:var(--red); }
.tab-btn.rating-btn:hover { color:var(--gold); }

/* TOAST */
.toast {
  position:fixed;
  bottom:120px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-2);
  border:1px solid var(--accent-2);
  color:var(--accent-2);
  padding:12px 24px;
  border-radius:10px;
  font-weight:800;
  font-size:0.85rem;
  z-index:9999;
  box-shadow:0 8px 30px rgba(0,0,0,0.8), 0 0 25px rgba(42,138,48,0.5);
  opacity:0;
  pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space:nowrap;
  max-width:90vw;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error {
  border-color:var(--red);
  color:var(--red);
  box-shadow:0 8px 30px rgba(0,0,0,0.8), 0 0 25px rgba(255,74,74,0.5);
}

/* ВСПЫШКА ЭКРАНА */
.screen-flash {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9990;
  background:radial-gradient(circle at 50% 50%,
    rgba(122,240,128,0.5) 0%,
    transparent 50%);
  opacity:0;
}
.screen-flash.go { animation:flashScreen 0.6s ease-out; }
@keyframes flashScreen {
  0%   { opacity:0; transform:scale(0.8); }
  20%  { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(1.3); }
}
.screen-flash.red {
  background:radial-gradient(circle at 50% 50%,
    rgba(255,74,74,0.5) 0%,
    transparent 50%);
}

/* ЛЕТЯЩИЙ ЧИП */
.fly-chip {
  position:fixed;
  pointer-events:none;
  z-index:9995;
  padding:6px 14px;
  border-radius:20px;
  font-weight:900;
  font-family:'Courier New', monospace;
  font-size:0.9rem;
  white-space:nowrap;
  animation:chipFly 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.fly-chip.minus {
  background:linear-gradient(135deg, rgba(200,30,30,0.95), rgba(120,10,10,0.95));
  color:#fff;
  border:1px solid #ff5a5a;
  box-shadow:0 0 20px rgba(255,74,74,0.8), 0 0 40px rgba(255,74,74,0.4);
}
@keyframes chipFly {
  0%   { opacity:0; transform:translate(-50%, -50%) scale(0.4); }
  15%  { opacity:1; transform:translate(-50%, -70%) scale(1.15); }
  40%  { opacity:1; transform:translate(-50%, -100%) scale(1); }
  100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.7); }
}

/* ИСКРЫ */
.spark {
  position:fixed;
  pointer-events:none;
  width:6px; height:6px;
  border-radius:50%;
  background:radial-gradient(circle, #b8ffb8, #2a8a30);
  box-shadow:0 0 12px #7af080, 0 0 22px rgba(42,138,48,0.7);
  z-index:9996;
  animation:sparkFly 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes sparkFly {
  0%   { opacity:0; transform:translate(-50%, -50%) scale(0.4); }
  15%  { opacity:1; transform:translate(-50%, -50%) scale(1.2); }
  100% { opacity:0; transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.2); }
}

/* ЛЕТЯЩАЯ ИКОНКА */
.fly-icon {
  position:fixed;
  pointer-events:none;
  z-index:9997;
  font-size:2rem;
  filter:drop-shadow(0 0 15px rgba(42,138,48,0.9));
  animation:iconFly 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes iconFly {
  0%   { opacity:0; transform:translate(-50%, -50%) scale(0.5); }
  20%  { opacity:1; transform:translate(-50%, -50%) scale(1.3); }
  60%  { opacity:1; transform:translate(calc(-50% + var(--mx) * 0.7), calc(-50% + var(--my) * 0.7)) scale(0.9) rotate(180deg); }
  100% { opacity:0; transform:translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(0.4) rotate(360deg); }
}

.hidden { display:none !important; }

@media (max-width:400px) {
  .shop-tab { font-size:0.66rem; padding:12px 4px 10px; }
  .item-name { font-size:0.86rem; }
  .weapon-action { padding:8px 10px; font-size:0.64rem; min-width:90px; }
  .tabs-bar { padding:0 15px 80px; padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="header-title">МАГАЗИН</div>
  </div>

  <div class="score-board">
    <div class="sexpah" id="sexpahBox">🔞 <span id="sexpahCount">0</span> секспахомов</div>
    <div class="current-tool-info" id="currentToolInfo">
      <span id="currentToolIcon">✋</span>
      <span id="currentToolName">Рука</span>
    </div>
  </div>

  <div class="buffs-top hidden" id="buffsTop"></div>

  <div class="shop-tabs">
    <button id="tabItems" class="shop-tab active">Магазин</button>
    <button id="tabBuffs" class="shop-tab">Баффы</button>
    <button id="tabInventory" class="shop-tab">Снаряжение</button>
  </div>

  <div class="shop-content-area">
    <div id="pageItems" class="shop-page active">
      <div class="shop-panel" id="itemsPanel"></div>
    </div>
    <div id="pageBuffs" class="shop-page">
      <div class="shop-panel" id="buffsPanel"></div>
    </div>
    <div id="pageInventory" class="shop-page">
       <div class="inventory-panel" id="inventoryPanel">
         <a href="kraft.html" class="kraft-btn">
           <span class="kraft-btn-icon">🛠️</span>
           <span class="kraft-btn-text">Верстак Пахома</span>
           <span class="kraft-btn-arrow">→</span>
         </a>
        <div id="inventoryList"></div>
      </div>
    </div>
  </div>

  <div class="tabs-bar">
    <a href="boss.html" class="tab-btn boss-btn" title="Боссы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2C7.6 2 4 5.6 4 10c0 2.4 1 4.5 2.7 5.9V19c0 .6.4 1 1 1h1.3v-2h1.4v2h1.2v-2h1.4v2H14v-2h1.4v2H16.7c.6 0 1-.4 1-1v-3.1C19.4 14.5 20 12.4 20 10c0-4.4-3.6-8-8-8z"/>
        <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
        <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
      </svg>
    </a>
    <a href="shop.html" class="tab-btn active" title="Магазин">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </a>
    <a href="seks.html" class="tab-btn home-btn" title="Главная">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="rating.html" class="tab-btn rating-btn" title="Рейтинг">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h2a2 2 0 012 2v1a3 3 0 01-3 3"/><path d="M7 5H5a2 2 0 00-2 2v1a3 3 0 003 3"/>
      </svg>
    </a>
    <a href="prof.html" class="tab-btn" title="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="screen-flash" id="screenFlash"></div>

<script>
(function() {
  'use strict';

  var API_BASE = 'https://save-pahom.duckdns.org';

  function $(id) { return document.getElementById(id); }

  var sexpahCountEl = $('sexpahCount');
  var sexpahBox = $('sexpahBox');
  var currentToolInfo = $('currentToolInfo');
  var currentToolIconEl = $('currentToolIcon');
  var currentToolNameEl = $('currentToolName');
  var buffsTop = $('buffsTop');
  var toastEl = $('toast');
  var screenFlash = $('screenFlash');

  var tabItems = $('tabItems');
  var tabBuffs = $('tabBuffs');
  var tabInventory = $('tabInventory');
  var pageItems = $('pageItems');
  var pageBuffs = $('pageBuffs');
  var pageInventory = $('pageInventory');
  var itemsPanel = $('itemsPanel');
  var buffsPanel = $('buffsPanel');
  var inventoryList = $('inventoryList');

  var SVG_DARK_KATANA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3-3" stroke="#6a4a2a"/><path d="M6 18l12-12" stroke="#1a1a1a"/><path d="M18 6l3-3" stroke="#333"/><path d="M6 18l-2 2" stroke="#4a2a1a"/><path d="M5 19l1 1" stroke="#2a1a0a"/><path d="M14 8l2 2" stroke="#555"/></svg>';
  var SVG_ABYSS_BLADE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3-3" stroke="#8b0000"/><path d="M6 18l12-12" stroke="#ff3b3b"/><path d="M18 6l3-3" stroke="#ff6a3b"/><path d="M6 18l-2 2" stroke="#5a0000"/><path d="M5 19l1 1" stroke="#3a0000"/><path d="M14 8l2 2" stroke="#ff8c3c"/><circle cx="19" cy="5" r="1.5" fill="#ffd76b" stroke="none"/></svg>';

  var WEAPONS_ORDER = ['hand','whip','stick','shank','shovel','commissar','drin','tyrchik','darkkatana','abysblade'];

  var weapons = {
    hand:       { name:'Рука',          icon:'✋',  clickPower:1,  price:0,       rarity:'common' },
    whip:       { name:'Плетка',        icon:'🐍',  clickPower:3,  price:1000,    rarity:'common' },
    stick:      { name:'Палка',         icon:'🥢',  clickPower:5,  price:5000,    rarity:'common' },
    shank:      { name:'Черенок',       icon:'🔧',  clickPower:7,  price:25000,   rarity:'rare' },
    shovel:     { name:'Лопата',        icon:'🪏',  clickPower:9,  price:55000,   rarity:'rare' },
    commissar:  { name:'Замполит',      icon:'🎖️', clickPower:11, price:100000,  rarity:'rare' },
    drin:       { name:'Дрын',          icon:'🌲',  clickPower:13, price:200000,  rarity:'legendary' },
    tyrchik:    { name:'Тырчик',        icon:'⚡',  clickPower:15, price:400000,  rarity:'legendary' },
    darkkatana: { name:'Тёмная катана', icon:null,  svg:SVG_DARK_KATANA, clickPower:20, price:750000,  rarity:'mythic' },
    abysblade:  { name:'Клинок бездны', icon:null,  svg:SVG_ABYSS_BLADE, clickPower:25, price:1200000, rarity:'mythic' }
  };

  var RARITY_LABEL = {
    common: '⚪️ Обычный',
    rare: '🔵 Редкий',
    legendary: '🟡 Легендарный',
    mythic: '🟣 Мифический',
    divine: '🔘 Божественный'
  };
  
  function weaponIconHTML(w) {
    if (w.svg) return w.svg;
    return w.icon || '✋';
  }

  var buffs = {
    viagra: { name: 'Виагра', icon: '💊', price: 5000, duration: 5 * 60 * 1000, desc: 'Пахом возбуждается медленнее' },
    cigs:   { name: 'Пачка сигарет', icon: '🚬', price: 10000, duration: 5 * 60 * 1000, desc: 'Макс. любовь 500' }
  };

  var WEAPONS_OWNED_KEY = 'pahomWeaponsOwned';
  var LOCK_DURATION = 1000;

  var sexpah = 0;
  var currentTool = 'hand';
  var bossInventory = {};
  var activeBuffs = {};

  function getUserId() {
    try { if (window.tgSyncUserId) return window.tgSyncUserId; } catch(e) {}
    try { return localStorage.getItem('pahomServerUserId') || ''; } catch(e) { return ''; }
  }

  function reloadState() {
    try { sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0; } catch(e) { sexpah = 0; }
    try { currentTool = localStorage.getItem('pahomTool') || 'hand'; } catch(e) { currentTool = 'hand'; }
    try { bossInventory = JSON.parse(localStorage.getItem('pahomBossInventory') || '{}') || {}; } catch(e) { bossInventory = {}; }
    try { activeBuffs = JSON.parse(localStorage.getItem('pahomBuffs') || '{}') || {}; } catch(e) { activeBuffs = {}; }
  }

  function formatSexpah(n) {
    if (n >= 1000000000) { var v = n / 1000000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'B'; }
    if (n >= 1000000) { var v = n / 1000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'M'; }
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatTime(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var min = Math.floor(totalSec / 60);
    var sec = totalSec % 60;
    return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function showToast(text, isError) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.toggle('error', !!isError);
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
  }

  function flashScreen(isRed) {
    if (!screenFlash) return;
    screenFlash.classList.remove('go', 'red');
    void screenFlash.offsetWidth;
    screenFlash.classList.toggle('red', !!isRed);
    screenFlash.classList.add('go');
  }

  function spawnSparks(x, y, count) {
    for (var i = 0; i < count; i++) {
      var s = document.createElement('div');
      s.className = 'spark';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      var a = Math.random() * Math.PI * 2;
      var d = 30 + Math.random() * 60;
      s.style.setProperty('--tx', Math.cos(a) * d + 'px');
      s.style.setProperty('--ty', Math.sin(a) * d + 'px');
      s.style.animationDelay = (i * 0.02) + 's';
      document.body.appendChild(s);
      s.addEventListener('animationend', function() {
        if (s.parentNode) s.parentNode.removeChild(s);
      });
    }
  }

  function flyChip(x, y, text) {
    var chip = document.createElement('div');
    chip.className = 'fly-chip minus';
    chip.textContent = text;
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    var boxRect = sexpahBox.getBoundingClientRect();
    var dx = boxRect.left + boxRect.width / 2 - x;
    var dy = boxRect.top + boxRect.height / 2 - y;
    chip.style.setProperty('--dx', dx + 'px');
    chip.style.setProperty('--dy', dy + 'px');
    document.body.appendChild(chip);
    chip.addEventListener('animationend', function() {
      if (chip.parentNode) chip.parentNode.removeChild(chip);
    });
  }

  function flyIcon(x, y, emoji) {
    var icon = document.createElement('div');
    icon.className = 'fly-icon';
    icon.textContent = emoji;
    icon.style.left = x + 'px';
    icon.style.top = y + 'px';
    var boxRect = sexpahBox.getBoundingClientRect();
    var mx = boxRect.left + boxRect.width / 2 - x;
    var my = boxRect.top + boxRect.height / 2 - y;
    icon.style.setProperty('--mx', mx + 'px');
    icon.style.setProperty('--my', my + 'px');
    document.body.appendChild(icon);
    icon.addEventListener('animationend', function() {
      if (icon.parentNode) icon.parentNode.removeChild(icon);
    });
  }

  function getOwnedWeapons() {
    try {
      var raw = JSON.parse(localStorage.getItem(WEAPONS_OWNED_KEY) || 'null');
      if (Array.isArray(raw)) return raw;
    } catch(e) {}
    return ['hand'];
  }

  function setOwnedWeapons(arr) {
    try { localStorage.setItem(WEAPONS_OWNED_KEY, JSON.stringify(arr)); } catch(e) {}
  }

  function isWeaponOwned(id) {
    return getOwnedWeapons().indexOf(id) !== -1;
  }

  /* ==================== ОБРАБОТКА КНОПКИ ==================== */
  async function processBtn(btn, labelEl, payload) {
    var userId = getUserId();
    if (!userId) {
      showToast('Не удалось определить игрока', true);
      return { ok: false };
    }

    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;

    btn.classList.add('loading');
    labelEl.textContent = 'Обработка';

    try {
      var resp = await fetch(API_BASE + '/api/transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ userId: userId }, payload))
      }).then(function(r) { return r.json(); });

      if (!resp || !resp.ok) {
        btn.classList.remove('loading');
        btn.classList.add('error');
        labelEl.textContent = 'Ошибка';
        flashScreen(true);
        sexpahBox.classList.add('flash-red');
        setTimeout(function() { sexpahBox.classList.remove('flash-red'); }, 600);
        showToast('✗ ' + (resp.reason || 'Ошибка'), true);
        setTimeout(function() {
          btn.classList.remove('error');
          renderAll();
        }, LOCK_DURATION);
        return { ok: false };
      }

      // Вариант 3: перечитываем всё с сервера, чтобы localStorage === сервер
            if (window.tgSyncLoad) {
              window.tgSyncLoad(function(loaded) {
                if (!loaded) {
                  // fallback
                  sexpah = resp.newBalance;
                  try { localStorage.setItem('pahomSexpah', String(sexpah)); } catch(e) {}
                } else {
                  try { sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0; } catch(e) {}
                }
                updateHeaderUI();
              });
            } else {
              sexpah = resp.newBalance;
              try { localStorage.setItem('pahomSexpah', String(sexpah)); } catch(e) {}
              updateHeaderUI();
            }
      
            flashScreen(false);
            flyChip(cx, cy, '−' + formatSexpah(payload.price || 0));
            spawnSparks(cx, cy, 10);
            sexpahBox.classList.add('flash-red');
            setTimeout(function() { sexpahBox.classList.remove('flash-red'); }, 600);
      
            btn.classList.remove('loading');
            btn.classList.add('success');
            labelEl.textContent = 'Готово';
      
            showToast('✓ Куплено');
            return { ok: true, resp: resp };

    } catch(err) {
          btn.classList.remove('loading');
          btn.classList.add('error');
          labelEl.textContent = 'Сбой';
          flashScreen(true);
          showToast('✗ Ошибка сети', true);
          setTimeout(function() {
            btn.classList.remove('error');
            renderAll();
          }, LOCK_DURATION);
          return { ok: false };
        }
  }

  /* ==================== РЕНДЕР ==================== */
  function updateHeaderUI() {
    sexpahCountEl.textContent = formatSexpah(sexpah);
    var w = weapons[currentTool] || weapons.hand;
    if (w.svg) {
      currentToolIconEl.innerHTML = '<span class="weapon-svg" style="display:inline-block;width:1.15em;height:1.15em;vertical-align:middle;">' + w.svg + '</span>';
    } else {
      currentToolIconEl.textContent = w.icon;
    }
    currentToolNameEl.textContent = w.name;
    currentToolInfo.classList.remove('rarity-common','rarity-rare','rarity-legendary','rarity-mythic','rarity-divine');
    currentToolInfo.classList.add('rarity-' + w.rarity);
  }

  function renderWeaponCard(key) {
    var w = weapons[key];
    var owned = isWeaponOwned(key);

    var item = document.createElement('div');
    item.className = 'shop-item rarity-' + w.rarity;

    var actionHTML;
    if (owned) {
      actionHTML = '<button class="weapon-action owned" disabled>Куплено ✓</button>';
    } else {
      var canAfford = sexpah >= w.price;
      actionHTML = '<button class="weapon-action buy" data-weapon="' + key + '"' +
        (canAfford ? '' : ' disabled') + '>' +
        '<span class="spinner"></span>' +
        '<span class="label">' + (canAfford ? 'Купить ' + formatSexpah(w.price) : 'Нужно ' + formatSexpah(w.price)) + '</span>' +
        '</button>';
    }

    item.innerHTML =
      '<div class="shop-item-icon">' + weaponIconHTML(w) + '</div>' +
      '<div class="shop-item-info-text">' +
        '<div class="item-name">' + w.name + '</div>' +
        '<div class="item-desc">+' + w.clickPower + ' за клик</div>' +
        '<div class="item-rarity">' + RARITY_LABEL[w.rarity] + '</div>' +
      '</div>' +
      actionHTML;

    return item;
  }

  function renderItems() {
    itemsPanel.innerHTML = '';
    WEAPONS_ORDER.forEach(function(key) {
      itemsPanel.appendChild(renderWeaponCard(key));
    });
  }

  function renderBuffs() {
    buffsPanel.innerHTML = '';
    Object.keys(buffs).forEach(function(key) {
      var buff = buffs[key];
      var item = document.createElement('div');
      item.className = 'shop-item';
      var canAfford = sexpah >= buff.price;
      item.innerHTML =
        '<div class="shop-item-icon">' + buff.icon + '</div>' +
        '<div class="shop-item-info-text">' +
          '<div class="item-name">' + buff.name + '</div>' +
          '<div class="item-desc">' + buff.desc + ' · 5 мин</div>' +
          '<div class="item-rarity" style="color:var(--accent-2);">💰 ' + formatSexpah(buff.price) + '</div>' +
        '</div>' +
        '<button class="weapon-action buy" data-buff="' + key + '"' +
          (canAfford ? '' : ' disabled') + '>' +
          '<span class="spinner"></span>' +
          '<span class="label">Купить</span>' +
        '</button>';
      buffsPanel.appendChild(item);
    });
  }

  function renderInventory() {
    inventoryList.innerHTML = '';

    var wSection = document.createElement('div');
    wSection.className = 'inventory-section';
    wSection.innerHTML = '<div class="inventory-section-title">Моё оружие</div>';
    inventoryList.appendChild(wSection);

    var ownedIds = getOwnedWeapons().filter(function(id) { return !!weapons[id]; });
    ownedIds.sort(function(a, b) { return WEAPONS_ORDER.indexOf(a) - WEAPONS_ORDER.indexOf(b); });

    ownedIds.forEach(function(id) {
      var w = weapons[id];
      var equipped = (id === currentTool);
      var card = document.createElement('div');
      card.className = 'inv-weapon-card rarity-' + w.rarity;
      card.innerHTML =
        '<div class="inv-weapon-icon">' + weaponIconHTML(w) + '</div>' +
        '<div class="inv-weapon-info">' +
          '<div class="inv-weapon-name">' + w.name + (equipped ? ' · <span style="color:var(--accent-2)">экип.</span>' : '') + '</div>' +
          '<div class="inv-weapon-dmg">+' + w.clickPower + ' за клик · <b>' + RARITY_LABEL[w.rarity] + '</b></div>' +
        '</div>' +
        (equipped
          ? '<button class="weapon-action equipped" disabled>✓</button>'
          : '<button class="weapon-action equip" data-weapon="' + id + '" data-action="equip-inv">Экип.</button>');
      wSection.appendChild(card);
    });
  }

  function renderBuffsTop() {
    if (!buffsTop) return;
    var now = Date.now();
    var hasViagra = activeBuffs.viagra && activeBuffs.viagra > now;
    var hasCigs = activeBuffs.cigs && activeBuffs.cigs > now;
    if (!hasViagra && !hasCigs) {
      buffsTop.classList.add('hidden');
      buffsTop.innerHTML = '';
      return;
    }
    buffsTop.classList.remove('hidden');
    buffsTop.innerHTML = '';
    if (hasViagra) {
      var c1 = document.createElement('div');
      c1.className = 'buff-chip';
      c1.innerHTML = '<span>💊</span><span>' + formatTime(activeBuffs.viagra - now) + '</span>';
      buffsTop.appendChild(c1);
    }
    if (hasCigs) {
      var c2 = document.createElement('div');
      c2.className = 'buff-chip';
      c2.innerHTML = '<span>🚬</span><span>' + formatTime(activeBuffs.cigs - now) + '</span>';
      buffsTop.appendChild(c2);
    }
  }

  function renderAll() {
    reloadState();
    updateHeaderUI();
    renderBuffsTop();
    renderItems();
    renderBuffs();
    renderInventory();
  }

  /* ==================== КЛИКИ ==================== */
  itemsPanel.addEventListener('click', async function(e) {
    var btn = e.target.closest('.weapon-action.buy');
    if (!btn || btn.disabled) return;
    var id = btn.dataset.weapon;
    if (!id || !weapons[id]) return;

    var labelEl = btn.querySelector('.label');
    var res = await processBtn(btn, labelEl, {
      action: 'buy',
      itemId: id,
      price: weapons[id].price
    });

    if (res.ok) {
          // Локально обновим owned (сервер уже записал то же самое)
          var owned = getOwnedWeapons();
          if (owned.indexOf(id) === -1) owned.push(id);
          setOwnedWeapons(owned);
    
          setTimeout(function() {
            // Вариант 3: перечитаем с сервера, чтобы pahomBossInventory / pahomBossStats / pahomBossState не откатились
            if (window.tgSyncLoad) {
              window.tgSyncLoad(function() { renderAll(); });
            } else {
              renderAll();
            }
          }, LOCK_DURATION);
        }
  });

  inventoryList.addEventListener('click', function(e) {
    var btn = e.target.closest('.weapon-action.equip');
    if (!btn || btn.disabled) return;
    var id = btn.dataset.weapon;
    if (!id || !weapons[id]) return;
    if (!isWeaponOwned(id)) return;
    currentTool = id;
    try { localStorage.setItem('pahomTool', currentTool); } catch(e) {}
    try { if (window.tgSyncSave) window.tgSyncSave(true); } catch(e) {}
    renderAll();
    showToast('Экипировано: ' + weapons[id].name);
  });

  buffsPanel.addEventListener('click', async function(e) {
    var btn = e.target.closest('.weapon-action.buy');
    if (!btn || btn.disabled) return;
    var key = btn.dataset.buff;
    if (!key || !buffs[key]) return;

    var labelEl = btn.querySelector('.label');
    var res = await processBtn(btn, labelEl, {
      action: 'buy',
      itemId: key,
      price: buffs[key].price
    });

    if (res.ok) {
          setTimeout(function() {
            // Вариант 3: перечитаем с сервера — там уже обновлён pahomBuffs
            if (window.tgSyncLoad) {
              window.tgSyncLoad(function() { renderAll(); });
            } else {
              renderAll();
            }
          }, LOCK_DURATION);
        }
  });

  var currentTab = 'items';
  function switchShopTab(tab) {
    if (tab === currentTab) return;
    tabItems.classList.toggle('active', tab === 'items');
    tabBuffs.classList.toggle('active', tab === 'buffs');
    tabInventory.classList.toggle('active', tab === 'inventory');
    pageItems.classList.toggle('active', tab === 'items');
    pageBuffs.classList.toggle('active', tab === 'buffs');
    pageInventory.classList.toggle('active', tab === 'inventory');
    currentTab = tab;
    renderAll();
  }

  tabItems.addEventListener('click', function() { switchShopTab('items'); });
  tabBuffs.addEventListener('click', function() { switchShopTab('buffs'); });
  tabInventory.addEventListener('click', function() { switchShopTab('inventory'); });

  // Обновление счёта и баффов раз в секунду
  setInterval(function() {
    var oldSexpah = sexpah;
    reloadState();
    renderBuffsTop();
    if (oldSexpah !== sexpah) {
      updateHeaderUI();
    }
  }, 1000);

  window.addEventListener('storage', function(e) {
    if (e.key === 'pahomSexpah' || e.key === 'pahomTool' || e.key === 'pahomBossInventory' || e.key === WEAPONS_OWNED_KEY || e.key === 'pahomBuffs') {
      renderAll();
    }
  });

  function init() {
    renderAll();
    if (location.hash === '#inventory') switchShopTab('inventory');
    try {
      if (window.tgSyncReady) {
        window.tgSyncLoad(function(loaded) {
          if (loaded) renderAll();
        });
      }
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="income.js"></script>
<script src="server-sync.js"></script>
</body>
</html>
