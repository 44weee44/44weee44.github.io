<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>БОССЫ — кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
:root {
  --bg-0:#0a0a0c;
  --bg-1:#121216;
  --bg-2:#18181f;
  --line:#24242c;
  --line-2:#33333d;
  --text:#e8e8ec;
  --text-2:#8a8a92;
  --text-3:#5a5a62;
  --accent:#2a8a30;
  --accent-2:#7af080;
  --green:#4cd964;
  --red:#ff4a4a;
  --gold:#ffd76b;
}
html, body {
  background:#050506;
  width:100%; height:100%;
  margin:0;
  font-family:-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Arial, sans-serif;
  color:var(--text);
  overflow:hidden;
}
body { display:flex; justify-content:center; align-items:center; touch-action:manipulation; }

.game-container {
  width:100%; max-width:520px; height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  background:var(--bg-0);
  position:relative; min-height:0; overflow:hidden;
  animation:fadeInSoft 0.5s ease-out;
}
@keyframes fadeInSoft { from { opacity:0.6; } to { opacity:1; } }

.game-container::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
}
.game-container::after {
  content:'';
  position:absolute;
  top:-40%; left:50%;
  transform:translateX(-50%);
  width:500px; height:500px;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(42,138,48,0.05) 30deg, transparent 60deg,
    transparent 300deg, rgba(42,138,48,0.05) 330deg, transparent 360deg);
  animation:spotlight 24s linear infinite;
  pointer-events:none;
  z-index:0;
  filter:blur(30px);
}
@keyframes spotlight { 0% { transform:translateX(-50%) rotate(0); } 100% { transform:translateX(-50%) rotate(360deg); } }

/* ШАПКА */
.header {
  position:relative;
  z-index:5;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  min-height:56px;
  flex-shrink:0;
}
.header::after {
  content:'';
  position:absolute;
  left:20%; right:20%;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-2), transparent);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.header-title {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  font-weight:800;
  letter-spacing:5px;
  font-size:1.25rem;
  text-transform:uppercase;
}
.header-title::before {
  content:'';
  width:8px; height:8px;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transform:rotate(45deg);
}
.header-title svg { display:none; }

/* СЧЁТ */
.score-board {
  position:relative;
  z-index:5;
  padding:8px 15px;
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.sexpah, .tool-info {
  flex:1;
  padding:5px 12px;
  border-radius:8px;
  background:var(--bg-1);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  font-size:0.82rem;
  font-weight:700;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:0.2px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  white-space:nowrap;
}
.sexpah { flex:1.4; }
.tool-info { flex:1; }

/* Левая акцентная полоса — зелёная по умолчанию, меняется у оружия */
.sexpah::before, .tool-info::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:3px; height:100%;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transition:background 0.3s ease, box-shadow 0.3s ease;
}

.sexpah.bump { transform:scale(1.06); box-shadow:0 0 20px rgba(42,138,48,0.6); }

/* ==== СЕКСПАХОМЫ — зелёный фон ==== */
.sexpah {
  background:linear-gradient(135deg, rgba(42,138,48,0.15), rgba(20,40,22,0.4));
  border-color:rgba(122,240,128,0.35);
}
.sexpah::before { background:var(--accent-2); box-shadow:0 0 12px rgba(42,138,48,0.9); }

/* ==== ОРУЖИЕ — фон и рамка по редкости ==== */
.tool-info.rarity-common {
  background:linear-gradient(135deg, rgba(154,154,154,0.15), rgba(30,30,34,0.4));
  border-color:rgba(180,180,200,0.4);
}
.tool-info.rarity-common::before {
  background:#b4b4c8;
  box-shadow:0 0 12px rgba(180,180,200,0.9);
}

.tool-info.rarity-rare {
  background:linear-gradient(135deg, rgba(59,130,246,0.18), rgba(15,25,50,0.4));
  border-color:rgba(59,130,246,0.55);
}
.tool-info.rarity-rare::before {
  background:#5aa8ff;
  box-shadow:0 0 12px rgba(90,168,255,0.9);
}

.tool-info.rarity-legendary {
  background:linear-gradient(135deg, rgba(255,215,107,0.18), rgba(50,40,10,0.4));
  border-color:rgba(255,215,107,0.55);
}
.tool-info.rarity-legendary::before {
  background:#ffd76b;
  box-shadow:0 0 12px rgba(255,215,107,0.9);
}

.tool-info.rarity-mythic {
  background:linear-gradient(135deg, rgba(168,85,247,0.18), rgba(40,15,60,0.4));
  border-color:rgba(168,85,247,0.55);
}
.tool-info.rarity-mythic::before {
  background:#a855f7;
  box-shadow:0 0 12px rgba(168,85,247,0.9);
}

.tool-info.rarity-divine {
  background:linear-gradient(135deg, rgba(255,59,59,0.18), rgba(60,10,10,0.4));
  border-color:rgba(255,59,59,0.6);
}
.tool-info.rarity-divine::before {
  background:#ff3b3b;
  box-shadow:0 0 12px rgba(255,59,59,0.9);
}

/* NOTIFY */
.notify-bar {
  position:relative;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:0 16px;
  flex-shrink:0;
  z-index:100;
  pointer-events:none;
}
.notify-bar:empty { padding:0; }
.notify-chip {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  background:var(--bg-2);
  border:1px solid var(--accent-2);
  border-radius:10px;
  font-size:0.82rem;
  font-weight:700;
  color:var(--accent-2);
  box-shadow:0 0 20px rgba(42,138,48,0.5);
  animation:chipIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  align-self:flex-start;
  font-family:'Courier New', monospace;
}
.notify-chip .notify-icon img { width:1.2rem; height:1.2rem; object-fit:contain; border-radius:3px; vertical-align:middle; }
.notify-chip.leaving { animation:chipOut 0.35s ease forwards; }
@keyframes chipIn { from { opacity:0; transform:translateY(-12px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes chipOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-10px) scale(0.95); } }

.hidden { display:none !important; }

/* ТАБЫ БОССОВ — свечение как в seks (glow-блик на .active::before) */
.boss-tabs {
  position:relative;
  z-index:20;
  display:flex;
  gap:10px;
  padding:12px 16px;
  flex-shrink:0;
}
.boss-tab {
  flex:1;
  background:linear-gradient(135deg, rgba(30,30,20,0.75), rgba(18,18,12,0.75));
  border:1px solid var(--line);
  color:var(--text-3);
  padding:12px 6px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  font-size:0.72rem;
  transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing:1.6px;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
  font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
}
.boss-tab::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent 30%, rgba(122,240,128,0.15) 50%, transparent 70%);
  transform:translateX(-100%);
  transition:transform 0.7s ease;
  pointer-events:none;
}
.boss-tab::after {
  content:'';
  position:absolute;
  bottom:0; left:50%;
  transform:translateX(-50%) scaleX(0);
  width:70%; height:2px;
  background:linear-gradient(90deg, transparent, var(--accent-2), transparent);
  transition:transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-radius:2px;
}
.boss-tab:hover:not(.active) {
  border-color:rgba(122,240,128,0.4);
  transform:translateY(-2px);
  color:var(--text-2);
  box-shadow:0 6px 18px rgba(0,0,0,0.6), 0 0 18px rgba(42,138,48,0.2);
}
.boss-tab.active {
  border-color:var(--accent-2);
  background:linear-gradient(135deg, rgba(42,138,48,0.35), rgba(20,60,24,0.25));
  color:var(--accent-2);
  box-shadow:0 0 25px rgba(42,138,48,0.5), inset 0 0 18px rgba(122,240,128,0.1), 0 4px 12px rgba(0,0,0,0.5);
  transform:translateY(-2px);
  text-shadow:0 0 10px rgba(122,240,128,0.6);
}
.boss-tab.active::before { transform:translateX(100%); }
.boss-tab.active::after { transform:translateX(-50%) scaleX(1); }
.boss-tab:active { transform:translateY(0) scale(0.97); }

/* СПИСОК */
.boss-list {
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 16px 5px;
  display:flex;
  flex-direction:column;
  gap:12px;
  scrollbar-width:thin;
  scrollbar-color:var(--line-2) transparent;
  position:relative;
  z-index:5;
}
.boss-list::-webkit-scrollbar { width:5px; }
.boss-list::-webkit-scrollbar-track { background:transparent; }
.boss-list::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:3px; }

/* КАРТОЧКА БОССА (обычная) */
.boss-card {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg-1);
  cursor:pointer; flex-shrink:0;
  position: relative;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.5s ease,
              background 0.5s ease,
              box-shadow 0.5s ease;
  animation: cardSlide 0.6s ease both;
}
.boss-card:nth-child(1) { animation-delay: 0.05s; }
.boss-card:nth-child(2) { animation-delay: 0.12s; }
.boss-card:nth-child(3) { animation-delay: 0.19s; }
.boss-card:nth-child(4) { animation-delay: 0.26s; }
.boss-card:nth-child(5) { animation-delay: 0.33s; }
.boss-card:nth-child(6) { animation-delay: 0.40s; }
@keyframes cardSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}
.boss-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 15%;
  bottom: 15%;
  width: 3px;
  background: linear-gradient(180deg, transparent, var(--accent-2), transparent);
  border-radius: 3px;
  opacity: 0.5;
  transition: opacity 0.5s ease, width 0.5s ease;
}
.boss-card:hover:not(.locked)::before { width: 5px; opacity: 1; box-shadow: 0 0 15px var(--accent-2); }
.boss-card:hover:not(.locked) {
  border-color: var(--accent-2);
  transform: translateX(6px);
  background: #16161b;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 25px rgba(42,138,48,0.25);
}
.boss-card:active:not(.locked) { transform: translateX(6px) scale(0.98); }
.boss-card.locked { opacity: 0.5; filter: grayscale(0.5); }
.boss-card.in-progress { border-color: var(--gold); box-shadow: 0 0 25px rgba(255,215,107,0.4); }
.boss-card.in-progress::before { width: 5px; opacity: 1; background: linear-gradient(180deg, transparent, var(--gold), transparent); box-shadow: 0 0 15px var(--gold); }

/* ИВЕНТ-БОССЫ — оставляю исходные цветные темы */
.boss-card.event-boss { padding: 16px 18px; border-width: 2px; position: relative; overflow: hidden; isolation: isolate; }
.boss-card.event-boss .boss-avatar-wrap { width: 68px; height: 68px; }
.boss-card.event-boss .boss-avatar { width: 68px; height: 68px; border-width: 3px; animation: eventAvatarPulse 3s ease-in-out infinite; }
.boss-card.event-boss .boss-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
@keyframes eventAvatarPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.boss-card.event-boss .boss-name { font-size: 1.15rem; letter-spacing: 0.8px; }

.boss-card.event-boss.abyss {
  border-color: #ffd76b;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,215,107,0.22) 0%, transparent 60%),
    linear-gradient(135deg, rgba(120,95,30,0.75), rgba(60,45,15,0.9));
  box-shadow: 0 0 40px rgba(255,215,107,0.55), inset 0 0 35px rgba(255,215,107,0.18);
}
.boss-card.event-boss.abyss::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 500px; height: 500px;
  margin: -250px 0 0 -250px;
  background: conic-gradient(from 0deg,
    transparent 0deg, rgba(255,215,107,0.4) 8deg, transparent 16deg,
    transparent 30deg, rgba(255,215,107,0.35) 38deg, transparent 46deg,
    transparent 60deg, rgba(255,215,107,0.4) 68deg, transparent 76deg,
    transparent 90deg, rgba(255,215,107,0.35) 98deg, transparent 106deg,
    transparent 120deg, rgba(255,215,107,0.4) 128deg, transparent 136deg,
    transparent 150deg, rgba(255,215,107,0.35) 158deg, transparent 166deg,
    transparent 180deg, rgba(255,215,107,0.4) 188deg, transparent 196deg,
    transparent 210deg, rgba(255,215,107,0.35) 218deg, transparent 226deg,
    transparent 240deg, rgba(255,215,107,0.4) 248deg, transparent 256deg,
    transparent 270deg, rgba(255,215,107,0.35) 278deg, transparent 286deg,
    transparent 300deg, rgba(255,215,107,0.4) 308deg, transparent 316deg,
    transparent 330deg, rgba(255,215,107,0.35) 338deg, transparent 346deg,
    transparent 360deg);
  animation: abyssRays 20s linear infinite;
  pointer-events: none;
  opacity: 0.85;
  z-index: 0;
  filter: blur(0.5px);
}
@keyframes abyssRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.boss-card.event-boss.abyss::before { background: linear-gradient(180deg, transparent, #ffd76b, transparent); box-shadow: 0 0 25px #ffd76b; width: 5px; opacity: 1; z-index: 2; }
.boss-card.event-boss.abyss > * { position: relative; z-index: 1; }
.boss-card.event-boss.abyss .boss-avatar { border-color: #ffd76b; box-shadow: 0 0 30px rgba(255,215,107,0.9), inset 0 0 15px rgba(255,215,107,0.3); }
.boss-card.event-boss.abyss .boss-name { color: #ffd76b; text-shadow: 0 0 15px rgba(255,215,107,0.7); }

.boss-card.event-boss.samurai {
  border-color: #ff5a5a;
  background: radial-gradient(circle at 50% 120%, rgba(255,90,90,0.3) 0%, transparent 60%), linear-gradient(180deg, rgba(140,30,30,0.65) 0%, rgba(60,10,10,0.8) 100%);
  box-shadow: 0 0 30px rgba(255,90,90,0.4), inset 0 0 25px rgba(255,90,90,0.1);
}
.boss-card.event-boss.samurai::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0px, transparent 14px, rgba(255,90,90,0.12) 14px, rgba(255,90,90,0.12) 16px),
    repeating-linear-gradient(90deg, transparent 0px, transparent 22px, rgba(255,90,90,0.08) 22px, rgba(255,90,90,0.08) 23px);
  animation: samuraiInk 8s ease-in-out infinite;
  pointer-events: none;
  opacity: 0.5;
  z-index: 0;
}
@keyframes samuraiInk { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.65; } }
.boss-card.event-boss.samurai::before { background: linear-gradient(180deg, transparent, #ff5a5a, transparent); box-shadow: 0 0 25px #ff5a5a; width: 5px; opacity: 1; z-index: 2; }
.boss-card.event-boss.samurai > * { position: relative; z-index: 1; }
.boss-card.event-boss.samurai .boss-avatar { border-color: #ff5a5a; box-shadow: 0 0 30px rgba(255,90,90,0.9), inset 0 0 15px rgba(255,90,90,0.3); }
.boss-card.event-boss.samurai .boss-name { color: #ff8080; text-shadow: 0 0 15px rgba(255,90,90,0.7); }

.boss-card.event-boss.pantera {
  border-color: #e0e0e0;
  background: radial-gradient(ellipse at 30% 20%, rgba(200,200,220,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(180,180,200,0.12) 0%, transparent 50%), linear-gradient(135deg, rgba(50,50,60,0.7), rgba(15,15,20,0.85));
  box-shadow: 0 0 30px rgba(200,200,220,0.3), inset 0 0 25px rgba(200,200,220,0.08);
}
.boss-card.event-boss.pantera::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.85) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 75% 40%, rgba(255,255,255,0.8) 0%, transparent 100%);
  animation: panteraStars 6s ease-in-out infinite;
  pointer-events: none;
  opacity: 0.8;
  z-index: 0;
}
@keyframes panteraStars { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.boss-card.event-boss.pantera::before { background: linear-gradient(180deg, transparent, #e0e0e0, transparent); box-shadow: 0 0 25px #e0e0e0; width: 5px; opacity: 1; z-index: 2; }
.boss-card.event-boss.pantera > * { position: relative; z-index: 1; }
.boss-card.event-boss.pantera .boss-avatar { border-color: #e0e0e0; box-shadow: 0 0 30px rgba(200,200,220,0.7), inset 0 0 15px rgba(200,200,220,0.3); }
.boss-card.event-boss.pantera .boss-name { color: #f0f0f0; text-shadow: 0 0 15px rgba(200,200,220,0.7); }

.boss-card.event-boss.locked-event { opacity: 0.5; filter: grayscale(0.5); animation: eventLockedBreath 4s ease-in-out infinite; }
@keyframes eventLockedBreath { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.65; } }
.boss-card.event-boss.locked-event:hover { transform: none; }
.boss-card.event-boss.locked-event::after { opacity: 0; }

/* АВАТАР / ИНФО */
.boss-avatar-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
.boss-avatar {
  width:56px; height:56px;
  border-radius:50%;
  border:2px solid var(--line-2);
  background: var(--bg-2);
  display:flex; align-items:center; justify-content:center;
  font-size:1.8rem;
  box-shadow:inset 0 0 15px rgba(0,0,0,0.5);
  transition: transform 0.5s ease, box-shadow 0.5s ease;
  overflow:hidden;
}
.boss-avatar img { width:100%; height:100%; object-fit:contain; border-radius:50%; }
.boss-card:hover:not(.locked) .boss-avatar { box-shadow:0 0 25px rgba(42,138,48,0.6); transform: scale(1.08); }

.boss-info { flex:1; min-width:0; }
.boss-name { font-size:1.05rem; font-weight:800; color:var(--text); margin-bottom:4px; letter-spacing:0.5px; }
.boss-card.in-progress .boss-name { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,107,0.5); }
.boss-meta { display:flex; flex-direction:column; gap:3px; font-size:0.75rem; color:var(--text-2); }
.boss-reward { color:var(--accent-2); font-weight:700; }
.boss-lvl { color:var(--accent-2); font-weight:700; }
.boss-loot { color:#8fd4b0; font-size:0.7rem; display:flex; flex-direction:column; gap:2px; margin-top: 2px; }
.boss-loot .loot-line { display:flex; align-items:center; gap:4px; }
.boss-loot img { width:0.95rem; height:0.95rem; object-fit:contain; border-radius:2px; vertical-align:middle; }

<script>
(function() {
  'use strict';

  function $(id) { return document.getElementById(id); }

  var sexpahCount = $('sexpahCount');
  var sexpahBox = $('sexpahBox');
  var toolInfo = $('toolInfo');
  var bossList = $('bossList');
  var notifyBar = $('notifyBar');
  var arena = $('arena');
  var arenaBossName = $('arenaBossName');
  var arenaTimer = $('arenaTimer');
  var arenaClicks = $('arenaClicks');
  var arenaDamage = $('arenaDamage');
  var bossHitbox = $('bossHitbox');
  var bossFace = $('bossFace');
  var bossClickPower = $('bossClickPower');
  var exciteBarFill = $('exciteBarFill');
  var exciteValue = $('exciteValue');
  var arenaHpFill = $('arenaHpFill');
  var arenaHpPercent = $('arenaHpPercent');
  var resultOverlay = $('resultOverlay');
  var resultTitle = $('resultTitle');
  var resultText = $('resultText');
  var resultReward = $('resultReward');
  var resultLoot = $('resultLoot');
  var resultBtn = $('resultBtn');
  var resultMedal = $('resultMedal');
  var arenaBack = $('arenaBack');
  var tabsBar = $('tabsBar');
  var tabMini = $('tabMini');
  var tabMain = $('tabMain');
  var tabEvent = $('tabEvent');
  var surrenderOverlay = $('surrenderOverlay');
  var surrenderNo = $('surrenderNo');
  var surrenderYes = $('surrenderYes');

  var TOOL_POWER = {
    hand:1, whip:3, stick:5, shank:7, shovel:9,
    commissar:11, drin:13, tyrchik:15, darkkatana:20, abysblade:25
  };

  function getToolPower() {
    try {
      var t = localStorage.getItem('pahomTool') || 'hand';
      return TOOL_POWER[t] || 1;
    } catch(e) { return 1; }
  }

  function getLoveBonus() {
    try {
      var lv = parseInt(localStorage.getItem('pahomUpgradeLove') || '1', 10) || 1;
      return (lv - 1) * 0.5;
    } catch(e) { return 0; }
  }

  function getBossDamage() {
    return 3 + getLoveBonus() + getToolPower() / 2;

  function getSt(id) {
    if (!bossState || typeof bossState !== 'object') bossState = {};
    if (!bossState[id] || typeof bossState[id] !== 'object') bossState[id] = { cooldownUntil:0 };
    var st = bossState[id];
    if (typeof st.cooldownUntil !== 'number' || isNaN(st.cooldownUntil)) st.cooldownUntil = 0;
    return st;
  }

  function defaultState() {
    var s = { __v: STATE_VERSION };
    for (var i = 0; i < BOSSES.length; i++) s[BOSSES[i].id] = { cooldownUntil:0 };
    return s;
  }

  function loadState() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch(e) { raw = null; }
    if (!raw || typeof raw !== 'object') { bossState = defaultState(); saveState(); return; }
    bossState = raw;
    bossState.__v = STATE_VERSION;
    var now = Date.now();
    for (var i = 0; i < BOSSES.length; i++) {
      var b = BOSSES[i];
      var st = getSt(b.id);
      if (st.cooldownUntil > 0 && st.cooldownUntil <= now) st.cooldownUntil = 0;
    }
    saveState();
  }

  function saveState() {

  function isEventActive() {
    var now = new Date();
    var day = now.getDay();
    var h = now.getHours();
    if (day === 6 && h >= 10) return true;
    if (day === 0 && h < 20) return true;
    return false;
  }

  function getEventNextStart() {
    var now = new Date();
    var day = now.getDay();
    var h = now.getHours();
    var next = new Date(now);
    var daysToSat = (6 - day + 7) % 7;
    if (day === 6 && h < 10) daysToSat = 0;
    else if (day === 6 && h >= 10) daysToSat = 7;
    else if (day === 0) daysToSat = 6;
    next.setDate(now.getDate() + daysToSat);
    next.setHours(10, 0, 0, 0);
    return next;
  }

  function fmtEventCountdown() {
    var next = getEventNextStart();
    var ms = next - Date.now();
    if (ms <= 0) return 'скоро';
    var totalMin = Math.floor(ms / 60000);
    var d = Math.floor(totalMin / 1440);
    var h = Math.floor((totalMin % 1440) / 60);
    var m = totalMin % 60;
    if (d > 0) return d + 'д ' + h + 'ч';
    if (h > 0) return h + 'ч ' + m + 'м';
    return m + 'м';
  }

  function fmt(n) {
    if (n >= 1000000000) { var v = n / 1000000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'B'; }
    if (n >= 1000000) { var v = n / 1000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'M'; }
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function fmtTime(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    function p(x) { return (x < 10 ? '0' : '') + x; }
    if (h > 0) return p(h) + ':' + p(m) + ':' + p(s);
    return p(m) + ':' + p(s);
  }

          return '<span class="loot-line">🎁 ' + lootIconHTML(l) + ' ' + l.name + ' (' + l.chance + '%)</span>';

          '<div class="boss-avatar-wrap"><div class="boss-avatar">' + avatarHTML + '</div></div>' +

  function refreshList() {
    var now = Date.now();
    var list = getGroupBosses(currentGroup);
    var eventOn = isEventActive();
    var cards = bossList.querySelectorAll('.boss-card');

    for (var j = 0; j < list.length; j++) {
      var boss = list[j];
      var card = cards[j];
      if (!card) continue;
      var timer = card.querySelector('.boss-timer');
      var status = card.querySelector('.boss-status');
      if (!timer || !status) continue;

      var st = getSt(boss.id);
      card.classList.remove('locked', 'in-progress', 'locked-event');

      if (boss.isEvent && !eventOn) {
        card.classList.add('locked-event');
        status.className = 'boss-status event-time';
        status.textContent = 'ИВЕНТ ЧЕРЕЗ ' + fmtEventCountdown();
        timer.textContent = 'Сб 10:00 – Вс 20:00';
        continue;
      }

      if (st.cooldownUntil > now) {
        card.classList.add('locked');
        status.className = 'boss-status cooldown';
        status.textContent = 'КД';
        timer.textContent = 'Через ' + fmtTime(st.cooldownUntil - now);
      } else {
        status.className = 'boss-status ready';
        status.textContent = 'ГОТОВ';
        timer.textContent = 'Можно атаковать!';
      }
    }
  }

  function onCard(boss) {
    var now = Date.now();
    var st = getSt(boss.id);

    if (boss.isEvent && !isEventActive()) return;
    if (boss.levelReq) {
      var playerLv = parseInt(localStorage.getItem('pahomPlayerLevel') || '1', 10) || 1;
      if (playerLv < boss.levelReq) {
        showNotify('🔒', 'Нужна выслуга ' + boss.levelReq + ' лет');
        return;
      }
    }
    if (st.cooldownUntil > now) return;

    enterFight(boss);
  }

  var currentBoss = null;
  var fightInterval = null;
  var tickerInterval = null;
  var isFightActive = false;
  var lastClick = 0;
  var fightState = null;

  function enterFight(boss) {
    var now = Date.now();
    var st = getSt(boss.id);

    if (st.cooldownUntil > now) return;

    fightState = {
      endAt: now + boss.fightDuration,
      clicks: 0,
      damage: 0,
      excite: 0,
      startedAt: now
    };

    currentBoss = boss;
    isFightActive = true;
    lastClick = 0;

    bossList.style.display = 'none';
    document.getElementById('bossTabs').style.display = 'none';
    arena.classList.add('active');
    tabsBar.classList.add('hidden');

    arenaBossName.textContent = boss.name.toUpperCase();

    if (boss.image) {
      bossFace.innerHTML = '<img src="' + boss.image + '" alt="' + boss.name + '">';
      bossFace.style.fontSize = '0';
    } else {
      bossFace.innerHTML = '';
      bossFace.textContent = boss.face;
      bossFace.style.fontSize = '';
    }

    var power = getBossDamage();
    bossClickPower.textContent = '+' + (Math.floor(power * 10) / 10);

    arenaClicks.textContent = '0';
    arenaDamage.textContent = '0';
    exciteValue.textContent = '0 / ' + fmt(boss.exciteMax);

    updateBar();
    updateHitbox();
    updateTimer();
    if (fightInterval) clearInterval(fightInterval);
    fightInterval = setInterval(updateTimer, 250);
  }

  function updateBar() {
    if (!currentBoss || !fightState) return;
    var pct = Math.min(100, (fightState.excite / currentBoss.exciteMax) * 100);
    exciteBarFill.style.width = pct + '%';
    if (arenaHpFill) arenaHpFill.style.width = pct + '%';
    if (arenaHpPercent) arenaHpPercent.textContent = Math.round(pct) + '%';
  }

  function updateHitbox() {
    if (!currentBoss || !fightState) return;
    var pct = fightState.excite / currentBoss.exciteMax;
    bossHitbox.classList.remove('hot', 'critical');
    if (pct >= 0.85) bossHitbox.classList.add('critical');
    else if (pct >= 0.5) bossHitbox.classList.add('hot');
  }

  function updateTimer() {
    if (!isFightActive || !currentBoss || !fightState) return;
    var now = Date.now();
    var remain = fightState.endAt - now;
    if (remain <= 0) { endFight(currentBoss, false); return; }
    arenaTimer.textContent = fmtTime(remain);
    arenaTimer.classList.toggle('danger', remain < 60000);
  }

  function hitBoss() {
    if (!isFightActive || !currentBoss || !fightState) return;
    var now = Date.now();
    if (now - lastClick < 55) return;
    lastClick = now;

    if (fightState.endAt <= now) { endFight(currentBoss, false); return; }

   
    var power = getBossDamage();
        fightState.clicks++;
        fightState.damage += power;
        fightState.excite += power;
        if (fightState.excite >= currentBoss.exciteMax) fightState.excite = currentBoss.exciteMax;

    arenaClicks.textContent = String(fightState.clicks);
    arenaDamage.textContent = String(Math.floor(fightState.damage));
    bumpEl(arenaClicks);
    bumpEl(arenaDamage);

    exciteValue.textContent = fmt(fightState.excite) + ' / ' + fmt(currentBoss.exciteMax);
    bumpEl(exciteValue);

    updateBar();
    updateHitbox();

    var rect = bossHitbox.getBoundingClientRect();
    var cx = rect.left + rect.width/2 + (Math.random()-0.5)*rect.width*0.4;
    var cy = rect.top + rect.height/2 + (Math.random()-0.5)*rect.height*0.4;
    playClickNumbers(cx, cy, Math.floor(power*10)/10);

    if (fightState.excite >= currentBoss.exciteMax) {
      endFight(currentBoss, true);
    }
  }

  function spawnNumber(x, y, text, isMini) {
    var el = document.createElement('div');
    el.className = 'float-text';
    if (Math.random() < 0.2) el.classList.add('sway');
    if (isMini) el.classList.add('mini');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, { once: true });
  }

  function playClickNumbers(x, y, gained) {
    spawnNumber(x, y, '-' + gained, false);
    var extraCount = 1 + (Math.random() < 0.5 ? 1 : 0);
    for (var i = 0; i < extraCount; i++) {
      (function(idx) {
        setTimeout(function() {
          var ox = x + (Math.random() - 0.5) * 50;
          var oy = y + (Math.random() - 0.5) * 50;
          spawnNumber(ox, oy, '-' + gained, true);
        }, 30 + idx * 25);
      })(i);
    }
  }

    if (fightInterval) { clearInterval(fightInterval); fightInterval = null; }

    arena.classList.remove('active');

  function saveAndSync() {
    try { if (window.pahomSaveNow) window.pahomSaveNow(); } catch(e) {}
    try { if (window.pahomForceSave) window.pahomForceSave(); } catch(e) {}
  }

  function endFight(boss, win) {
    if (!boss || !fightState) return;
    var now = Date.now();
    var st = getSt(boss.id);
    isFightActive = false;
    if (fightInterval) { clearInterval(fightInterval); fightInterval = null; }
    var droppedItems = [];

    if (win) {
      sexpah += boss.reward;
      try { localStorage.setItem('pahomSexpah', String(sexpah)); } catch(e) {}
      updateScore();
      bumpEl(sexpahBox);

      try {
        var exp = parseInt(localStorage.getItem('pahomPlayerExp') || '0', 10) || 0;
        var lv = parseInt(localStorage.getItem('pahomPlayerLevel') || '1', 10) || 1;
        exp += (boss.exp || boss.lvl || 0);
        while (exp >= getExpReq(lv)) { exp -= getExpReq(lv); lv++; }
        localStorage.setItem('pahomPlayerExp', String(exp));
        localStorage.setItem('pahomPlayerLevel', String(lv));
      } catch(e) {}

      var bossStats = { wins: 0, losses: 0, earned: 0 };
      try {
        var raw = JSON.parse(localStorage.getItem('pahomBossStats') || 'null');
        if (raw && typeof raw === 'object') {
          bossStats = { wins: raw.wins || 0, losses: raw.losses || 0, earned: raw.earned || 0 };
        }
      } catch(e) {}
      bossStats.wins++;
      bossStats.earned += boss.reward;
      try { localStorage.setItem('pahomBossStats', JSON.stringify(bossStats)); } catch(e) {}

      var lootUpLevel = 1;
      try { lootUpLevel = parseInt(localStorage.getItem('pahomUpgradeLoot') || '1', 10) || 1; } catch(e) {}
      var lootBonusPct = (lootUpLevel - 1) * 5;

      var lootArr = Array.isArray(boss.loot) ? boss.loot : (boss.loot ? [boss.loot] : []);
      lootArr.forEach(function(lootItem) {
        var effectiveChance = lootItem.chance + lootBonusPct;
        if (Math.random()*100 < effectiveChance) {
          var lid = lootItem.id;
          if (!bossInventory[lid]) bossInventory[lid] = 0;
          if (bossInventory[lid] < LOOT_MAX) {
            bossInventory[lid]++;
            droppedItems.push(lootItem);
          }
        }
      });
      if (droppedItems.length) {
        try { localStorage.setItem('pahomBossInventory', JSON.stringify(bossInventory)); } catch(e) {}
      }

      st.cooldownUntil = now + boss.cooldownDuration;
      saveState();
      saveAndSync();

      droppedItems.forEach(function(item, i) {
        showNotify(lootIconHTML(item), 'ВЫПАЛ: ' + item.name, i * 300);
      });

      setTimeout(function() {
        showBossList();
        showResult(true, boss.reward, boss.exp || boss.lvl, droppedItems);
      }, 600);
      return;
    } else {
      st.cooldownUntil = now + boss.cooldownDuration;
      saveState();

      var bossStats2 = { wins: 0, losses: 0, earned: 0 };
      try {
        var raw2 = JSON.parse(localStorage.getItem('pahomBossStats') || 'null');
        if (raw2 && typeof raw2 === 'object') {
          bossStats2 = { wins: raw2.wins || 0, losses: raw2.losses || 0, earned: raw2.earned || 0 };
        }
      } catch(e) {}
      bossStats2.losses++;
      try { localStorage.setItem('pahomBossStats', JSON.stringify(bossStats2)); } catch(e) {}

      saveAndSync();
      showBossList();
      showResult(false, 0, 0, null);
    }
  }

  function getExpReq(level) { return 1200 + (level - 1) * 600; }

  function showResult(win, reward, lvl, lootArr) {
    resultTitle.textContent = win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    resultTitle.className = 'result-title ' + (win ? 'win' : 'lose');
    resultMedal.textContent = win ? '🏆' : '💀';
    resultMedal.className = 'result-medal ' + (win ? 'win' : 'lose');

    if (win) {
      resultText.textContent = 'Ты завалил босса!';
      resultReward.innerHTML = '+' + fmt(reward) + ' секспахомов<br>🌟 +' + lvl + ' опыта';
      resultReward.style.display = 'block';
      if (lootArr && lootArr.length) {
        var html = lootArr.map(function(l) {
          return '<div class="loot-row">🎁 ' + lootIconHTML(l, '1.3rem') + ' <b>' + l.name + '</b></div>';
        }).join('');
        resultLoot.innerHTML = html;
        resultLoot.classList.remove('hidden');
      } else {
        resultLoot.classList.add('hidden');
      }
    } else {
          resultText.textContent = 'Не успел — босс сбежал.';
          resultReward.style.display = 'none';
          resultLoot.classList.add('hidden');
        }
    resultOverlay.classList.add('show');
  }

  function closeResult() {
    resultOverlay.classList.remove('show');
    refreshList();
  }

  function startTicker() {
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(function() {
      if (bossList.style.display !== 'none') refreshList();
      try {
        sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
      } catch(e) {}
      updateScore();
      updateToolInfo();
    }, 1000);
  }

  function switchBossGroup(group) {
    if (group === currentGroup) return;
    currentGroup = group;
    tabMini.classList.toggle('active', group === 'mini');
    tabMain.classList.toggle('active', group === 'main');
    tabEvent.classList.toggle('active', group === 'event');
    buildList();
    refreshList();
  }

  tabMini.addEventListener('click', function(){ switchBossGroup('mini'); });
  tabMain.addEventListener('click', function(){ switchBossGroup('main'); });
  tabEvent.addEventListener('click', function(){ switchBossGroup('event'); });

  // СДАЧА
  function askSurrender() {
    if (!isFightActive) { showBossList(); return; }
    surrenderOverlay.classList.add('show');
  }

  surrenderNo.addEventListener('click', function() {
    surrenderOverlay.classList.remove('show');
  });

  surrenderYes.addEventListener('click', function() {
    surrenderOverlay.classList.remove('show');
    if (!currentBoss) return;
    var now = Date.now();
    var st = getSt(currentBoss.id);
    st.cooldownUntil = now + currentBoss.cooldownDuration;
    saveState();
    saveAndSync();
    showNotify('💀', 'Ты сдался. ' + currentBoss.name + ' на КД');
    showBossList();
    refreshList();
  });

  function handleAbandon() {
    if (!isFightActive || !currentBoss) return;
    var now = Date.now();
    var st = getSt(currentBoss.id);
    st.cooldownUntil = now + currentBoss.cooldownDuration;
    saveState();
    try {
      localStorage.setItem('pahomBossAbandonedId', currentBoss.id);
      localStorage.setItem('pahomBossAbandonedAt', String(now));
    } catch(e) {}
    try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) handleAbandon();
  });
  window.addEventListener('pagehide', handleAbandon);
  window.addEventListener('beforeunload', handleAbandon);

  function checkAbandoned() {
    var abId = null, abAt = 0;
    try {
      abId = localStorage.getItem('pahomBossAbandonedId');
      abAt = parseInt(localStorage.getItem('pahomBossAbandonedAt') || '0', 10) || 0;
    } catch(e) {}
    if (abId && abAt) {
      var boss = null;
      for (var i = 0; i < BOSSES.length; i++) {
        if (BOSSES[i].id === abId) { boss = BOSSES[i]; break; }
      }
      if (boss) {
        showNotify('💨', 'Ты сбежал из боя с ' + boss.name + ' — босс на КД');
      }
      try {
        localStorage.removeItem('pahomBossAbandonedId');
        localStorage.removeItem('pahomBossAbandonedAt');
      } catch(e) {}
    }
  }

  function init() {
    updateScore();
    updateToolInfo();
    loadState();
    buildList();
    refreshList();
    bossHitbox.addEventListener('click', hitBoss);
    bossHitbox.addEventListener('touchstart', function(e){ e.preventDefault(); hitBoss(); }, { passive:false });
    arenaBack.addEventListener('click', askSurrender);
    resultBtn.addEventListener('click', closeResult);
    startTicker();
    checkAbandoned();

    try {
      if (window.tgSyncReady) {
        window.tgSyncLoad(function(loaded) {
          if (loaded) {
            sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
            try { bossInventory = JSON.parse(localStorage.getItem('pahomBossInventory') || '{}') || {}; } catch(e) {}
            updateScore();
            updateToolInfo();
            loadState();
            buildList();
            refreshList();
          }
        });
      }
    } catch(e) {}
  }

  init();
})();
</script>
<script src="income.js"></script>
<script src="server-sync.js"></script>
</body>
</html>
