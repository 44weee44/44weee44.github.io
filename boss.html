<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>БОССЫ — кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html, body { background:#0a0a0a; width:100%; height:100%; margin:0; font-family:'Segoe UI',Arial,sans-serif; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; touch-action:manipulation; }

.game-container {
  background:#1a1a1a;
  background-image:linear-gradient(rgba(10,10,10,0.88), rgba(10,10,10,0.96)), url('Fon.jpeg');
  background-size:cover; background-position:center;
  width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column;
  position:relative; min-height:0; overflow:hidden;
}

.header { display:flex; align-items:center; justify-content:center; padding:12px 15px; flex-shrink:0; border-bottom:1px solid #4a4a2a; background:linear-gradient(180deg, rgba(50,30,30,0.9), rgba(30,15,15,0.85)); z-index:10; }
.header-title { font-size:1.25rem; font-weight:900; letter-spacing:5px; color:#c4b08a; text-transform:uppercase; text-shadow:0 2px 4px rgba(0,0,0,0.9), 0 0 18px rgba(200,60,60,0.4); display:flex; align-items:center; gap:10px; }
.header-title svg { width:26px; height:26px; filter:drop-shadow(0 0 10px rgba(200,60,60,0.9)); }

.score-board { display:flex; justify-content:space-between; align-items:center; padding:8px 15px; flex-shrink:0; border-bottom:1px solid #4a4a2a; background:rgba(28,28,14,0.85); z-index:10; gap:10px; }
.sexpah { background:rgba(37,37,21,0.9); padding:5px 15px; border-radius:8px; border:1px solid #4a4a2a; font-size:0.9rem; font-weight:700; color:#c4b08a; transition:transform 0.3s ease, box-shadow 0.3s ease; }
.sexpah.bump { transform:scale(1.08); box-shadow:0 0 20px rgba(184,150,46,0.7); }
.tool-info { background:rgba(37,37,21,0.9); padding:5px 12px; border-radius:8px; border:1px solid #4a4a2a; font-size:0.8rem; font-weight:700; color:#c4b08a; }

.notify-bar { display:flex; flex-direction:column; gap:6px; padding:0 15px; flex-shrink:0; z-index:100; pointer-events:none; position:relative; }
.notify-bar:empty { padding:0; }
.notify-chip { display:flex; align-items:center; gap:8px; padding:10px 16px; background:linear-gradient(135deg, rgba(184,150,46,0.3), rgba(139,105,20,0.2)); border:1px solid #b8962e; border-radius:20px; font-size:0.85rem; font-weight:700; color:#ffd76b; font-family:'Courier New',monospace; align-self:flex-start; box-shadow:0 0 25px rgba(184,150,46,0.5); animation:chipIn 0.5s ease both; }
.notify-chip.leaving { animation:chipOut 0.4s ease forwards; }
.notify-chip .notify-icon img { width:1.2rem; height:1.2rem; object-fit:contain; border-radius:3px; vertical-align:middle; }
@keyframes chipIn { from { opacity:0; transform:translateY(-20px) scale(0.8); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes chipOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-15px) scale(0.9); } }

.hidden { display:none !important; }

/* ===== ТАБЫ БОССОВ ===== */
.boss-tabs { display:flex; gap:10px; padding:12px 15px; flex-shrink:0; z-index:20; }
.boss-tab {
  flex:1;
  background:linear-gradient(135deg, rgba(40,30,15,0.75), rgba(25,20,10,0.75));
  border:1px solid #4a4a2a;
  color:#c4b08a;
  padding:12px 6px;
  border-radius:10px;
  cursor:pointer;
  font-weight:800;
  font-size:0.78rem;
  transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing:1.6px;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
  font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
}
.boss-tab::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent 30%, rgba(255,215,107,0.18) 50%, transparent 70%);
  transform:translateX(-100%);
  transition:transform 0.7s ease;
  pointer-events:none;
}
.boss-tab::after {
  content:'';
  position:absolute;
  bottom:0; left:50%;
  transform:translateX(-50%) scaleX(0);
  width:70%; height:2px;
  background:linear-gradient(90deg, transparent, #ffd76b, transparent);
  transition:transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-radius:2px;
}
.boss-tab:hover:not(.active) {
  border-color:rgba(184,150,46,0.6);
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,0.6), 0 0 18px rgba(184,150,46,0.25);
}
.boss-tab.active {
  border-color:#b8962e;
  background:linear-gradient(135deg, rgba(184,150,46,0.4), rgba(139,105,20,0.3));
  color:#ffd76b;
  box-shadow:0 0 25px rgba(184,150,46,0.55), inset 0 0 18px rgba(255,215,107,0.12), 0 4px 12px rgba(0,0,0,0.5);
  transform:translateY(-2px);
  text-shadow:0 0 10px rgba(255,215,107,0.7);
}
.boss-tab.active::before { transform:translateX(100%); }
.boss-tab.active::after { transform:translateX(-50%) scaleX(1); }
.boss-tab:active { transform:translateY(0) scale(0.97); }

/* ===== СПИСОК ===== */
.boss-list { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:0 15px 5px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; scrollbar-color:#4a4a2a transparent; }
.boss-list::-webkit-scrollbar { width:5px; }
.boss-list::-webkit-scrollbar-track { background:transparent; }
.boss-list::-webkit-scrollbar-thumb { background:#4a4a2a; border-radius:3px; }

.boss-card {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px;
  border:1px solid #4a4a2a;
  border-radius:14px;
  background: linear-gradient(135deg, rgba(35,25,20,0.95), rgba(20,15,12,0.95));
  cursor:pointer; flex-shrink:0;
  position: relative;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.5s ease,
              background 0.5s ease,
              box-shadow 0.5s ease;
  animation: cardSlide 0.6s ease both;
}
.boss-card:nth-child(1) { animation-delay: 0.05s; }
.boss-card:nth-child(2) { animation-delay: 0.12s; }
.boss-card:nth-child(3) { animation-delay: 0.19s; }
.boss-card:nth-child(4) { animation-delay: 0.26s; }
.boss-card:nth-child(5) { animation-delay: 0.33s; }
.boss-card:nth-child(6) { animation-delay: 0.40s; }
@keyframes cardSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}
.boss-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 15%;
  bottom: 15%;
  width: 3px;
  background: linear-gradient(180deg, transparent, #b8962e, transparent);
  border-radius: 3px;
  opacity: 0.5;
  transition: opacity 0.5s ease, width 0.5s ease;
}
.boss-card:hover:not(.locked)::before { width: 5px; opacity: 1; box-shadow: 0 0 15px #ffd76b; }
.boss-card:hover:not(.locked) {
  border-color: #b8962e;
  transform: translateX(6px);
  background: linear-gradient(135deg, rgba(50,40,20,0.95), rgba(30,20,15,0.95));
  box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 25px rgba(184,150,46,0.25);
}
.boss-card:active:not(.locked) { transform: translateX(6px) scale(0.98); }
.boss-card.locked { opacity: 0.5; filter: grayscale(0.5); }
.boss-card.in-progress { border-color: #ff8c3c; box-shadow: 0 0 25px rgba(255,140,60,0.4); }
.boss-card.in-progress::before { width: 5px; opacity: 1; background: linear-gradient(180deg, transparent, #ff8c3c, transparent); box-shadow: 0 0 15px #ff8c3c; }

/* ===== ИВЕНТ-БОССЫ ===== */
.boss-card.event-boss {
  padding: 16px 18px;
  border-width: 2px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.boss-card.event-boss .boss-avatar-wrap { width: 68px; height: 68px; }
.boss-card.event-boss .boss-avatar {
  width: 68px; height: 68px;
  border-width: 3px;
  animation: eventAvatarPulse 3s ease-in-out infinite;
}
.boss-card.event-boss .boss-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
@keyframes eventAvatarPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
.boss-card.event-boss .boss-name { font-size: 1.15rem; letter-spacing: 0.8px; }

/* ABYSS — золотые лучи */
.boss-card.event-boss.abyss {
  border-color: #ffd76b;
  background: radial-gradient(circle at 50% 50%, rgba(255,215,107,0.12) 0%, transparent 55%), linear-gradient(135deg, rgba(90,70,20,0.7), rgba(45,35,10,0.85));
  box-shadow: 0 0 30px rgba(255,215,107,0.4), inset 0 0 25px rgba(255,215,107,0.1);
}
.boss-card.event-boss.abyss::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 300px; height: 300px;
  margin: -150px 0 0 -150px;
  background: conic-gradient(
    from 0deg,
    transparent 0deg, rgba(255,215,107,0.22) 8deg, transparent 16deg,
    transparent 30deg, rgba(255,215,107,0.18) 38deg, transparent 46deg,
    transparent 60deg, rgba(255,215,107,0.22) 68deg, transparent 76deg,
    transparent 90deg, rgba(255,215,107,0.18) 98deg, transparent 106deg,
    transparent 120deg, rgba(255,215,107,0.22) 128deg, transparent 136deg,
    transparent 150deg, rgba(255,215,107,0.18) 158deg, transparent 166deg,
    transparent 180deg, rgba(255,215,107,0.22) 188deg, transparent 196deg,
    transparent 210deg, rgba(255,215,107,0.18) 218deg, transparent 226deg,
    transparent 240deg, rgba(255,215,107,0.22) 248deg, transparent 256deg,
    transparent 270deg, rgba(255,215,107,0.18) 278deg, transparent 286deg,
    transparent 300deg, rgba(255,215,107,0.22) 308deg, transparent 316deg,
    transparent 330deg, rgba(255,215,107,0.18) 338deg, transparent 346deg,
    transparent 360deg
  );
  animation: abyssRays 20s linear infinite;
  pointer-events: none;
  opacity: 0.6;
  z-index: 0;
}
@keyframes abyssRays {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.boss-card.event-boss.abyss::before {
  background: linear-gradient(180deg, transparent, #ffd76b, transparent);
  box-shadow: 0 0 25px #ffd76b;
  width: 5px; opacity: 1;
  z-index: 2;
}
.boss-card.event-boss.abyss > * { position: relative; z-index: 1; }
.boss-card.event-boss.abyss .boss-avatar {
  border-color: #ffd76b;
  box-shadow: 0 0 30px rgba(255,215,107,0.9), inset 0 0 15px rgba(255,215,107,0.3);
}
.boss-card.event-boss.abyss .boss-name {
  color: #ffd76b;
  text-shadow: 0 0 15px rgba(255,215,107,0.7);
}
.boss-card.event-boss.abyss:hover:not(.locked) {
  border-color: #ffe594;
  box-shadow: 0 0 50px rgba(255,215,107,0.85), 0 8px 25px rgba(0,0,0,0.5);
}

/* SAMURAI — восход + иероглифы */
.boss-card.event-boss.samurai {
  border-color: #ff5a5a;
  background: radial-gradient(circle at 50% 120%, rgba(255,90,90,0.3) 0%, transparent 60%), linear-gradient(180deg, rgba(140,30,30,0.65) 0%, rgba(60,10,10,0.8) 100%);
  box-shadow: 0 0 30px rgba(255,90,90,0.4), inset 0 0 25px rgba(255,90,90,0.1);
}
.boss-card.event-boss.samurai::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0px, transparent 14px, rgba(255,90,90,0.12) 14px, rgba(255,90,90,0.12) 16px),
    repeating-linear-gradient(90deg, transparent 0px, transparent 22px, rgba(255,90,90,0.08) 22px, rgba(255,90,90,0.08) 23px);
  animation: samuraiInk 8s ease-in-out infinite;
  pointer-events: none;
  opacity: 0.5;
  z-index: 0;
}
@keyframes samuraiInk {
  0%, 100% { opacity: 0.4; }
  50%      { opacity: 0.65; }
}
.boss-card.event-boss.samurai::before {
  background: linear-gradient(180deg, transparent, #ff5a5a, transparent);
  box-shadow: 0 0 25px #ff5a5a;
  width: 5px; opacity: 1;
  z-index: 2;
}
.boss-card.event-boss.samurai > * { position: relative; z-index: 1; }
.boss-card.event-boss.samurai .boss-avatar {
  border-color: #ff5a5a;
  box-shadow: 0 0 30px rgba(255,90,90,0.9), inset 0 0 15px rgba(255,90,90,0.3);
}
.boss-card.event-boss.samurai .boss-name {
  color: #ff8080;
  text-shadow: 0 0 15px rgba(255,90,90,0.7);
}
.boss-card.event-boss.samurai:hover:not(.locked) {
  border-color: #ff7a7a;
  box-shadow: 0 0 50px rgba(255,90,90,0.85), 0 8px 25px rgba(0,0,0,0.5);
}

/* PANTERA — дымка + звёзды */
.boss-card.event-boss.pantera {
  border-color: #e0e0e0;
  background: radial-gradient(ellipse at 30% 20%, rgba(200,200,220,0.15) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(180,180,200,0.12) 0%, transparent 50%), linear-gradient(135deg, rgba(50,50,60,0.7), rgba(15,15,20,0.85));
  box-shadow: 0 0 30px rgba(200,200,220,0.3), inset 0 0 25px rgba(200,200,220,0.08);
}
.boss-card.event-boss.pantera::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.85) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 75% 40%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 65%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0.75) 0%, transparent 100%);
  animation: panteraStars 6s ease-in-out infinite;
  pointer-events: none;
  opacity: 0.8;
  z-index: 0;
}
@keyframes panteraStars {
  0%, 100% { opacity: 0.6; }
  50%      { opacity: 1; }
}
.boss-card.event-boss.pantera::before {
  background: linear-gradient(180deg, transparent, #e0e0e0, transparent);
  box-shadow: 0 0 25px #e0e0e0;
  width: 5px; opacity: 1;
  z-index: 2;
}
.boss-card.event-boss.pantera > * { position: relative; z-index: 1; }
.boss-card.event-boss.pantera .boss-avatar {
  border-color: #e0e0e0;
  box-shadow: 0 0 30px rgba(200,200,220,0.7), inset 0 0 15px rgba(200,200,220,0.3);
}
.boss-card.event-boss.pantera .boss-name {
  color: #f0f0f0;
  text-shadow: 0 0 15px rgba(200,200,220,0.7);
}
.boss-card.event-boss.pantera:hover:not(.locked) {
  border-color: #ffffff;
  box-shadow: 0 0 50px rgba(200,200,220,0.7), 0 8px 25px rgba(0,0,0,0.5);
}

.boss-card.event-boss.locked-event {
  opacity: 0.5;
  filter: grayscale(0.5);
  animation: eventLockedBreath 4s ease-in-out infinite;
}
@keyframes eventLockedBreath {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 0.65; }
}
.boss-card.event-boss.locked-event:hover { transform: none; }
.boss-card.event-boss.locked-event::after { opacity: 0; }

/* ===== АВАТАР ===== */
.boss-avatar-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
.boss-avatar {
  width:56px; height:56px;
  border-radius:50%;
  border:2px solid #b8962e;
  background: linear-gradient(135deg, rgba(60,40,20,0.9), rgba(30,20,10,0.9));
  display:flex; align-items:center; justify-content:center;
  font-size:1.8rem;
  box-shadow:0 0 15px rgba(184,150,46,0.4), inset 0 0 15px rgba(0,0,0,0.5);
  transition: transform 0.5s ease, box-shadow 0.5s ease;
  overflow:hidden;
}
.boss-avatar img { width:100%; height:100%; object-fit:contain; border-radius:50%; }
.boss-card:hover:not(.locked) .boss-avatar {
  box-shadow:0 0 25px rgba(184,150,46,0.8);
  transform: scale(1.08);
}

/* ===== ИНФО ===== */
.boss-info { flex:1; min-width:0; }
.boss-name { font-size:1.05rem; font-weight:800; color:#c4b08a; margin-bottom:4px; letter-spacing:0.5px; }
.boss-card.in-progress .boss-name { color: #ff9b5c; text-shadow: 0 0 10px rgba(255,140,60,0.5); }

.boss-meta { display:flex; flex-direction:column; gap:3px; font-size:0.75rem; color:#b0a070; }
.boss-reward { color:#ffd76b; font-weight:700; display: flex; align-items: center; gap: 4px; }
.boss-lvl { color:#ffd76b; font-weight:700; }
.boss-loot { color:#8fd4b0; font-size:0.7rem; display:flex; flex-direction:column; gap:2px; margin-top: 2px; }
.boss-loot .loot-line { display:flex; align-items:center; gap:4px; }
.boss-loot img { width:0.95rem; height:0.95rem; object-fit:contain; border-radius:2px; vertical-align:middle; }
.boss-timer { font-family:'Courier New',monospace; font-size:0.72rem; color:#ff9b5c; font-weight:700; }
.boss-card.in-progress .boss-timer { color: #ff8c3c; }

.boss-hp-bar {
  width: 100%; height: 6px;
  background: rgba(15,15,5,0.8);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 6px;
  display: none;
}
.boss-card.in-progress .boss-hp-bar { display: block; }
.boss-hp-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #8b1a1a, #ff3b3b, #ff6a3b);
  border-radius: 4px;
  transition: width 0.5s ease;
  box-shadow: 0 0 8px rgba(255,60,60,0.8);
}

/* ===== СТАТУС ===== */
.boss-status {
  padding:5px 12px;
  border-radius:20px;
  font-size:0.7rem;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  flex-shrink:0;
  transition:all 0.4s ease;
  align-self: flex-start;
  margin-top: 2px;
  white-space: nowrap;
}
.boss-status.ready {
  background: linear-gradient(135deg, rgba(60,180,80,0.3), rgba(30,100,40,0.3));
  color:#4cd964; border:1px solid #4cd964;
}
.boss-status.cooldown {
  background: linear-gradient(135deg, rgba(180,40,40,0.3), rgba(90,20,20,0.3));
  color:#ff5a5a; border:1px solid #ff5a5a;
}
.boss-status.in-progress {
  background: linear-gradient(135deg, rgba(255,140,60,0.35), rgba(180,80,20,0.35));
  color:#ff8c3c; border:1px solid #ff8c3c;
}
.boss-status.event-time {
  background: rgba(40,40,40,0.6);
  color:#ffd76b;
  border:1px solid #b8962e;
  font-size:0.6rem;
  letter-spacing:0.5px;
}

/* ===== АРЕНА ===== */
.arena { flex:1 1 auto; min-height:0; display:none; flex-direction:column; overflow:hidden; padding-bottom:80px; padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); position: relative; }
.arena.active { display:flex; }
.arena::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 55%, transparent 30%, rgba(80,10,10,0.35) 80%, rgba(20,0,0,0.6) 100%);
  pointer-events: none; z-index: 0;
}
.arena > * { position: relative; z-index: 1; }

.arena-top { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; flex-shrink:0; background:linear-gradient(180deg, rgba(50,15,15,0.9), rgba(28,14,14,0.85)); border-bottom:1px solid #c0392b; gap:10px; }
.arena-back { background:transparent; border:1px solid #4a4a2a; color:#c4b08a; width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.3s ease; }
.arena-back:hover { background:rgba(180,150,90,0.15); transform:scale(1.1); border-color:#b8962e; }
.arena-back svg { width:16px; height:16px; }

.arena-boss-name { font-size:1.1rem; font-weight:900; color:#ff8c8c; letter-spacing:3px; flex:1; text-align:center; text-shadow:0 0 15px rgba(255,60,60,0.8); }
.arena-timer { font-family:'Courier New',monospace; font-size:1.15rem; font-weight:900; color:#ffd76b; letter-spacing:2px; flex-shrink:0; }
.arena-timer.danger { color:#ff3b3b; }

    var st = bossState[id];
    if (!('fight' in st)) st.fight = null;
    if (typeof st.cooldownUntil !== 'number' || isNaN(st.cooldownUntil)) st.cooldownUntil = 0;
    return st;
  }

  function defaultState() {
    var s = { __v: STATE_VERSION };
    for (var i = 0; i < BOSSES.length; i++) s[BOSSES[i].id] = { fight:null, cooldownUntil:0 };
    return s;
  }

  function loadState() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch(e) { raw = null; }
    if (!raw || typeof raw !== 'object') { bossState = defaultState(); saveState(); return; }
    bossState = raw; bossState.__v = STATE_VERSION;
    var now = Date.now();
    for (var i = 0; i < BOSSES.length; i++) {
      var b = BOSSES[i];
      var st = getSt(b.id);
      if (st.fight && st.fight.endAt && st.fight.endAt <= now) {
        st.cooldownUntil = st.fight.endAt + b.cooldownDuration;
        st.fight = null;
      }
      if (st.cooldownUntil > 0 && st.cooldownUntil <= now) st.cooldownUntil = 0;
    }
    saveState();
  }

  function saveState() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(bossState)); } catch(e) {}
    try { if (window.tgSyncSave) window.tgSyncSave(true); } catch(e) {}
  }

  function isEventActive() {
    var now = new Date();
    var day = now.getDay();
    var h = now.getHours();
    if (day === 6 && h >= 10) return true;
    if (day === 0 && h < 20) return true;
    return false;
  }

  function getEventNextStart() {
    var now = new Date();
    var day = now.getDay();
    var h = now.getHours();
    var next = new Date(now);
    var daysToSat = (6 - day + 7) % 7;
    if (day === 6 && h < 10) daysToSat = 0;
    else if (day === 6 && h >= 10) daysToSat = 7;
    else if (day === 0) daysToSat = 6;
    next.setDate(now.getDate() + daysToSat);
    next.setHours(10, 0, 0, 0);
    return next;
  }

  function fmtEventCountdown() {
    var next = getEventNextStart();
    var ms = next - Date.now();
    if (ms <= 0) return 'скоро';
    var totalMin = Math.floor(ms / 60000);
    var d = Math.floor(totalMin / 1440);
    var h = Math.floor((totalMin % 1440) / 60);
    var m = totalMin % 60;
    if (d > 0) return d + 'д ' + h + 'ч';
    if (h > 0) return h + 'ч ' + m + 'м';
    return m + 'м';
  }

  function logEvent(action, details) {
    try {
      var logs = JSON.parse(localStorage.getItem('pahomLogs') || '[]') || [];
      var nickname = localStorage.getItem('pahomNickname') || 'Игрок';
      var userId = localStorage.getItem('pahomServerUserId') || 'local';
      var d = new Date();
      var pad = function(n){ return (n<10?'0':'')+n; };
      var timeStr = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      logs.push({ time: timeStr, user: nickname, uid: userId, action: action, details: details || '' });
      if (logs.length > 500) logs = logs.slice(-500);
      localStorage.setItem('pahomLogs', JSON.stringify(logs));
    } catch(e) {}
  }

  function fmt(n) {
    if (n >= 1000000000) { var v = n / 1000000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'B'; }
    if (n >= 1000000) { var v = n / 1000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'M'; }
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function fmtTime(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    function p(x) { return (x < 10 ? '0' : '') + x; }
    if (h > 0) return p(h) + ':' + p(m) + ':' + p(s);
    return p(m) + ':' + p(s);
  }

  function updateScore() { if (sexpahCount) sexpahCount.textContent = fmt(sexpah); }
  function bumpEl(el) { if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); setTimeout(function(){ el.classList.remove('bump'); }, 300); }

  function updateToolInfo() {
    var t = 'hand';
    try { t = localStorage.getItem('pahomTool') || 'hand'; } catch(e) {}
    var names = { hand:'Рука', whip:'Плетка', stick:'Палка', shank:'Черенок', shovel:'Лопата', commissar:'Замполит', drin:'Дрын', tyrchik:'Тырчик', darkkatana:'Тёмная катана', abysblade:'Клинок бездны' };
    var dmg = Math.floor(getBossDamage() * 10) / 10;
    if (toolInfo) toolInfo.textContent = '⚔️ ' + (names[t] || 'Рука') + ' · +' + dmg;
  }

  function showNotify(iconHTML, text, delay) {
    if (!notifyBar) return;
    setTimeout(function() {
      var chip = document.createElement('div');
      chip.className = 'notify-chip';
      chip.innerHTML = '<span class="notify-icon">' + iconHTML + '</span><span>' + text + '</span>';
      notifyBar.appendChild(chip);
      setTimeout(function(){ chip.classList.add('leaving'); setTimeout(function(){ if (chip.parentNode) chip.parentNode.removeChild(chip); }, 400); }, 4000);
    }, delay || 0);
  }

  function lootIconHTML(lootItem, size) {
    if (lootItem.image) {
      return '<img src="' + lootItem.image + '" alt="' + lootItem.name + '"' + (size ? ' style="width:'+size+';height:'+size+';object-fit:contain;vertical-align:middle;"' : '') + '>';
    }
    return lootItem.icon;
  }

  function getGroupBosses(group) {
    return BOSSES.filter(function(b){ return b.group === group; });
  }

  function buildList() {
    bossList.innerHTML = '';
    var list = getGroupBosses(currentGroup);
    if (list.length === 0) {
      bossList.innerHTML = '<div style="color:#8a7a5a;text-align:center;padding:20px;">Пусто</div>';
      return;
    }

    for (var i = 0; i < list.length; i++) {
      (function(boss) {
        var card = document.createElement('div');
        card.className = 'boss-card';
        if (boss.isEvent) {
          card.classList.add('event-boss');
          if (boss.eventStyle) card.classList.add(boss.eventStyle);
        }

        var avatarHTML = boss.image
          ? '<img src="' + boss.image + '" alt="' + boss.name + '">'
          : boss.face;

        var lootArr = Array.isArray(boss.loot) ? boss.loot : (boss.loot ? [boss.loot] : []);
        var lootLinesHTML = lootArr.map(function(l) {
          return '<span class="loot-line">🎁 ' + lootIconHTML(l) + ' ' + l.name + ' (' + l.chance + '%)</span>';
        }).join('');
        var lootBlockHTML = lootLinesHTML ? '<span class="boss-loot">' + lootLinesHTML + '</span>' : '';

        card.innerHTML =
          '<div class="boss-avatar-wrap">' +
            '<div class="boss-avatar">' + avatarHTML + '</div>' +
          '</div>' +
          '<div class="boss-info">' +
            '<div class="boss-name">' + boss.name + '</div>' +
            '<div class="boss-meta">' +
              '<span class="boss-reward">💰 ' + fmt(boss.reward) + ' секспахомов</span>' +
              '<span class="boss-lvl">🌟 +' + (boss.exp || boss.lvl) + ' опыта</span>' +
              '<span class="boss-lvl">❤️ HP: ' + fmt(boss.exciteMax) + '</span>' +
              lootBlockHTML +
              '<span class="boss-timer">—</span>' +
            '</div>' +
            '<div class="boss-hp-bar"><div class="boss-hp-fill"></div></div>' +
          '</div>' +
          '<div class="boss-status">—</div>';

        card.addEventListener('click', function(){ onCard(boss); });
        bossList.appendChild(card);
      })(list[i]);
    }
  }

  function refreshList() {
    var now = Date.now();
    var list = getGroupBosses(currentGroup);
    var otherInProgress = false;
    for (var i = 0; i < BOSSES.length; i++) { if (getSt(BOSSES[i].id).fight) { otherInProgress = true; break; } }
    var eventOn = isEventActive();
    var cards = bossList.querySelectorAll('.boss-card');

    for (var j = 0; j < list.length; j++) {
      var boss = list[j];
      var card = cards[j];
      if (!card) continue;
      var timer = card.querySelector('.boss-timer');
      var status = card.querySelector('.boss-status');
      var hpFill = card.querySelector('.boss-hp-fill');
      if (!timer || !status) continue;

      var st = getSt(boss.id);
      card.classList.remove('locked', 'in-progress', 'locked-event');

      if (boss.isEvent && !eventOn) {
        card.classList.add('locked-event');
        status.className = 'boss-status event-time';
        status.textContent = 'ИВЕНТ ЧЕРЕЗ ' + fmtEventCountdown();
        timer.textContent = 'Сб 10:00 – Вс 20:00';
        continue;
      }

      if (st.fight) {
        card.classList.add('in-progress');
        status.className = 'boss-status in-progress';
        status.textContent = 'В БОЮ';
        var pct = Math.floor((st.fight.excite / boss.exciteMax) * 100);
        timer.textContent = 'HP: ' + pct + '% · ' + fmtTime(st.fight.endAt - now);
        if (hpFill) hpFill.style.width = pct + '%';
      } else if (otherInProgress) {
        card.classList.add('locked');
        status.className = 'boss-status cooldown';
        status.textContent = 'ЗАНЯТО';
        timer.textContent = 'Другой босс в бою';
      } else if (st.cooldownUntil > now) {
        card.classList.add('locked');
        status.className = 'boss-status cooldown';
        status.textContent = 'КД';
        timer.textContent = 'Через ' + fmtTime(st.cooldownUntil - now);
      } else {
        status.className = 'boss-status ready';
        status.textContent = 'ГОТОВ';
        timer.textContent = 'Можно атаковать!';
      }
    }
  }

  function onCard(boss) {
    var now = Date.now();
    var st = getSt(boss.id);

    if (boss.isEvent && !isEventActive()) return;
    if (boss.levelReq) {
      var playerLv = parseInt(localStorage.getItem('pahomPlayerLevel') || '1', 10) || 1;
      if (playerLv < boss.levelReq) {
        showNotify('🔒', 'Нужна выслуга ' + boss.levelReq + ' лет');
        return;
      }
    }

    var otherInProgress = false;
    for (var i = 0; i < BOSSES.length; i++) { if (BOSSES[i].id !== boss.id && getSt(BOSSES[i].id).fight) { otherInProgress = true; break; } }

    if (st.fight) { enterFight(boss); return; }
    if (otherInProgress) return;
    if (st.cooldownUntil > now) return;

    enterFight(boss);
  }

  var currentBoss = null;
  var fightInterval = null;
  var tickerInterval = null;
  var isFightActive = false;
  var lastClick = 0;
  var lastSave = 0;

  function enterFight(boss) {
    var now = Date.now();
    var st = getSt(boss.id);

    for (var i = 0; i < BOSSES.length; i++) {
      if (BOSSES[i].id !== boss.id && getSt(BOSSES[i].id).fight) return;
    }
    if (st.cooldownUntil > now) return;
    if (st.fight && st.fight.endAt && st.fight.endAt <= now) st.fight = null;

    if (!st.fight) {
      st.fight = { endAt: now + boss.fightDuration, clicks:0, damage:0, excite:0, startedAt: now };
      saveState();
    }

    currentBoss = boss;
    isFightActive = true;
    lastClick = 0;
    lastSave = 0;

    bossList.style.display = 'none';
    bossTabs.style.display = 'none';
    arena.classList.add('active');
    tabsBar.classList.add('hidden');

    arenaBossName.textContent = boss.name.toUpperCase();

    if (boss.image) {
      bossFace.innerHTML = '<img src="' + boss.image + '" alt="' + boss.name + '">';
      bossFace.style.fontSize = '0';
    } else {
      bossFace.innerHTML = '';
      bossFace.textContent = boss.face;
      bossFace.style.fontSize = '';
    }

    var power = getBossDamage();
    bossClickPower.textContent = '+' + (Math.floor(power * 10) / 10);

    var f = st.fight;
    arenaClicks.textContent = String(f.clicks);
    arenaDamage.textContent = String(Math.floor(f.damage));
    exciteValue.textContent = fmt(f.excite) + ' / ' + fmt(boss.exciteMax);

    updateBar();
    updateHitbox();
    updateTimer();
    if (fightInterval) clearInterval(fightInterval);
    fightInterval = setInterval(updateTimer, 250);
  }

  function updateBar() {
    if (!currentBoss) return;
    var st = getSt(currentBoss.id);
    if (!st.fight) return;
    var pct = Math.min(100, (st.fight.excite / currentBoss.exciteMax) * 100);
    exciteBarFill.style.width = pct + '%';
    if (arenaHpFill) arenaHpFill.style.width = pct + '%';
    if (arenaHpPercent) arenaHpPercent.textContent = Math.round(pct) + '%';
  }

  function updateHitbox() {
    if (!currentBoss) return;
    var st = getSt(currentBoss.id);
    if (!st.fight) return;
    var pct = st.fight.excite / currentBoss.exciteMax;
    bossHitbox.classList.remove('hot', 'critical');
    if (pct >= 0.85) bossHitbox.classList.add('critical');
    else if (pct >= 0.5) bossHitbox.classList.add('hot');
  }

  function updateTimer() {
    if (!isFightActive || !currentBoss) return;
    var now = Date.now();
    var st = getSt(currentBoss.id);
    if (!st.fight) return;
    var remain = st.fight.endAt - now;
    if (remain <= 0) { endFight(currentBoss, false); return; }
    arenaTimer.textContent = fmtTime(remain);
    arenaTimer.classList.toggle('danger', remain < 60000);
  }

  function hitBoss() {
    if (!isFightActive || !currentBoss) return;
    var now = Date.now();
    if (now - lastClick < 55) return;
    lastClick = now;

    var st = getSt(currentBoss.id);
    if (!st.fight) return;
    if (st.fight.endAt <= now) { endFight(currentBoss, false); return; }

    var power = getBossDamage();
    st.fight.clicks++;
    st.fight.damage += power;
    st.fight.excite += power;
    if (st.fight.excite >= currentBoss.exciteMax) st.fight.excite = currentBoss.exciteMax;

    if (now - lastSave > 3000) {
      lastSave = now;
      saveState();
    }

    arenaClicks.textContent = String(st.fight.clicks);
    arenaDamage.textContent = String(Math.floor(st.fight.damage));
    bumpEl(arenaClicks);
    bumpEl(arenaDamage);

    exciteValue.textContent = fmt(st.fight.excite) + ' / ' + fmt(currentBoss.exciteMax);
    bumpEl(exciteValue);

    updateBar();
    updateHitbox();

    var rect = bossHitbox.getBoundingClientRect();
    var cx = rect.left + rect.width/2 + (Math.random()-0.5)*rect.width*0.6;
    var cy = rect.top + rect.height/2 + (Math.random()-0.5)*rect.height*0.6;
    spawnFloat(cx, cy, '+' + (Math.floor(power*10)/10));
    spawnRipple(cx, cy);

    var pct = st.fight.excite / currentBoss.exciteMax;
    if (pct > 0.85) {
      bossHitbox.classList.remove('shake');
      void bossHitbox.offsetWidth;
      bossHitbox.classList.add('shake');
      setTimeout(function(){ bossHitbox.classList.remove('shake'); }, 260);
    }

    if (st.fight.excite >= currentBoss.exciteMax) {
      saveState();
      endFight(currentBoss, true);
    }
  }

  function spawnFloat(x,y,text) {
    var el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x+'px'; el.style.top = y+'px';
    el.style.fontSize = (1.2 + Math.random()*0.3) + 'rem';
    el.style.marginLeft = ((Math.random()-0.5)*40) + 'px';
    document.body.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
  }

  function spawnRipple(x,y) {
    var r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = x+'px'; r.style.top = y+'px';
    document.body.appendChild(r);
    setTimeout(function(){ if (r.parentNode) r.parentNode.removeChild(r); }, 700);
  }

  function showBossList() {
    if (fightInterval) { clearInterval(fightInterval); fightInterval = null; }
    isFightActive = false;
    currentBoss = null;
    lastClick = 0;
    lastSave = 0;
    arena.classList.remove('active');
    bossList.style.display = '';
    bossTabs.style.display = '';
    tabsBar.classList.remove('hidden');
    bossHitbox.classList.remove('hot', 'critical', 'shake');
    exciteBarFill.style.width = '0%';
    if (arenaHpFill) arenaHpFill.style.width = '0%';
    if (arenaHpPercent) arenaHpPercent.textContent = '0%';
    arenaClicks.textContent = '0';
    arenaDamage.textContent = '0';
    arenaTimer.textContent = '--:--';
    buildList();
    refreshList();
  }

  function endFight(boss, win) {
    if (!boss) return;
    var now = Date.now();
    var st = getSt(boss.id);
    if (!st.fight) return;
    isFightActive = false;
    if (fightInterval) { clearInterval(fightInterval); fightInterval = null; }
    var droppedItems = [];

    if (win) {
      sexpah += boss.reward;
      try { localStorage.setItem('pahomSexpah', String(sexpah)); } catch(e) {}
      updateScore();
      bumpEl(sexpahBox);

      try {
        var exp = parseInt(localStorage.getItem('pahomPlayerExp') || '0', 10) || 0;
        var lv = parseInt(localStorage.getItem('pahomPlayerLevel') || '1', 10) || 1;
        exp += (boss.exp || boss.lvl || 0);
        while (exp >= getExpReq(lv)) { exp -= getExpReq(lv); lv++; }
        localStorage.setItem('pahomPlayerExp', String(exp));
        localStorage.setItem('pahomPlayerLevel', String(lv));
      } catch(e) {}

      var lootUpLevel = 1;
      try { lootUpLevel = parseInt(localStorage.getItem('pahomUpgradeLoot') || '1', 10) || 1; } catch(e) {}
      var lootBonusPct = (lootUpLevel - 1) * 5;

      var lootArr = Array.isArray(boss.loot) ? boss.loot : (boss.loot ? [boss.loot] : []);
      lootArr.forEach(function(lootItem) {
        var effectiveChance = lootItem.chance + lootBonusPct;
        if (Math.random()*100 < effectiveChance) {
          var lid = lootItem.id;
          if (!bossInventory[lid]) bossInventory[lid] = 0;
          if (bossInventory[lid] < LOOT_MAX) {
            bossInventory[lid]++;
            droppedItems.push(lootItem);
          }
        }
      });
      if (droppedItems.length) {
        try { localStorage.setItem('pahomBossInventory', JSON.stringify(bossInventory)); } catch(e) {}
      }

      st.fight = null;
      st.cooldownUntil = now + boss.cooldownDuration;
      saveState();

      try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}

      var lootNames = droppedItems.map(function(l){ return l.name; }).join(', ');
      logEvent('boss_kill', boss.name + ' | +' + boss.reward + ' | loot: ' + (lootNames || 'нет'));

      droppedItems.forEach(function(item, i) {
        showNotify(lootIconHTML(item), 'ВЫПАЛ: ' + item.name, i * 300);
      });

      setTimeout(function() {
        showBossList();
        showResult(true, boss.reward, boss.exp || boss.lvl, droppedItems);
      }, 600);
      return;
    } else {
      st.fight = null;
      st.cooldownUntil = now + boss.cooldownDuration;
      saveState();
      try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
      logEvent('boss_lose', boss.name);
      showBossList();
      showResult(false, 0, 0, null);
    }
  }

  function getExpReq(level) { return 1200 + (level - 1) * 600; }

  function showResult(win, reward, lvl, lootArr) {
    resultTitle.textContent = win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    resultTitle.className = 'result-title ' + (win ? 'win' : 'lose');
    resultMedal.textContent = win ? '🏆' : '💀';
    resultMedal.className = 'result-medal ' + (win ? 'win' : 'lose');

    if (win) {
      resultText.textContent = 'Ты завалил босса!';
      resultReward.innerHTML = '+' + fmt(reward) + ' секспахомов<br>🌟 +' + lvl + ' опыта';
      resultReward.style.display = 'block';
      if (lootArr && lootArr.length) {
        var html = lootArr.map(function(l) {
          return '<div class="loot-row">🎁 ' + lootIconHTML(l, '1.4rem') + ' <b>' + l.name + '</b></div>';
        }).join('');
        resultLoot.innerHTML = html;
        resultLoot.classList.remove('hidden');
      } else {
        resultLoot.classList.add('hidden');
      }
    } else {
      resultText.textContent = 'Не успел — босс сбежал.';
      resultReward.style.display = 'none';
      resultLoot.classList.add('hidden');
    }
    resultOverlay.classList.add('show');
  }

  function closeResult() {
    resultOverlay.classList.remove('show');
    refreshList();
  }

  function startTicker() {
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(function() {
      if (bossList.style.display !== 'none') refreshList();
      try {
        sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
      } catch(e) {}
      updateScore();
      updateToolInfo();
    }, 1000);
  }

  function autoEnter() {
    var now = Date.now();
    var activeBoss = null;
    for (var i = 0; i < BOSSES.length; i++) {
      var st = getSt(BOSSES[i].id);
      if (st.fight && st.fight.endAt && st.fight.endAt > now) {
        if (!st.fight.clicks && !st.fight.excite) { st.fight = null; saveState(); continue; }
        activeBoss = BOSSES[i];
        break;
      }
    }
    if (activeBoss) enterFight(activeBoss);
  }

  function switchBossGroup(group) {
    if (group === currentGroup) return;
    currentGroup = group;
    tabMini.classList.toggle('active', group === 'mini');
    tabMain.classList.toggle('active', group === 'main');
    tabEvent.classList.toggle('active', group === 'event');
    buildList();
    refreshList();
  }

  tabMini.addEventListener('click', function(){ switchBossGroup('mini'); });
  tabMain.addEventListener('click', function(){ switchBossGroup('main'); });
  tabEvent.addEventListener('click', function(){ switchBossGroup('event'); });

  document.addEventListener('visibilitychange', function() {
    if (document.hidden && isFightActive) {
      saveState();
      try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
    }
  });
  window.addEventListener('pagehide', function() {
    if (isFightActive) {
      saveState();
      try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
    }
  });
  window.addEventListener('beforeunload', function() {
    if (isFightActive) {
      saveState();
      try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
    }
  });

  function init() {
    updateScore();
    updateToolInfo();
    loadState();
    buildList();
    refreshList();
    bossHitbox.addEventListener('click', hitBoss);
    bossHitbox.addEventListener('touchstart', function(e){ e.preventDefault(); hitBoss(); }, { passive:false });
    arenaBack.addEventListener('click', showBossList);
    resultBtn.addEventListener('click', closeResult);
    startTicker();
    autoEnter();

    try {
      if (window.tgSyncReady) {
        window.tgSyncLoad(function(loaded) {
          if (loaded) {
            sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
            try { bossInventory = JSON.parse(localStorage.getItem('pahomBossInventory') || '{}') || {}; } catch(e) {}
            updateScore();
            updateToolInfo();
            loadState();
            buildList();
            refreshList();
          }
        });
      }
    } catch(e) {}
  }

  init();
})();
</script>
