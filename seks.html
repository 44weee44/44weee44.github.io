<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>ГЛАВНАЯ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
:root { --border:#4a4a2a; --text:#c4b08a; --accent:#8a7a5a; --gold:#b8962e; --gold-bright:#ffd76b; }
body { background:#0a0a0a; min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:'Segoe UI',Arial,sans-serif; margin:0; touch-action:manipulation; overflow:hidden; }
.game-container { background-color:#1a1a1a; background-image:linear-gradient(rgba(10,10,10,0.85),rgba(10,10,10,0.94)),url('Fon.jpeg'); background-size:cover; background-position:center; width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.header { display:flex; justify-content:center; align-items:center; padding:10px 15px; flex-shrink:0; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(50,45,25,0.95),rgba(28,28,14,0.92)); min-height:54px; box-shadow:0 4px 20px rgba(0,0,0,0.6); z-index:10; }
.header-title { font-size:1.25rem; font-weight:900; letter-spacing:4px; color:var(--text); text-transform:uppercase; text-shadow:0 0 8px rgba(184,150,46,0.5),0 2px 4px rgba(0,0,0,0.9); }
.score-board { display:flex; justify-content:space-between; align-items:center; padding:8px 15px; flex-shrink:0; border-bottom:1px solid var(--border); background:rgba(28,28,14,0.9); gap:10px; z-index:10; }
.sexpah, .current-tool { background:rgba(37,37,21,0.9); padding:6px 16px; border-radius:10px; border:1px solid var(--border); font-size:0.9rem; font-weight:700; color:var(--text); transition:all 0.6s cubic-bezier(0.4,0,0.2,1); box-shadow:0 2px 8px rgba(0,0,0,0.4); flex-shrink:0; }
.current-tool { display:flex; align-items:center; gap:5px; font-weight:600; color:#b0a070; }
.current-tool.rarity-common { border-color:#9a9a9a; }
.current-tool.rarity-rare { border-color:#3b82f6; }
.current-tool.rarity-legendary { border-color:#ffd76b; }
.current-tool.rarity-mythic { border-color:#a855f7; }
.buffs-top { display:flex; gap:8px; align-items:center; padding:6px 15px; flex-shrink:0; background:rgba(28,28,14,0.75); border-bottom:1px solid var(--border); transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
.buffs-top.hidden { display:none; }
.buff-chip { display:flex; align-items:center; gap:6px; padding:4px 12px; background:rgba(184,150,46,0.18); border:1px solid var(--gold); border-radius:20px; font-size:0.75rem; font-weight:700; color:var(--gold); font-family:'Courier New',monospace; }
.content-area { flex:1; min-height:0; position:relative; overflow:hidden; }
.main-area { display:flex; width:100%; height:100%; gap:8px; position:relative; padding:10px; }
.love-panel { display:flex; flex:0 0 46px; flex-shrink:0; }
.love-scale-vertical { display:flex; flex-direction:column; align-items:center; gap:6px; border:1px solid var(--border); border-radius:12px; padding:8px 6px; width:100%; background:rgba(25,25,12,0.85); }
.love-vertical-bg { width:22px; flex:1; background:#0f0f00; border-radius:10px; overflow:hidden; display:flex; align-items:flex-end; box-shadow:inset 0 3px 8px rgba(0,0,0,0.95); }
.love-vertical-fill { width:100%; height:0%; background:linear-gradient(0deg,#6b1010,#c0392b,#ff6a3b,#ff8c3c,#ff6a3b,#c0392b,#6b1010); background-size:100% 250%; transition:height 0.2s linear; box-shadow:0 0 20px #c0392b,inset 0 0 8px rgba(255,200,150,0.4); animation:loveFlow 5s ease-in-out infinite; position:relative; overflow:hidden; }
.love-vertical-fill::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent,rgba(255,255,255,0.25),transparent); animation:loveShine 3.5s ease-in-out infinite; pointer-events:none; }
@keyframes loveFlow { 0%,100%{background-position:0% 0%;} 50%{background-position:0% 100%;} }
@keyframes loveShine { 0%{transform:translateY(-100%);} 60%{transform:translateY(100%);} 100%{transform:translateY(100%);} }
.love-vertical-label { font-size:0.68rem; font-weight:800; color:var(--text); writing-mode:vertical-rl; transform:rotate(180deg); letter-spacing:1.5px; }
.pahom-wrap { position:absolute; left:calc(50% + 8px); top:50%; transform:translate(-50%,-50%); width:170px; height:170px; pointer-events:none; }
.pahom-hitbox { width:170px; height:170px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; border:2px solid var(--gold); position:absolute; left:0; top:0; background:radial-gradient(circle at 40% 30%,rgba(80,55,25,0.85),rgba(15,10,6,0.95)); box-shadow:0 0 40px rgba(184,150,46,0.5),inset 0 0 30px rgba(0,0,0,0.5); transition:box-shadow 0.6s cubic-bezier(0.4,0,0.2,1),border-color 0.6s cubic-bezier(0.4,0,0.2,1),transform 0.3s cubic-bezier(0.4,0,0.2,1); pointer-events:auto; z-index:15; will-change:transform; animation:floatPahom 7s ease-in-out infinite; transform-origin:center; }
@keyframes floatPahom { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-10px) scale(1.02);} }
.pahom-hitbox:hover { border-color:var(--gold-bright); box-shadow:0 0 70px rgba(255,215,107,0.85),inset 0 0 30px rgba(0,0,0,0.5); }
.pahom-hitbox.clicking { animation:clickPulse 0.7s cubic-bezier(0.4,0,0.2,1); }
@keyframes clickPulse {
  0%   { transform:scale(1);    box-shadow:0 0 40px rgba(184,150,46,0.5),inset 0 0 30px rgba(0,0,0,0.5); }
  30%  { transform:scale(0.94); box-shadow:0 0 90px rgba(255,215,107,1),inset 0 0 30px rgba(0,0,0,0.5); }
  70%  { transform:scale(1.02); box-shadow:0 0 70px rgba(255,215,107,0.9),inset 0 0 30px rgba(0,0,0,0.5); }
  100% { transform:scale(1);    box-shadow:0 0 40px rgba(184,150,46,0.5),inset 0 0 30px rgba(0,0,0,0.5); }
}
.pahom-hitbox.combo-hot { box-shadow:0 0 70px rgba(255,140,60,0.9),inset 0 0 30px rgba(0,0,0,0.5); border-color:#ff8c3c; }
.pahom-hitbox.combo-max { box-shadow:0 0 100px rgba(255,60,60,1),inset 0 0 30px rgba(0,0,0,0.5); border-color:#ff3b3b; }
.pahom-face { font-size:4.4rem; pointer-events:none; transition:transform 0.5s cubic-bezier(0.4,0,0.2,1); }
.pahom-hitbox.clicking .pahom-face { transform:scale(0.9); transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); }
.click-power { position:absolute; bottom:-28px; left:50%; transform:translateX(-50%); color:var(--accent); font-size:0.9rem; font-weight:800; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,0.95); }
.cooldown-indicator { text-align:center; padding:8px; color:#b0a070; font-size:0.88rem; font-weight:700; flex-shrink:0; background:rgba(30,30,14,0.85); }
.notification { background:linear-gradient(135deg,#6b1a1a,#8b2a2a); color:#fff; text-align:center; padding:8px; flex-shrink:0; font-weight:700; letter-spacing:1px; box-shadow:0 0 25px #c0392b; }
.hidden { display:none !important; }
.tabs-bar { display:flex; justify-content:space-around; align-items:center; padding:0 30px 80px; padding-bottom:calc(80px + env(safe-area-inset-bottom,0px)); flex-shrink:0; z-index:20; gap:10px; }
.tab-btn { background:transparent; border:none; cursor:pointer; color:var(--accent); opacity:0.55; transition:all 0.6s cubic-bezier(0.4,0,0.2,1); padding:8px; text-decoration:none; display:flex; align-items:center; justify-content:center; border-radius:12px; }
.tab-btn.active { opacity:1; color:var(--text); transform:scale(1.1) translateY(-3px); }
.tab-btn:hover { opacity:0.95; transform:scale(1.08) translateY(-2px); }
.tab-btn:active { transform:scale(0.95); }
.tab-btn svg { width:30px; height:30px; }
.tab-btn.home-btn svg { width:40px; height:40px; }
.tab-btn.boss-btn svg { width:32px; height:32px; }
.tab-btn.boss-btn:hover { color:#c0392b; }
.tab-btn.rating-btn:hover { color:var(--gold-bright); }
.float-text { position:fixed; pointer-events:none; font-weight:900; font-size:1.3rem; color:var(--gold-bright); z-index:200; white-space:nowrap; transform:translate(-50%,-50%); text-shadow:0 2px 6px rgba(0,0,0,1),0 0 15px rgba(255,215,107,1); animation:floatUp 1.6s cubic-bezier(0.4,0,0.2,1) forwards; will-change:transform,opacity; }
@keyframes floatUp {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  15%  { opacity:1; transform:translate(-50%,-60%) scale(1.2); }
  40%  { opacity:1; transform:translate(-50%,-90%) scale(1.1); }
  70%  { opacity:1; transform:translate(calc(-50% + var(--drift-x,0px) * 0.5),-140%) scale(1); }
  100% { opacity:0; transform:translate(calc(-50% + var(--drift-x,0px)),-200%) scale(0.9); }
}
.click-ripple { position:fixed; border-radius:50%; border:2px solid var(--gold); pointer-events:none; z-index:90; transform:translate(-50%,-50%); width:20px; height:20px; animation:rippleOut 1.1s cubic-bezier(0.4,0,0.2,1) forwards; will-change:width,height,opacity; }
@keyframes rippleOut {
  0%   { width:20px; height:20px; opacity:0.95; box-shadow:0 0 15px rgba(255,215,107,0.9); }
  60%  { opacity:0.7; }
  100% { width:130px; height:130px; opacity:0; box-shadow:0 0 50px rgba(255,215,107,0); }
}
.sparkle { position:fixed; width:6px; height:6px; border-radius:50%; background:radial-gradient(circle,#ffd76b,#ff8c3c 60%,transparent 80%); pointer-events:none; z-index:95; transform:translate(-50%,-50%); animation:sparkleFly 1.2s cubic-bezier(0.4,0,0.2,1) forwards; }
@keyframes sparkleFly {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.3); }
  15%  { opacity:1; transform:translate(-50%,-50%) scale(1.2); }
  100% { opacity:0; transform:translate(calc(-50% + var(--sx,0px)),calc(-50% + var(--sy,0px))) scale(1.6); }
}
.combo-counter { position:fixed; top:160px; left:50%; transform:translateX(-50%) scale(0.8); font-size:2.6rem; font-weight:900; color:var(--gold); text-shadow:0 3px 6px rgba(0,0,0,0.9),0 0 25px rgba(184,150,46,0.9); opacity:0; pointer-events:none; z-index:150; transition:opacity 0.5s cubic-bezier(0.4,0,0.2,1),transform 0.5s cubic-bezier(0.4,0,0.2,1),color 0.6s cubic-bezier(0.4,0,0.2,1); letter-spacing:2px; }
.combo-counter.show { opacity:1; transform:translateX(-50%) scale(1); }
.combo-counter.hot { color:#ff6a3b; text-shadow:0 3px 6px rgba(0,0,0,0.9),0 0 30px rgba(255,106,59,0.9); }
.combo-bar { position:fixed; top:0; left:0; height:4px; width:0%; background:linear-gradient(90deg,#8b1a1a,#b8962e,#ffd76b); box-shadow:0 0 15px rgba(255,215,107,0.8); z-index:300; transition:width 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.5s cubic-bezier(0.4,0,0.2,1); opacity:0; }
.combo-bar.show { opacity:1; }
.combo-bonus { position:fixed; top:215px; left:50%; transform:translateX(-50%) translateY(-8px); font-size:1rem; font-weight:800; color:#ff8c3c; text-shadow:0 2px 6px rgba(0,0,0,0.9),0 0 18px rgba(255,140,60,0.9); opacity:0; pointer-events:none; z-index:150; transition:opacity 0.5s cubic-bezier(0.4,0,0.2,1),transform 0.5s cubic-bezier(0.4,0,0.2,1); white-space:nowrap; }
.combo-bonus.show { opacity:1; transform:translateX(-50%) translateY(0); }
@media (max-width:400px) {
  .pahom-hitbox { width:140px; height:140px; }
  .pahom-wrap { width:140px; height:140px; }
  .pahom-face { font-size:3.6rem; }
  .combo-counter { font-size:2rem; }
  .combo-bonus { font-size:0.9rem; top:205px; }
  .tabs-bar { padding:0 15px 80px; padding-bottom:calc(80px + env(safe-area-inset-bottom,0px)); }
}
@media (max-height:700px) {
  .pahom-hitbox { width:150px; height:150px; }
  .pahom-wrap { width:150px; height:150px; }
  .pahom-face { font-size:4rem; }
  .tabs-bar { padding-bottom:40px; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px)); }
}
@media (max-height:600px) {
  .pahom-hitbox { width:130px; height:130px; }
  .pahom-wrap { width:130px; height:130px; }
  .pahom-face { font-size:3.2rem; }
  .tabs-bar { padding-bottom:15px; padding-bottom:calc(15px + env(safe-area-inset-bottom,0px)); }
}
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="header-title">ГЛАВНАЯ</div>
  </div>

  <div class="score-board">
    <div class="sexpah">🔞 <span id="sexpahCount">0</span> секспахомов</div>
    <div class="current-tool" id="currentToolBox">
      <span id="currentToolIcon">✋</span> <span id="currentToolName">Рука</span>
    </div>
  </div>

  <div class="buffs-top hidden" id="buffsTop"></div>

  <div class="content-area">
    <div class="main-area">
      <div class="love-panel">
        <div class="love-scale-vertical">
          <div class="love-vertical-bg">
            <div id="loveVerticalFill" class="love-vertical-fill"></div>
          </div>
          <span class="love-vertical-label">ЛЮБОВЬ</span>
        </div>
      </div>
      <div class="pahom-wrap">
        <div id="pahomHitbox" class="pahom-hitbox">
          <div class="pahom-face">👴</div>
          <div class="click-power" id="clickPowerLabel">+1 за клик</div>
        </div>
      </div>
    </div>
  </div>

  <div id="cooldownMessage" class="cooldown-indicator">Давануть Пахома</div>
  <div id="excitedNotification" class="notification hidden">ПАХОМ ПЕРЕВОЗБУДИЛСЯ!</div>

  <div class="tabs-bar">
    <a href="boss.html" class="tab-btn boss-btn" title="Боссы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C7.6 2 4 5.6 4 10c0 2.4 1 4.5 2.7 5.9V19c0 .6.4 1 1 1h1.3v-2h1.4v2h1.2v-2h1.4v2H14v-2h1.4v2H16.7c.6 0 1-.4 1-1v-3.1C19.4 14.5 20 12.4 20 10c0-4.4-3.6-8-8-8z"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><circle cx="15" cy="10" r="1.5" fill="currentColor"/><path d="M12 13.5l-1.2 2.5h2.4z" fill="currentColor"/></svg>
    </a>
    <a href="shop.html" class="tab-btn" title="Магазин">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </a>
    <a href="seks.html" class="tab-btn home-btn active" title="Главная">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="rating.html" class="tab-btn rating-btn" title="Рейтинг">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h2a2 2 0 012 2v1a3 3 0 01-3 3"/><path d="M7 5H5a2 2 0 00-2 2v1a3 3 0 003 3"/></svg>
    </a>
    <a href="prof.html" class="tab-btn" title="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </div>
</div>

<div class="combo-bar" id="comboBar"></div>
<div class="combo-counter" id="comboCounter">x1</div>
<div class="combo-bonus" id="comboBonus">BONUS COMBO: +1</div>

<script>
(function(){
  'use strict';

  function $(id){ return document.getElementById(id); }

  var sexpahCount = $('sexpahCount');
  var loveVerticalFill = $('loveVerticalFill');
  var pahomHitbox = $('pahomHitbox');
  var cooldownDiv = $('cooldownMessage');
  var excitedDiv = $('excitedNotification');
  var currentToolIconSpan = $('currentToolIcon');
  var currentToolNameSpan = $('currentToolName');
  var currentToolBox = $('currentToolBox');
  var clickPowerLabel = $('clickPowerLabel');
  var comboCounter = $('comboCounter');
  var comboBar = $('comboBar');
  var comboBonus = $('comboBonus');
  var buffsTop = $('buffsTop');

  var WEAPONS = {
    hand:{name:'Рука',icon:'✋',clickPower:1,rarity:'common'},
    whip:{name:'Плетка',icon:'🐍',clickPower:3,rarity:'common'},
    stick:{name:'Палка',icon:'🥢',clickPower:5,rarity:'common'},
    shank:{name:'Черенок',icon:'🔧',clickPower:7,rarity:'rare'},
    shovel:{name:'Лопата',icon:'🪏',clickPower:9,rarity:'rare'},
    commissar:{name:'Замполит',icon:'🎖️',clickPower:11,rarity:'rare'},
    drin:{name:'Дрын',icon:'🌲',clickPower:13,rarity:'legendary'},
    tyrchik:{name:'Тырчик',icon:'⚡',clickPower:15,rarity:'legendary'},
    darkkatana:{name:'Тёмная катана',icon:'🗡️',clickPower:20,rarity:'mythic'},
    abysblade:{name:'Клинок бездны',icon:'⚔️',clickPower:25,rarity:'mythic'}
  };

  var CLICK_CD = 55;

  var sexpah = 0;
  var love = 0;
  var BASE_MAX_LOVE = 300;
  var CIGS_MAX_LOVE = 500;
  var totalClicks = 0;
  var totalOverexcites = 0;
  var currentTool = 'hand';
  var activeBuffs = {};

  try{ sexpah = parseInt(localStorage.getItem('pahomSexpah')||'0',10)||0; }catch(e){}
  try{ totalClicks = parseInt(localStorage.getItem('pahomClicks')||'0',10)||0; }catch(e){}
  try{ totalOverexcites = parseInt(localStorage.getItem('pahomOverexcites')||'0',10)||0; }catch(e){}
  try{ currentTool = localStorage.getItem('pahomTool')||'hand'; }catch(e){}
  try{ activeBuffs = JSON.parse(localStorage.getItem('pahomBuffs')||'{}')||{}; }catch(e){ activeBuffs = {}; }

  var isCooldown = false;
  var cooldownRemaining = 0;
  var cooldownInterval = null;
  var lastClickTime = Date.now();
  var decayInterval = null;
  var tickerInterval = null;

  var combo = 0;
  var comboTimer = null;
  var COMBO_TIMEOUT = 1500;
  var COMBO_MAX = 20;

  var lastHandledClick = 0;
  var lastFloatSpawn = 0;
  var lastRippleSpawn = 0;
  var SPAWN_INTERVAL = 60;
  var dirtySave = false;
  var lastForceSave = 0;
  var lastBuffsHash = '';

  function fmt(n){
    if (n >= 1000000000){ var v = n/1000000000; return (v<10?v.toFixed(1):Math.floor(v))+'B'; }
    if (n >= 1000000){ var v = n/1000000; return (v<10?v.toFixed(1):Math.floor(v))+'M'; }
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  }

  function fmtTime(ms){
    var t = Math.floor(ms/1000);
    var m = Math.floor(t/60);
    var s = t%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }

  function saveData(){
    try{
      localStorage.setItem('pahomSexpah', String(sexpah));
      localStorage.setItem('pahomClicks', String(totalClicks));
      localStorage.setItem('pahomOverexcites', String(totalOverexcites));
      localStorage.setItem('pahomTool', currentTool);
      localStorage.setItem('pahomBuffs', JSON.stringify(activeBuffs));
    }catch(e){}
    dirtySave = false;
  }

  function getWeapon(id){ return WEAPONS[id]||WEAPONS.hand; }

  function isViagraActive(){ return activeBuffs.viagra && activeBuffs.viagra > Date.now(); }
  function isCigsActive(){ return activeBuffs.cigs && activeBuffs.cigs > Date.now(); }
  function getMaxLove(){ return isCigsActive()?CIGS_MAX_LOVE:BASE_MAX_LOVE; }
  function getComboBonus(){
    if (combo >= 20) return 4;
    if (combo >= 15) return 3;
    if (combo >= 10) return 2;
    if (combo >= 5) return 1;
    return 0;
  }
  function getClickPower(){ return getWeapon(currentTool).clickPower + getComboBonus(); }
  function getLoveAdd(){ return isViagraActive()?2:5; }

  function ensureBuffsTop(){
    if (!buffsTop) return;
    var now = Date.now();
    var hasV = activeBuffs.viagra && activeBuffs.viagra > now;
    var hasC = activeBuffs.cigs && activeBuffs.cigs > now;
    var hash = (hasV?'v'+Math.floor((activeBuffs.viagra-now)/1000):'')+'|'+(hasC?'c'+Math.floor((activeBuffs.cigs-now)/1000):'');
    if (hash === lastBuffsHash) return;
    lastBuffsHash = hash;
    if (!hasV && !hasC){
      buffsTop.classList.add('hidden');
      buffsTop.innerHTML = '';
      return;
    }
    buffsTop.classList.remove('hidden');
    var html = '';
    if (hasV) html += '<div class="buff-chip"><span>💊</span><span>'+fmtTime(activeBuffs.viagra-now)+'</span></div>';
    if (hasC) html += '<div class="buff-chip"><span>🚬</span><span>'+fmtTime(activeBuffs.cigs-now)+'</span></div>';
    if (buffsTop.innerHTML !== html) buffsTop.innerHTML = html;
  }

  function updateUI(){
    if (sexpahCount) sexpahCount.textContent = fmt(sexpah);
    var maxLove = getMaxLove();
    if (loveVerticalFill) loveVerticalFill.style.height = Math.min(100,(love/maxLove)*100)+'%';
    if (excitedDiv) excitedDiv.classList.toggle('hidden', love < maxLove);
    if (cooldownDiv){
      var txt;
      if (isCooldown) txt = '⏳ '+cooldownRemaining+' сек';
      else if (love >= maxLove) txt = 'Переполнена';
      else txt = 'Давануть Пахома';
      if (cooldownDiv.textContent !== txt) cooldownDiv.textContent = txt;
    }
    var w = getWeapon(currentTool);
    if (currentToolIconSpan) currentToolIconSpan.textContent = w.icon;
    if (currentToolNameSpan && currentToolNameSpan.textContent !== w.name) currentToolNameSpan.textContent = w.name;
    if (currentToolBox) currentToolBox.className = 'current-tool rarity-'+w.rarity;
    if (clickPowerLabel) clickPowerLabel.textContent = '+'+getClickPower()+' за клик';
    var bonus = getComboBonus();
    if (comboBonus){
      if (bonus > 0 && combo > 0){
        comboBonus.textContent = 'BONUS COMBO: +'+bonus;
        comboBonus.classList.add('show');
      } else {
        comboBonus.classList.remove('show');
      }
    }
  }

  function scheduleUI(){ requestAnimationFrame(updateUI); }

  function startExciteCooldown(){
    if (isCooldown) return;
    isCooldown = true;
    cooldownRemaining = 10;
    if (cooldownInterval) clearInterval(cooldownInterval);
    cooldownInterval = setInterval(function(){
      cooldownRemaining--;
      if (cooldownRemaining <= 0){
        clearInterval(cooldownInterval);
        cooldownInterval = null;
        isCooldown = false;
      }
      scheduleUI();
    },1000);
  }

  function spawnFloatText(x,y,text){
    var el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.setProperty('--drift-x', ((Math.random()-0.5)*60)+'px');
    el.style.fontSize = (1.15 + Math.min(combo,COMBO_MAX)*0.05)+'rem';
    document.body.appendChild(el);
    el.addEventListener('animationend', function(){
      if (el.parentNode) el.parentNode.removeChild(el);
    },{once:true});
  }

  function spawnRipple(x,y){
    var r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = x+'px';
    r.style.top = y+'px';
    document.body.appendChild(r);
    r.addEventListener('animationend', function(){
      if (r.parentNode) r.parentNode.removeChild(r);
    },{once:true});
  }

  function spawnSparkle(x,y){
    var s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = x+'px';
    s.style.top = y+'px';
    s.style.setProperty('--sx', ((Math.random()-0.5)*140)+'px');
    s.style.setProperty('--sy', ((Math.random()-0.5)*140-30)+'px');
    document.body.appendChild(s);
    s.addEventListener('animationend', function(){
      if (s.parentNode) s.parentNode.removeChild(s);
    },{once:true});
  }

  function bumpCombo(){
    combo++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){
      combo = 0;
      if (comboCounter) comboCounter.classList.remove('show','hot');
      if (comboBar){ comboBar.classList.remove('show'); comboBar.style.width = '0%'; }
      if (comboBonus) comboBonus.classList.remove('show');
      if (pahomHitbox) pahomHitbox.classList.remove('combo-hot','combo-max');
      scheduleUI();
    },COMBO_TIMEOUT);
    var shown = Math.min(combo,COMBO_MAX);
    if (comboCounter){
      comboCounter.textContent = 'x'+shown;
      comboCounter.classList.add('show');
      comboCounter.classList.toggle('hot', combo >= 10);
    }
    if (comboBar){
      comboBar.classList.add('show');
      comboBar.style.width = Math.min((combo/COMBO_MAX)*100,100)+'%';
    }
    if (pahomHitbox){
      pahomHitbox.classList.toggle('combo-hot', combo >= 10 && combo < COMBO_MAX);
      pahomHitbox.classList.toggle('combo-max', combo >= COMBO_MAX);
    }
  }

  function handleClick(){
    if (isCooldown) return;
    var now = Date.now();
    if (now - lastHandledClick < CLICK_CD) return;
    lastHandledClick = now;
    lastClickTime = now;
    totalClicks++;
    bumpCombo();

    if (pahomHitbox){
      pahomHitbox.classList.remove('clicking');
      requestAnimationFrame(function(){
        pahomHitbox.classList.add('clicking');
        setTimeout(function(){
          pahomHitbox.classList.remove('clicking');
        },700);
      });
    }

    var gained = getClickPower();
    sexpah += gained;
    dirtySave = true;

    if (pahomHitbox){
      var rect = pahomHitbox.getBoundingClientRect();
      var cx = rect.left + rect.width/2 + (Math.random()-0.5)*rect.width*0.6;
      var cy = rect.top + rect.height/2 + (Math.random()-0.5)*rect.height*0.6;
      if (now - lastRippleSpawn >= SPAWN_INTERVAL){
        lastRippleSpawn = now;
        spawnRipple(cx,cy);
      }
      if (now - lastFloatSpawn >= SPAWN_INTERVAL){
        lastFloatSpawn = now;
        spawnFloatText(cx,cy,'+'+gained);
      }
      if (combo >= 10 && Math.random() < 0.7){
        spawnSparkle(cx,cy);
      }
    }

    var maxLove = getMaxLove();
    love = Math.min(maxLove, love + getLoveAdd());

    if (love >= maxLove){
      totalOverexcites++;
      startExciteCooldown();
    }

    scheduleUI();

    if (now - lastForceSave > 10000){
      lastForceSave = now;
      if (window.pahomForceSave) window.pahomForceSave();
    }
  }

  function startDecay(){
    if (decayInterval) clearInterval(decayInterval);
    var lastDecay = Date.now();
    decayInterval = setInterval(function(){
      var now = Date.now();
      var dt = (now - lastDecay) / 1000;
      lastDecay = now;
      if (!isCooldown && love > 0 && now - lastClickTime >= 500){
        love = Math.max(0, love - 10 * dt);
        scheduleUI();
      }
    }, 100);
  }

  function startTicker(){
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(function(){
      if (dirtySave) saveData();
      ensureBuffsTop();
      try{
        var v = parseInt(localStorage.getItem('pahomSexpah')||'0',10)||0;
        if (v !== sexpah) sexpah = v;
        var t = localStorage.getItem('pahomTool')||'hand';
        if (t !== currentTool) currentTool = t;
      }catch(e){}
      scheduleUI();
    },1000);
  }

  function init(){
    if (pahomHitbox) pahomHitbox.addEventListener('click', handleClick);
    startDecay();
    startTicker();
    ensureBuffsTop();
    updateUI();
    try{
      if (window.tgSyncReady){
        window.tgSyncLoad(function(loaded){
          if (loaded){
            sexpah = parseInt(localStorage.getItem('pahomSexpah')||'0',10)||0;
            totalClicks = parseInt(localStorage.getItem('pahomClicks')||'0',10)||0;
            totalOverexcites = parseInt(localStorage.getItem('pahomOverexcites')||'0',10)||0;
            currentTool = localStorage.getItem('pahomTool')||'hand';
            try{ activeBuffs = JSON.parse(localStorage.getItem('pahomBuffs')||'{}')||{}; }catch(e){}
            lastBuffsHash = '';
            updateUI();
            ensureBuffsTop();
          }
        });
      }
    }catch(e){}
  }

  window.addEventListener('beforeunload', function(){
    if (dirtySave) saveData();
  });

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="income.js"></script>
<script src="server-sync.js"></script>
</body>
</html>
