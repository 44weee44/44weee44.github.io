<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>ГЛАВНАЯ — кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
:root {
  --bg-0:#0a0a0c;
  --bg-1:#121216;
  --bg-2:#18181f;
  --line:#24242c;
  --line-2:#33333d;
  --text:#e8e8ec;
  --text-2:#8a8a92;
  --text-3:#5a5a62;
  --accent:#2a8a30;
  --accent-2:#7af080;
  --green:#4cd964;
  --red:#ff4a4a;
  --gold:#ffd76b;
}

html, body {
  background:#050506;
  width:100%; height:100%;
  margin:0;
  font-family:-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Arial, sans-serif;
  color:var(--text);
  overflow:hidden;
}
body { display:flex; justify-content:center; align-items:center; touch-action:manipulation; }

.game-container {
  width:100%; max-width:520px; height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  background:var(--bg-0);
  position:relative; min-height:0; overflow:hidden;
  animation:fadeInSoft 0.5s ease-out;
}
@keyframes fadeInSoft { from { opacity:0.6; } to { opacity:1; } }

/* Сетка фона */
.game-container::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
}

/* Прожектор */
.game-container::after {
  content:'';
  position:absolute;
  top:-40%; left:50%;
  transform:translateX(-50%);
  width:500px; height:500px;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(42,138,48,0.06) 30deg, transparent 60deg,
    transparent 300deg, rgba(42,138,48,0.06) 330deg, transparent 360deg);
  animation:spotlight 24s linear infinite;
  pointer-events:none;
  z-index:0;
  filter:blur(30px);
}
@keyframes spotlight { 0% { transform:translateX(-50%) rotate(0); } 100% { transform:translateX(-50%) rotate(360deg); } }

/* ШАПКА */
.header {
  position:relative;
  z-index:5;
  padding:18px 20px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
  min-height:64px;
  flex-shrink:0;
}
.header::after {
  content:'';
  position:absolute;
  left:20%; right:20%;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-2), transparent);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.header-title {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  font-weight:800;
  letter-spacing:3px;
  font-size:0.95rem;
  text-transform:uppercase;
}
.header-title::before {
  content:'';
  width:8px; height:8px;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transform:rotate(45deg);
}

.score-board {
  position:relative;
  z-index:5;
  padding:8px 15px;
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
/* СЧЁТ */
.sexpah, .current-tool {
  flex:1;
  padding:5px 12px;
  border-radius:8px;
  background:var(--bg-1);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  font-size:0.82rem;
  font-weight:700;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:0.2px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.sexpah::before, .current-tool::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:3px; height:100%;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.sexpah.bump { transform:scale(1.06); box-shadow:0 0 20px rgba(42,138,48,0.6); }

/* Секспахомы — зелёный фон */
.sexpah {
  background:linear-gradient(135deg, rgba(42,138,48,0.15), rgba(20,40,22,0.4));
  border-color:rgba(122,240,128,0.35);
}
.sexpah::before { background:var(--accent-2); box-shadow:0 0 12px rgba(42,138,48,0.9); }

/* Оружие — фон и рамка по редкости */
.current-tool.rarity-common {
  background:linear-gradient(135deg, rgba(154,154,154,0.15), rgba(30,30,34,0.4));
  border-color:rgba(180,180,200,0.4);
}
.current-tool.rarity-common::before { background:#b4b4c8; box-shadow:0 0 12px rgba(180,180,200,0.9); }

.current-tool.rarity-rare {
  background:linear-gradient(135deg, rgba(59,130,246,0.18), rgba(15,25,50,0.4));
  border-color:rgba(59,130,246,0.55);
}
.current-tool.rarity-rare::before { background:#5aa8ff; box-shadow:0 0 12px rgba(90,168,255,0.9); }

.current-tool.rarity-legendary {
  background:linear-gradient(135deg, rgba(255,215,107,0.18), rgba(50,40,10,0.4));
  border-color:rgba(255,215,107,0.55);
}
.current-tool.rarity-legendary::before { background:#ffd76b; box-shadow:0 0 12px rgba(255,215,107,0.9); }

.current-tool.rarity-mythic {
  background:linear-gradient(135deg, rgba(168,85,247,0.18), rgba(40,15,60,0.4));
  border-color:rgba(168,85,247,0.55);
}
.current-tool.rarity-mythic::before { background:#a855f7; box-shadow:0 0 12px rgba(168,85,247,0.9); }

.current-tool.rarity-divine {
  background:linear-gradient(135deg, rgba(255,59,59,0.18), rgba(60,10,10,0.4));
  border-color:rgba(255,59,59,0.6);
}
.current-tool.rarity-divine::before { background:#ff3b3b; box-shadow:0 0 12px rgba(255,59,59,0.9); }

/* ПЛАШКА БАФФОВ */
.buffs-top {
  display:flex; gap:8px; align-items:center;
  padding:12px 16px; flex-shrink:0;
  border-bottom:1px solid var(--line);
  position:relative; z-index:5;
}
.buffs-top.hidden { display:none; }
.buff-chip {
  display:inline-flex; align-items:center; gap:8px;
  padding:8px 14px;
  background:var(--bg-1);
  border:1px solid var(--line-2);
  border-radius:10px;
  font-size:0.75rem; font-weight:800;
  color:var(--accent-2);
  font-family:'Courier New', monospace;
  letter-spacing:0.5px;
  position:relative;
  overflow:hidden;
  animation:chipIn 0.4s ease;
}
.buff-chip::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:3px; height:100%;
  background:var(--accent-2);
  box-shadow:0 0 8px rgba(42,138,48,0.9);
}
@keyframes chipIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

/* ОБЛАСТЬ КОНТЕНТА */
.content-area {
  position:relative; z-index:5;
  flex:1; min-height:0;
  display:flex;
  overflow:hidden;
}
.main-area {
  display:flex;
  width:100%; height:100%;
  gap:14px;
  padding:16px;
  padding-right:40px;
  position:relative;
}

/* ШКАЛА ЛЮБВИ */
.love-panel {
  display:flex;
  flex:0 0 46px;
  flex-shrink:0;
}
.love-scale-vertical {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 8px;
  width:100%;
  background:var(--bg-1);
  position:relative;
  overflow:hidden;
  transition:all 0.3s ease;
}
.love-scale-vertical::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:var(--accent-2);
  box-shadow:0 0 12px rgba(42,138,48,0.9);
}
.love-vertical-bg {
  width:20px; flex:1;
  background:var(--bg-2);
  border-radius:10px;
  overflow:hidden;
  display:flex; align-items:flex-end;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.9);
  position:relative;
}
.love-vertical-fill {
  width:100%; height:0%;
  background:linear-gradient(0deg, var(--accent), var(--accent-2));
  border-radius:10px;
  transition:height 0.25s linear;
  box-shadow:0 0 12px rgba(42,138,48,0.9), inset 0 1px 0 rgba(200,255,200,0.5);
  position:relative;
  overflow:hidden;
}
.love-vertical-fill::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, transparent, rgba(255,255,255,0.3), transparent);
  animation:loveShine 2.5s ease-in-out infinite;
}
@keyframes loveShine {
  0% { transform:translateY(-100%); }
  55% { transform:translateY(100%); }
  100% { transform:translateY(100%); }
}
.love-vertical-label {
  font-size:0.6rem; font-weight:800;
  color:var(--text-2);
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  letter-spacing:2px;
  text-transform:uppercase;
}

/* ПАХОМ */
.pahom-wrap {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transform:translateX(-30);
}

.pahom-hitbox {
  width:200px; height:200px;
  border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  cursor:pointer;
  border:1px solid var(--line-2);
  position:relative;
  background:var(--bg-1);
  transition:all 0.2s ease;
  animation:floatPahom 7s ease-in-out infinite;
  will-change:transform;
  transform-origin:center;
}
@keyframes floatPahom {
  0%, 100% { transform:translateY(0); }
  50%      { transform:translateY(-6px); }
}

/* Кольцо вокруг Пахома */
.pahom-hitbox::before {
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1px solid transparent;
  border-top-color:var(--accent-2);
  border-right-color:rgba(122,240,128,0.2);
  animation:ringSpin 8s linear infinite;
  pointer-events:none;
}
@keyframes ringSpin {
  from { transform:rotate(0deg); }
  to   { transform:rotate(360deg); }
}

.pahom-face {
  font-size:5rem;
  pointer-events:none;
  filter:drop-shadow(0 0 15px rgba(42,138,48,0.6));
  transition:filter 0.3s ease;
}
.pahom-hitbox:hover .pahom-face {
  filter:drop-shadow(0 0 25px rgba(42,138,48,0.9));
}

.click-power {
  position:absolute;
  bottom:-32px; left:50%;
  transform:translateX(-50%);
  color:var(--accent-2);
  font-size:0.75rem; font-weight:800;
  white-space:nowrap;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:4px 12px;
  background:var(--bg-1);
  border:1px solid var(--line-2);
  border-radius:20px;
  box-shadow:0 0 15px rgba(42,138,48,0.3);
}

/* Комбо */
.pahom-hitbox.combo-hot {
  border-color:var(--gold);
  box-shadow:0 0 25px rgba(255,215,107,0.6);
}
.pahom-hitbox.combo-hot::before {
  border-top-color:var(--gold);
  border-right-color:rgba(255,215,107,0.3);
}
.pahom-hitbox.combo-max {
  border-color:var(--red);
  box-shadow:0 0 35px rgba(255,74,74,0.8);
}
.pahom-hitbox.combo-max::before {
  border-top-color:var(--red);
  border-right-color:rgba(255,74,74,0.3);
}

/* ИНДИКАТОР КД / ДЕЙСТВИЯ */
.cooldown-indicator {
  position:relative; z-index:5;
  text-align:center;
  padding:14px 16px;
  color:var(--text-2);
  font-size:0.78rem;
  font-weight:800;
  letter-spacing:1.8px;
  text-transform:uppercase;
  background:var(--bg-1);
  border-top:1px solid var(--line);
  transition:all 0.3s ease;
  flex-shrink:0;
}
.cooldown-indicator.active {
  color:var(--accent-2);
  text-shadow:0 0 12px rgba(42,138,48,0.8);
}

/* НОТИФИКАЦИЯ */
.notification {
  background:var(--bg-1);
  border-top:1px solid var(--red);
  color:var(--red);
  text-align:center;
  padding:12px;
  font-weight:800;
  font-size:0.78rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  flex-shrink:0;
  position:relative;
  z-index:5;
  animation:notifPulse 1.8s ease-in-out infinite;
}
@keyframes notifPulse {
  0%, 100% { box-shadow:inset 0 0 20px rgba(255,74,74,0.2); }
  50%      { box-shadow:inset 0 0 40px rgba(255,74,74,0.4); }
}
.hidden { display:none !important; }

/* НИЖНИЕ ТАБЫ */
.tabs-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:0 30px 80px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px));
  flex-shrink:0; z-index:20; gap:10px;
  position:relative;
}
.tabs-bar::before {
  content:'';
  position:absolute;
  top:0; left:16px; right:16px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
}
.tab-btn {
  background:transparent; border:none; cursor:pointer;
  color:var(--text-3); opacity:0.7; padding:8px;
  text-decoration:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:12px;
  transition:all 0.3s ease;
  position:relative;
}
.tab-btn.active { opacity:1; color:var(--accent-2); transform:scale(1.1) translateY(-3px); }
.tab-btn.active::after {
  content:'';
  position:absolute;
  bottom:-2px; left:50%;
  transform:translateX(-50%);
  width:60%; height:2px;
  background:var(--accent-2);
  box-shadow:0 0 10px rgba(42,138,48,0.9);
}
.tab-btn:hover { opacity:1; transform:scale(1.08) translateY(-2px); }
.tab-btn:active { transform:scale(0.95); }
.tab-btn svg { width:30px; height:30px; transition:transform 0.3s ease, filter 0.3s ease; }
.tab-btn.home-btn svg { width:38px; height:38px; }
.tab-btn.boss-btn svg { width:32px; height:32px; }
.tab-btn.boss-btn:hover { color:var(--red); }
.tab-btn.rating-btn:hover { color:var(--gold); }

/* ====== ЦИФРЫ ПРИ КЛИКЕ ====== */
.float-text {
  position:fixed;
  pointer-events:none;
  font-weight:900;
  font-size:1.15rem;
  color:var(--accent-2);
  z-index:200;
  white-space:nowrap;
  text-shadow:
    0 2px 4px rgba(0,0,0,0.95),
    0 0 12px rgba(42,138,48,0.9);
  animation:floatRise 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  will-change:transform, opacity;
}
@keyframes floatRise {
  0%   { opacity:0; transform:translate(-50%, -50%) scale(0.7); }
  12%  { opacity:1; transform:translate(-50%, -62%) scale(1.05); }
  100% { opacity:0; transform:translate(-50%, -220%) scale(0.95); }
}
.float-text.mini {
  font-size:0.8rem;
  color:#d0ffd0;
  text-shadow:0 1px 3px rgba(0,0,0,0.95), 0 0 8px rgba(122,240,128,0.7);
  animation-duration:1.6s;
}
.float-text.max {
  font-size:1.7rem;
  color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,0.95), 0 0 14px rgba(255,215,107,1), 0 0 28px rgba(255,215,107,0.6);
  animation-duration:1.5s;
}
.float-text.sway {
  animation:floatRise 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards,
             swayX 1.4s ease-in-out forwards;
}
@keyframes swayX {
  0%   { margin-left:0px; }
  25%  { margin-left:8px; }
  50%  { margin-left:-6px; }
  75%  { margin-left:4px; }
  100% { margin-left:-2px; }
}

/* ====== КОМБО ====== */
.combo-counter {
  position:fixed;
  top:160px; left:50%;
  transform:translateX(-50%) scale(0.5);
  font-size:2.8rem; font-weight:900;
  color:var(--accent-2);
  text-shadow:0 3px 8px rgba(0,0,0,0.9), 0 0 25px rgba(42,138,48,1), 0 0 50px rgba(42,138,48,0.6);
  opacity:0; pointer-events:none;
  z-index:150;
  transition:opacity 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
             transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
             color 0.5s ease;
  letter-spacing:3px;
  will-change:transform, opacity;
}
.combo-counter.show { opacity:1; transform:translateX(-50%) scale(1); }
.combo-counter.pulse { animation:comboPulse 0.45s cubic-bezier(0.25, 0.1, 0.25, 1); }
@keyframes comboPulse {
  0%   { transform:translateX(-50%) scale(1); }
  45%  { transform:translateX(-50%) scale(1.2); }
  100% { transform:translateX(-50%) scale(1); }
}
.combo-counter.hot {
  color:var(--gold);
  text-shadow:0 3px 8px rgba(0,0,0,0.9), 0 0 30px rgba(255,215,107,1), 0 0 60px rgba(255,215,107,0.7);
}
.combo-counter.max {
  color:var(--red);
  text-shadow:0 3px 8px rgba(0,0,0,0.9), 0 0 35px rgba(255,74,74,1), 0 0 70px rgba(255,74,74,0.8);
  animation:maxGlow 1.4s ease-in-out infinite;
}
@keyframes maxGlow {
  0%, 100% { text-shadow:0 3px 8px rgba(0,0,0,0.9), 0 0 30px rgba(255,74,74,1), 0 0 60px rgba(255,74,74,0.7); transform:translateX(-50%) scale(1); }
  50%      { text-shadow:0 3px 8px rgba(0,0,0,0.9), 0 0 50px rgba(255,74,74,1), 0 0 95px rgba(255,215,107,0.8); transform:translateX(-50%) scale(1.08); }
}

.combo-bar {
  position:fixed;
  top:0; left:0;
  height:3px; width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 15px rgba(42,138,48,1), 0 0 30px rgba(42,138,48,0.6);
  z-index:300;
  transition:width 0.25s linear, opacity 0.5s ease, background 0.5s ease;
  opacity:0;
  border-radius:0 3px 3px 0;
}
.combo-bar.show { opacity:1; }
.combo-bar.hot {
  background:linear-gradient(90deg, var(--accent-2), var(--gold));
  box-shadow:0 0 20px rgba(255,215,107,1), 0 0 40px rgba(255,215,107,0.7);
}
.combo-bar.max {
  background:linear-gradient(90deg, var(--gold), var(--red));
  box-shadow:0 0 25px rgba(255,74,74,1), 0 0 50px rgba(255,74,74,0.8);
  animation:barMaxPulse 1.4s ease-in-out infinite;
}
@keyframes barMaxPulse {
  0%, 100% { opacity:1; }
  50%      { opacity:0.75; }
}

.combo-bonus {
  position:fixed;
  top:215px; left:50%;
  transform:translateX(-50%) translateY(-12px);
  font-size:0.95rem; font-weight:800;
  color:var(--accent-2);
  text-shadow:0 2px 6px rgba(0,0,0,0.9), 0 0 22px rgba(42,138,48,1);
  opacity:0; pointer-events:none;
  z-index:150;
  transition:opacity 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
             transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
             color 0.5s ease;
  letter-spacing:1px;
  white-space:nowrap;
}
.combo-bonus.show { opacity:1; transform:translateX(-50%) translateY(0); }
.combo-bonus.max {
  color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,0.9), 0 0 25px rgba(255,215,107,1);
}

@media (max-width:400px) {
  .pahom-hitbox { width:170px; height:170px; }
  .pahom-face { font-size:4.2rem; }
  .combo-counter { font-size:2.2rem; }
  .combo-bonus { font-size:0.85rem; top:205px; }
  .tabs-bar { padding:0 15px 80px; padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-height:700px) {
  .pahom-hitbox { width:170px; height:170px; }
  .pahom-face { font-size:4.2rem; }
  .tabs-bar { padding-bottom:40px; padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-height:600px) {
  .pahom-hitbox { width:150px; height:150px; }
  .pahom-face { font-size:3.6rem; }
  .tabs-bar { padding-bottom:15px; padding-bottom:calc(15px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>
<script src="income.js"></script>

<div class="game-container">
  <div class="header">
    <div class="header-title">ГЛАВНАЯ</div>
  </div>

  <div class="score-board">
    <div class="sexpah">🔞 <span id="sexpahCount">0</span> секспахомов</div>
    <div class="current-tool" id="currentToolBox">
      <span id="currentToolIcon">✋</span> <span id="currentToolName">Рука</span>
    </div>
  </div>

  <div class="buffs-top hidden" id="buffsTop"></div>

  <div class="content-area">
    <div class="main-area">
      <div class="love-panel">
        <div class="love-scale-vertical">
          <div class="love-vertical-bg">
            <div id="loveVerticalFill" class="love-vertical-fill"></div>
          </div>
          <span class="love-vertical-label">ЛЮБОВЬ</span>
        </div>
      </div>
      <div class="pahom-wrap">
        <div id="pahomHitbox" class="pahom-hitbox">
          <div class="pahom-face">👴</div>
          <div class="click-power" id="clickPowerLabel">+1 за клик</div>
        </div>
      </div>
    </div>
  </div>

  <div id="cooldownMessage" class="cooldown-indicator">Давануть Пахома😍</div>
  <div id="excitedNotification" class="notification hidden">🚨 ПАХОМ ПЕРЕВОЗБУДИЛСЯ!</div>

  <div class="tabs-bar">
    <a href="boss.html" class="tab-btn boss-btn" title="Боссы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2C7.6 2 4 5.6 4 10c0 2.4 1 4.5 2.7 5.9V19c0 .6.4 1 1 1h1.3v-2h1.4v2h1.2v-2h1.4v2H14v-2h1.4v2H16.7c.6 0 1-.4 1-1v-3.1C19.4 14.5 20 12.4 20 10c0-4.4-3.6-8-8-8z"/>
        <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
        <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
      </svg>
    </a>
    <a href="shop.html" class="tab-btn" title="Магазин">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </a>
    <a href="seks.html" class="tab-btn home-btn active" title="Главная">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="rating.html" class="tab-btn rating-btn" title="Рейтинг">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h2a2 2 0 012 2v1a3 3 0 01-3 3"/><path d="M7 5H5a2 2 0 00-2 2v1a3 3 0 003 3"/>
      </svg>
    </a>
    <a href="prof.html" class="tab-btn" title="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </div>
</div>

<div class="combo-bar" id="comboBar"></div>
<div class="combo-counter" id="comboCounter">x1</div>
<div class="combo-bonus" id="comboBonus">БОНУС: +1</div>

<script>
(function() {
  'use strict';

  var SVG_DARK_KATANA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3-3" stroke="#6a4a2a"/><path d="M6 18l12-12" stroke="#1a1a1a"/><path d="M18 6l3-3" stroke="#333"/><path d="M6 18l-2 2" stroke="#4a2a1a"/><path d="M5 19l1 1" stroke="#2a1a0a"/><path d="M14 8l2 2" stroke="#555"/></svg>';
  var SVG_ABYSS_BLADE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3-3" stroke="#8b0000"/><path d="M6 18l12-12" stroke="#ff3b3b"/><path d="M18 6l3-3" stroke="#ff6a3b"/><path d="M6 18l-2 2" stroke="#5a0000"/><path d="M5 19l1 1" stroke="#3a0000"/><path d="M14 8l2 2" stroke="#ff8c3c"/><circle cx="19" cy="5" r="1.5" fill="#ffd76b" stroke="none"/></svg>';

  var WEAPONS = {
    hand:{name:'Рука',icon:'✋',clickPower:1,rarity:'common'},
    whip:{name:'Плетка',icon:'🐍',clickPower:3,rarity:'common'},
    stick:{name:'Палка',icon:'🥢',clickPower:5,rarity:'common'},
    shank:{name:'Черенок',icon:'🔧',clickPower:7,rarity:'rare'},
    shovel:{name:'Лопата',icon:'🪏',clickPower:9,rarity:'rare'},
    commissar:{name:'Замполит',icon:'🎖️',clickPower:11,rarity:'rare'},
    drin:{name:'Дрын',icon:'🌲',clickPower:13,rarity:'legendary'},
    tyrchik:{name:'Тырчик',icon:'⚡',clickPower:15,rarity:'legendary'},
    darkkatana:{name:'Тёмная катана',icon:null,svg:SVG_DARK_KATANA,clickPower:20,rarity:'mythic'},
    abysblade:{name:'Клинок бездны',icon:null,svg:SVG_ABYSS_BLADE,clickPower:25,rarity:'mythic'}
  };

  var CLICK_CD = 55;
  var SAVE_EVERY_CLICKS = 10;
  var LOVE_DECAY_PER_SEC = 10;

  function $(id) { return document.getElementById(id); }

  var sexpahCount = $('sexpahCount');
  var loveVerticalFill = $('loveVerticalFill');
  var pahomHitbox = $('pahomHitbox');
  var cooldownDiv = $('cooldownMessage');
  var excitedDiv = $('excitedNotification');
  var currentToolIconSpan = $('currentToolIcon');
  var currentToolNameSpan = $('currentToolName');
  var currentToolBox = $('currentToolBox');
  var clickPowerLabel = $('clickPowerLabel');
  var comboCounter = $('comboCounter');
  var comboBar = $('comboBar');
  var comboBonus = $('comboBonus');
  var buffsTop = $('buffsTop');

  var sexpah = 0;
  var love = 0;
  var BASE_MAX_LOVE = 300;
  var CIGS_MAX_LOVE = 500;
  var totalClicks = 0;
  var totalOverexcites = 0;
  var currentTool = 'hand';
  var activeBuffs = {};
  var lastLoveClickAt = Date.now();

  try { sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0; } catch(e) {}
  try { totalClicks = parseInt(localStorage.getItem('pahomClicks') || '0', 10) || 0; } catch(e) {}
  try { totalOverexcites = parseInt(localStorage.getItem('pahomOverexcites') || '0', 10) || 0; } catch(e) {}
  try { currentTool = localStorage.getItem('pahomTool') || 'hand'; } catch(e) {}
  try { activeBuffs = JSON.parse(localStorage.getItem('pahomBuffs') || '{}') || {}; } catch(e) { activeBuffs = {}; }
  try { lastLoveClickAt = parseInt(localStorage.getItem('pahomLoveLastClick') || '0', 10) || Date.now(); } catch(e) {}

  if (Date.now() - lastLoveClickAt > 1000) love = 0;

  var isCooldown = false;
  var cooldownRemaining = 0;
  var cooldownInterval = null;

  var combo = 0;
  var comboTimer = null;
  var COMBO_TIMEOUT = 1500;
  var COMBO_MAX = 20;

  var lastHandledClick = 0;
  var dirtySave = false;
  var clicksSinceSave = 0;
  var saveTickerInterval = null;
  var loveDecayInterval = null;
  var buffInterval = null;
  var tickerInterval = null;
  var lastBuffsHash = '';

  var hitboxRect = null;
  var hitboxRectTime = 0;

  function formatSexpah(n) {
    if (n >= 1000000000) { var v = n / 1000000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'B'; }
    if (n >= 1000000) { var v = n / 1000000; return (v < 10 ? v.toFixed(1) : Math.floor(v)) + 'M'; }
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatTime(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(t / 60);
    var s = t % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function saveDataLocal() {
    try {
      localStorage.setItem('pahomSexpah', String(sexpah));
      localStorage.setItem('pahomClicks', String(totalClicks));
      localStorage.setItem('pahomOverexcites', String(totalOverexcites));
      localStorage.setItem('pahomTool', currentTool);
      localStorage.setItem('pahomBuffs', JSON.stringify(activeBuffs));
      localStorage.setItem('pahomLoveLastClick', String(lastLoveClickAt));
    } catch(e) {}
    dirtySave = false;
  }

  function saveNow() {
    saveDataLocal();
    try { if (window.pahomSaveNow) window.pahomSaveNow(); } catch(e) {}
  }

  function syncToServer() {
    saveDataLocal();
    try { if (window.tgSyncSave) window.tgSyncSave(true); } catch(e) {}
  }

  function markDirty() { dirtySave = true; }

  function syncSexpahFromStorage() {
    try {
      var v = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
      if (v !== sexpah) sexpah = v;
    } catch(e) {}
  }

  function syncToolFromStorage() {
    try {
      var t = localStorage.getItem('pahomTool') || 'hand';
      if (t !== currentTool) currentTool = t;
    } catch(e) {}
  }

  function getWeapon(id) { return WEAPONS[id] || WEAPONS.hand; }
  function isViagraActive() { return activeBuffs.viagra && activeBuffs.viagra > Date.now(); }
  function isCigsActive() { return activeBuffs.cigs && activeBuffs.cigs > Date.now(); }
  function getMaxLove() { return isCigsActive() ? CIGS_MAX_LOVE : BASE_MAX_LOVE; }

  function getComboBonus() {
    if (combo >= 20) return 4;
    if (combo >= 15) return 3;
    if (combo >= 10) return 2;
    if (combo >= 5) return 1;
    return 0;
  }
  function getClickPower() { return getWeapon(currentTool).clickPower + getComboBonus(); }
  function getLoveAdd() { return isViagraActive() ? 2 : 5; }

  function ensureBuffsTop() {
    if (!buffsTop) return;
    var now = Date.now();
    var hasV = activeBuffs.viagra && activeBuffs.viagra > now;
    var hasC = activeBuffs.cigs && activeBuffs.cigs > now;
    var hash = (hasV ? 'v' + Math.floor((activeBuffs.viagra - now) / 1000) : '') + '|' + (hasC ? 'c' + Math.floor((activeBuffs.cigs - now) / 1000) : '');
    if (hash === lastBuffsHash) return;
    lastBuffsHash = hash;

    if (!hasV && !hasC) {
      buffsTop.classList.add('hidden');
      buffsTop.innerHTML = '';
      return;
    }
    buffsTop.classList.remove('hidden');
    var html = '';
    if (hasV) html += '<div class="buff-chip"><span>💊</span><span>' + formatTime(activeBuffs.viagra - now) + '</span></div>';
    if (hasC) html += '<div class="buff-chip"><span>🚬</span><span>' + formatTime(activeBuffs.cigs - now) + '</span></div>';
    if (buffsTop.innerHTML !== html) buffsTop.innerHTML = html;
  }

  function updateUI() {
    if (sexpahCount) sexpahCount.textContent = formatSexpah(sexpah);

    var maxLove = getMaxLove();
    if (loveVerticalFill) loveVerticalFill.style.height = Math.min(100, (love / maxLove) * 100) + '%';
    if (excitedDiv) excitedDiv.classList.toggle('hidden', love < maxLove);

    if (cooldownDiv) {
      var txt;
      if (isCooldown) txt = '⏳ ' + cooldownRemaining + ' сек';
      else if (love >= maxLove) txt = '💔 Переполнена';
      else txt = 'Давануть Пахома😍';
      if (cooldownDiv.textContent !== txt) cooldownDiv.textContent = txt;
    }

    var w = getWeapon(currentTool);
    if (currentToolIconSpan) {
      if (w.svg) {
        currentToolIconSpan.innerHTML = '<span class="weapon-svg">' + w.svg + '</span>';
      } else {
        if (currentToolIconSpan.textContent !== w.icon) currentToolIconSpan.textContent = w.icon;
      }
    }
    if (currentToolNameSpan && currentToolNameSpan.textContent !== w.name) currentToolNameSpan.textContent = w.name;
    if (currentToolBox) currentToolBox.className = 'current-tool rarity-' + w.rarity;
    if (clickPowerLabel) clickPowerLabel.textContent = '+' + getClickPower() + ' за клик';

    var bonus = getComboBonus();
    if (comboBonus) {
      if (bonus > 0 && combo > 0) {
        comboBonus.textContent = 'БОНУС КОМБО: +' + bonus;
        comboBonus.classList.add('show');
      } else {
        comboBonus.classList.remove('show');
      }
    }
  }

  function scheduleUI() { requestAnimationFrame(updateUI); }

  function startExciteCooldown() {
    if (isCooldown) return;
    isCooldown = true;
    cooldownRemaining = 10;
    if (cooldownInterval) clearInterval(cooldownInterval);
    cooldownInterval = setInterval(function() {
      cooldownRemaining--;
      if (cooldownRemaining <= 0) {
        clearInterval(cooldownInterval);
        cooldownInterval = null;
        isCooldown = false;
      }
      scheduleUI();
    }, 1000);
  }

  function spawnNumber(x, y, text, isMini, isMax) {
    var el = document.createElement('div');
    el.className = 'float-text';

    if (Math.random() < 0.2) {
      el.classList.add('sway');
      var shift = (Math.random() - 0.5) * 50;
      el.style.setProperty('--sway-x', shift + 'px');
    }

    if (isMini) el.classList.add('mini');
    if (isMax) el.classList.add('max');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    document.body.appendChild(el);
    el.addEventListener('animationend', function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, { once: true });
  }

  function playClickNumbers(x, y, gained) {
    var isMax = combo >= COMBO_MAX;

    if (isMax) {
      spawnNumber(x, y, '+' + gained, false, true);
      spawnNumber(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, '+' + gained, true, false);
      spawnNumber(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, '+' + gained, true, false);
      return;
    }

    spawnNumber(x, y, '+' + gained, false, false);

    var extraCount = 2;
    if (combo >= 15) extraCount = 4;
    else if (combo >= 10) extraCount = 3;

    for (var i = 0; i < extraCount; i++) {
      (function(idx) {
        setTimeout(function() {
          var ox = x + (Math.random() - 0.5) * 50;
          var oy = y + (Math.random() - 0.5) * 50;
          spawnNumber(ox, oy, '+' + gained, true, false);
        }, 30 + idx * 25);
      })(i);
    }
  }

  function updateComboVisual() {
    var shown = Math.min(combo, COMBO_MAX);
    if (comboCounter) {
      comboCounter.textContent = 'x' + shown;
      comboCounter.classList.add('show');
      comboCounter.classList.toggle('hot', combo >= 10 && combo < COMBO_MAX);
      comboCounter.classList.toggle('max', combo >= COMBO_MAX);
      comboCounter.classList.remove('pulse');
      void comboCounter.offsetWidth;
      comboCounter.classList.add('pulse');
      setTimeout(function() { comboCounter.classList.remove('pulse'); }, 450);
    }
    if (comboBar) {
      comboBar.classList.add('show');
      comboBar.style.width = Math.min((combo / COMBO_MAX) * 100, 100) + '%';
      comboBar.classList.toggle('hot', combo >= 10 && combo < COMBO_MAX);
      comboBar.classList.toggle('max', combo >= COMBO_MAX);
    }
    if (pahomHitbox) {
      pahomHitbox.classList.toggle('combo-hot', combo >= 10 && combo < COMBO_MAX);
      pahomHitbox.classList.toggle('combo-max', combo >= COMBO_MAX);
    }
    if (comboBonus) {
      if (combo >= COMBO_MAX) comboBonus.classList.add('max');
      else comboBonus.classList.remove('max');
    }
  }

  function resetCombo() {
    combo = 0;
    if (comboCounter) comboCounter.classList.remove('show', 'hot', 'max');
    if (comboBar) { comboBar.classList.remove('show', 'hot', 'max'); comboBar.style.width = '0%'; }
    if (comboBonus) comboBonus.classList.remove('show', 'max');
    if (pahomHitbox) pahomHitbox.classList.remove('combo-hot', 'combo-max');
    scheduleUI();
  }

  function bumpCombo() {
    combo++;
    updateComboVisual();
    if (comboTimer) clearTimeout(comboTimer);
    comboTimer = setTimeout(resetCombo, COMBO_TIMEOUT);
  }

  function getExpRequired(level) { return 1200 + (level - 1) * 600; }
  function addPlayerExp(amount) {
    try {
      var exp = parseInt(localStorage.getItem('pahomPlayerExp') || '0', 10) || 0;
      var lv = parseInt(localStorage.getItem('pahomPlayerLevel') || '1', 10) || 1;
      exp += amount;
      while (exp >= getExpRequired(lv)) { exp -= getExpRequired(lv); lv++; }
      localStorage.setItem('pahomPlayerExp', String(exp));
      localStorage.setItem('pahomPlayerLevel', String(lv));
    } catch(e) {}
  }

  function handleClick() {
    if (isCooldown) return;
    var now = Date.now();
    if (now - lastHandledClick < CLICK_CD) return;
    lastHandledClick = now;
    lastLoveClickAt = now;
    totalClicks++;
    bumpCombo();

    if (totalClicks % 10 === 0) {
      try { addPlayerExp(20); } catch(e) {}
    }

    var gained = getClickPower();
    sexpah += gained;
    markDirty();
    clicksSinceSave++;

    if (!hitboxRect || now - hitboxRectTime > 1000) {
      hitboxRect = pahomHitbox.getBoundingClientRect();
      hitboxRectTime = now;
    }

    var cx = hitboxRect.left + hitboxRect.width / 2;
    var cy = hitboxRect.top + hitboxRect.height / 2;

    playClickNumbers(cx, cy, gained);

    var maxLove = getMaxLove();
    love = Math.min(maxLove, love + getLoveAdd());

    if (love >= maxLove) {
      totalOverexcites++;
      startExciteCooldown();
    }

    if (clicksSinceSave >= SAVE_EVERY_CLICKS) {
      clicksSinceSave = 0;
      saveNow();
    }

    scheduleUI();
  }

  function startLoveDecay() {
    if (loveDecayInterval) clearInterval(loveDecayInterval);
    var lastDecay = Date.now();
    loveDecayInterval = setInterval(function() {
      var now = Date.now();
      var dt = (now - lastDecay) / 1000;
      lastDecay = now;
      if (!isCooldown && love > 0 && now - lastLoveClickAt >= 500) {
        love = Math.max(0, love - LOVE_DECAY_PER_SEC * dt);
        scheduleUI();
      }
    }, 100);
  }

  function startBuffCheck() {
    if (buffInterval) clearInterval(buffInterval);
    buffInterval = setInterval(function() {
      var now = Date.now();
      var changed = false;
      if (activeBuffs.viagra && activeBuffs.viagra <= now) { delete activeBuffs.viagra; changed = true; }
      if (activeBuffs.cigs && activeBuffs.cigs <= now) {
        delete activeBuffs.cigs;
        if (love > BASE_MAX_LOVE) love = BASE_MAX_LOVE;
        changed = true;
      }
      ensureBuffsTop();
      if (changed) { markDirty(); scheduleUI(); }
    }, 1000);
  }

  function startSaveTicker() {
    if (saveTickerInterval) clearInterval(saveTickerInterval);
    saveTickerInterval = setInterval(function() {
      if (dirtySave) syncToServer();
    }, 3000);
  }

  function startTicker() {
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(function() {
      ensureBuffsTop();
      syncSexpahFromStorage();
      syncToolFromStorage();
      scheduleUI();
    }, 1000);
  }

  function handleVisibilityHidden() {
    saveDataLocal();
    try { if (window.tgSyncSaveBeacon) window.tgSyncSaveBeacon(); } catch(e) {}
  }

  function init() {
    pahomHitbox.addEventListener('click', handleClick);
    startLoveDecay();
    startBuffCheck();
    startSaveTicker();
    startTicker();
    syncSexpahFromStorage();
    syncToolFromStorage();
    ensureBuffsTop();
    updateUI();

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) handleVisibilityHidden();
    });
    window.addEventListener('pagehide', handleVisibilityHidden);
    window.addEventListener('beforeunload', function() { saveDataLocal(); });
    window.addEventListener('resize', function() { hitboxRect = null; });
    window.addEventListener('scroll', function() { hitboxRect = null; }, { passive: true });

    try {
      if (window.tgSyncReady) {
        window.tgSyncLoad(function(loaded) {
          if (loaded) {
            sexpah = parseInt(localStorage.getItem('pahomSexpah') || '0', 10) || 0;
            totalClicks = parseInt(localStorage.getItem('pahomClicks') || '0', 10) || 0;
            totalOverexcites = parseInt(localStorage.getItem('pahomOverexcites') || '0', 10) || 0;
            currentTool = localStorage.getItem('pahomTool') || 'hand';
            try { activeBuffs = JSON.parse(localStorage.getItem('pahomBuffs') || '{}') || {}; } catch(e) {}
            lastBuffsHash = '';
            updateUI();
            ensureBuffsTop();
          }
        });
      }
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="server-sync.js"></script>
</body>
