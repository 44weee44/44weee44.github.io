<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ==== ФОН ==== */
.load-bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 45%, rgba(184, 150, 46, 0.18), transparent 50%),
    radial-gradient(circle at 50% 60%, rgba(106, 74, 154, 0.14), transparent 65%),
    radial-gradient(circle at 15% 85%, rgba(192, 57, 43, 0.10), transparent 60%),
    linear-gradient(160deg, #0d0d0d, #050505);
  z-index: 0;
  animation: bgPulse 6s ease-in-out infinite;
}
@keyframes bgPulse {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.18); }
}

/* ==== ПЛАВАЮЩИЕ СВЕТЯЩИЕСЯ ШАРЫ ==== */
.load-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  z-index: 1;
  pointer-events: none;
  opacity: 0.4;
}
.orb-1 { width: 280px; height: 280px; background: #b8962e; top: 3%; left: -5%; animation: orbFloat1 12s ease-in-out infinite; }
.orb-2 { width: 250px; height: 250px; background: #6a4a9a; bottom: 3%; right: -5%; animation: orbFloat2 14s ease-in-out infinite; }
.orb-3 { width: 200px; height: 200px; background: #c0392b; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: orbFloat3 10s ease-in-out infinite; opacity: 0.18; }
@keyframes orbFloat1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(60px, -40px) scale(1.15); }
  66%      { transform: translate(-30px, 60px) scale(0.9); }
}
@keyframes orbFloat2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(-60px, 30px) scale(1.2); }
  66%      { transform: translate(40px, -50px) scale(0.85); }
}
@keyframes orbFloat3 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.18; }
  50%      { transform: translate(-50%, -50%) scale(1.3); opacity: 0.35; }
}

/* ==== ЧАСТИЦЫ (искры) ==== */
.load-particles {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}
.load-particles span {
  position: absolute;
  bottom: -10px;
  width: 3px; height: 3px;
  background: rgba(255, 215, 107, 0.85);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(255, 215, 107, 1);
  animation: sparkRise linear infinite;
}
@keyframes sparkRise {
  0%   { transform: translateY(0) translateX(0) scale(0.4); opacity: 0; }
  10%  { opacity: 1; }
  50%  { transform: translateY(-50vh) translateX(20px) scale(1); opacity: 1; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(-105vh) translateX(-20px) scale(0.3); opacity: 0; }
}

/* ==== ЦЕНТР ==== */
.load-wrap {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  animation: wrapAppear 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  padding: 20px;
}
@keyframes wrapAppear {
  0% { opacity: 0; transform: translateY(30px) scale(0.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ==== КОЛЬЦО С ПРОГРЕССОМ ==== */
.load-ring-wrap {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Лучи, вращающиеся вокруг */
.load-rays {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(255, 215, 107, 0.15) 20deg,
    transparent 40deg,
    transparent 360deg
  );
  animation: raysSpin 8s linear infinite;
  pointer-events: none;
}
.load-rays::after {
  content: '';
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  background: conic-gradient(
    from 180deg,
    transparent 0deg,
    rgba(106, 74, 154, 0.15) 25deg,
    transparent 50deg,
    transparent 360deg
  );
  animation: raysSpinRev 12s linear infinite;
}
@keyframes raysSpin { to { transform: rotate(360deg); } }
@keyframes raysSpinRev { to { transform: rotate(-360deg); } }

/* SVG-кольцо прогресса */
.progress-svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
  pointer-events: none;
}
.progress-svg circle {
  fill: none;
  stroke-width: 4;
  stroke-linecap: round;
}
.progress-track {
  stroke: rgba(74, 74, 42, 0.5);
}
.progress-fill {
  stroke: url(#gradient);
  stroke-dasharray: 628;
  stroke-dashoffset: 628;
  transition: stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  filter: drop-shadow(0 0 8px rgba(255, 215, 107, 0.9));
}

/* Внутренние вращающиеся кольца */
.load-ring-outer,
.load-ring-mid {
  position: absolute;
  border-radius: 50%;
  border: 1px solid transparent;
}
.load-ring-outer {
  inset: 20px;
  border-top-color: rgba(255, 215, 107, 0.6);
  border-right-color: rgba(255, 215, 107, 0.15);
  animation: ringSpin 3s linear infinite;
}
.load-ring-mid {
  inset: 34px;
  border-bottom-color: rgba(106, 74, 154, 0.7);
  border-left-color: rgba(106, 74, 154, 0.15);
  animation: ringSpinRev 4s linear infinite;
}
@keyframes ringSpin { to { transform: rotate(360deg); } }
@keyframes ringSpinRev { to { transform: rotate(-360deg); } }

.load-emoji {
  font-size: 5.5rem;
  z-index: 3;
  animation: emojiPulse 2.4s ease-in-out infinite;
  filter: drop-shadow(0 0 25px rgba(184, 150, 46, 0.8));
  position: relative;
}
@keyframes emojiPulse {
  0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 25px rgba(184, 150, 46, 0.8)); }
  50%      { transform: scale(1.12) rotate(-4deg); filter: drop-shadow(0 0 50px rgba(255, 215, 107, 1)); }
}

/* ==== ЗАГОЛОВОК ==== */
.load-title-wrap {
  position: relative;
  overflow: hidden;
}
.load-title {
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: 6px;
  color: #c4b08a;
  text-transform: uppercase;
  text-align: center;
  text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  position: relative;
  padding: 4px 8px;
}
.load-title::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 215, 107, 0.7), transparent);
  animation: titleSweep 3s ease-in-out infinite;
  mix-blend-mode: overlay;
}
@keyframes titleSweep {
  0%   { left: -100%; }
  50%  { left: 100%; }
  100% { left: 100%; }
}

/* ==== СТАТУС ==== */
.load-status {
  font-size: 0.85rem;
  font-weight: 700;
  color: #8a7a5a;
  font-family: 'Courier New', monospace;
  letter-spacing: 1.5px;
  min-height: 1.2em;
  transition: opacity 0.3s ease, transform 0.3s ease, color 0.3s ease;
  text-align: center;
  padding: 0 10px;
}
.load-status.fade { opacity: 0; transform: translateY(-5px); }

/* ==== ПРОГРЕСС-БАР ==== */
.load-bar-outer {
  width: 300px;
  max-width: 88vw;
  height: 18px;
  background: #0f0f00;
  border: 1px solid #4a4a2a;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: inset 0 2px 6px black, 0 0 25px rgba(184, 150, 46, 0.25);
  position: relative;
}
.load-bar-segments {
  position: absolute;
  inset: 0;
  display: flex;
  pointer-events: none;
  z-index: 2;
}
.load-bar-segments span {
  flex: 1;
  border-right: 1px solid rgba(10, 10, 10, 0.6);
}
.load-bar-segments span:last-child { border-right: none; }

.load-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #8b1a1a, #b8962e 50%, #ffd76b);
  border-radius: 10px;
  transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow: 0 0 20px rgba(255, 215, 107, 0.9), inset 0 0 8px rgba(255, 255, 255, 0.3);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.load-bar-inner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: translateX(-100%);
  animation: barShine 1.6s ease-in-out infinite;
}
@keyframes barShine {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
  100% { transform: translateX(100%); }
}

/* ==== ПРОЦЕНТЫ ==== */
.load-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 300px;
  max-width: 88vw;
  gap: 10px;
}
.load-percent {
  font-size: 1.6rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  color: #ffd76b;
  letter-spacing: 2px;
  text-shadow: 0 0 18px rgba(255, 215, 107, 1), 0 0 30px rgba(255, 215, 107, 0.5);
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
.load-counter {
  font-size: 0.75rem;
  font-family: 'Courier New', monospace;
  color: #8a7a5a;
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* ==== ТОЧКИ ==== */
.load-dots {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.load-dots span {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #4a4a2a;
  animation: dotPulse 1.6s ease-in-out infinite;
  box-shadow: 0 0 0 rgba(255, 215, 107, 0);
}
.load-dots span:nth-child(1) { animation-delay: 0s; }
.load-dots span:nth-child(2) { animation-delay: 0.2s; }
.load-dots span:nth-child(3) { animation-delay: 0.4s; }
.load-dots span:nth-child(4) { animation-delay: 0.6s; }
.load-dots span:nth-child(5) { animation-delay: 0.8s; }
@keyframes dotPulse {
  0%, 100% { background: #4a4a2a; transform: scale(1); box-shadow: 0 0 0 rgba(255, 215, 107, 0); }
  50%      { background: #ffd76b; transform: scale(1.4); box-shadow: 0 0 15px rgba(255, 215, 107, 1); }
}

/* ==== ВОЛНЫ ВНИЗУ ==== */
.load-waves {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 120px;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.load-wave {
  position: absolute;
  bottom: -50px;
  left: -50%;
  width: 200%;
  height: 100%;
  border-radius: 45%;
  opacity: 0.35;
}
.load-wave.wave-1 {
  background: radial-gradient(ellipse at 50% 0%, rgba(184, 150, 46, 0.4), transparent 70%);
  animation: waveMove 12s linear infinite;
}
.load-wave.wave-2 {
  background: radial-gradient(ellipse at 50% 0%, rgba(106, 74, 154, 0.35), transparent 70%);
  animation: waveMove 16s linear infinite reverse;
  opacity: 0.25;
}
.load-wave.wave-3 {
  background: radial-gradient(ellipse at 50% 0%, rgba(192, 57, 43, 0.25), transparent 70%);
  animation: waveMove 20s linear infinite;
  opacity: 0.2;
}
@keyframes waveMove {
  0%   { transform: translateX(0) rotate(0deg); }
  100% { transform: translateX(25%) rotate(360deg); }
}

/* ==== ФИНАЛ ==== */
.load-done {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: rgba(5,5,5,0.96);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.load-done.show { opacity: 1; pointer-events: auto; }
.load-done .check {
  font-size: 7rem;
  color: #4cd964;
  filter: drop-shadow(0 0 50px rgba(76, 217, 100, 1));
  animation: checkIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.load-done .check::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(76, 217, 100, 0.5), transparent 60%);
  animation: checkFlash 1.5s ease-out infinite;
  pointer-events: none;
  z-index: -1;
}
@keyframes checkIn {
  0%   { opacity: 0; transform: scale(0.2) rotate(-45deg); }
  60%  { opacity: 1; transform: scale(1.15) rotate(5deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}
@keyframes checkFlash {
  0%   { opacity: 0.8; transform: scale(0.8); }
  100% { opacity: 0; transform: scale(2.5); }
}
.load-done .done-text {
  font-size: 1.3rem;
  font-weight: 900;
  color: #c4b08a;
  letter-spacing: 5px;
  text-transform: uppercase;
  animation: titleShine 1.6s ease-in-out infinite;
}

.page-exit {
  animation: pageExit 0.5s ease forwards;
}
@keyframes pageExit {
  to { opacity: 0; }
}

@media (max-width: 400px) {
  .load-ring-wrap { width: 190px; height: 190px; }
  .load-emoji { font-size: 4.5rem; }
  .load-title { font-size: 1.4rem; letter-spacing: 4px; }
  .load-bar-outer, .load-info { width: 260px; }
}
</style>
</head>
<body>

<div class="load-bg"></div>

<div class="load-orb orb-1"></div>
<div class="load-orb orb-2"></div>
<div class="load-orb orb-3"></div>

<div class="load-particles" id="particles"></div>

<div class="load-wave wave-1"></div>
<div class="load-wave wave-2"></div>
<div class="load-wave wave-3"></div>

<div class="load-wrap" id="loadWrap">

  <div class="load-ring-wrap">
    <div class="load-rays"></div>

    <svg class="progress-svg" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b1a1a"/>
          <stop offset="50%" stop-color="#b8962e"/>
          <stop offset="100%" stop-color="#ffd76b"/>
        </linearGradient>
      </defs>
      <circle class="progress-track" cx="110" cy="110" r="100"/>
      <circle class="progress-fill" id="progressFill" cx="110" cy="110" r="100"/>
    </svg>

    <div class="load-ring-outer"></div>
    <div class="load-ring-mid"></div>

    <div class="load-emoji">👴</div>
  </div>

  <div class="load-title-wrap">
    <div class="load-title">ЗАГРУЗКА ПАХОМА</div>
  </div>

  <div class="load-status" id="loadStatus">Подготовка...</div>

  <div class="load-bar-outer">
    <div class="load-bar-inner" id="loadBar"></div>
    <div class="load-bar-segments">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="load-info">
    <div class="load-percent" id="loadPercent">0%</div>
    <div class="load-counter" id="loadCounter">0 / 0</div>
  </div>

  <div class="load-dots">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="load-done" id="loadDone">
  <div class="check">✓</div>
  <div class="done-text">Готово</div>
</div>

<script>
(function() {
  'use strict';

  var API_BASE = 'https://save-pahom.duckdns.org';
  var MIN_DURATION_MS = 4500;
  var startTime = Date.now();

  var SOUNDS = [
    'A3.m4a',
    'Grahou.m4a',
    'Ihmatoov.m4a',
    'Dada.m4a',
    'Aimolodca.m4a'
  ];

  var IMAGES = [
    'Tvn.png',
    'Penis.png',
    'Seimur.png',
    'Fon.jpeg'
  ];

  var SCRIPTS = [
    'income.js',
    'server-sync.js'
  ];

  var loadStatus = document.getElementById('loadStatus');
  var loadBar = document.getElementById('loadBar');
  var loadPercent = document.getElementById('loadPercent');
  var loadCounter = document.getElementById('loadCounter');
  var loadDone = document.getElementById('loadDone');
  var progressFill = document.getElementById('progressFill');
  var particlesEl = document.getElementById('particles');

  // ==== ЧАСТИЦЫ ====
  (function makeParticles(){
    var count = 45;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.style.left = (Math.random() * 100) + '%';
      p.style.animationDuration = (6 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      var size = 2 + Math.random() * 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.bottom = (-10 - Math.random() * 50) + 'px';
      particlesEl.appendChild(p);
    }
  })();

  var totalSteps = 0;
  var doneSteps = 0;

  function setStatus(text) {
    loadStatus.classList.add('fade');
    setTimeout(function(){
      loadStatus.textContent = text;
      loadStatus.classList.remove('fade');
    }, 150);
  }

  function updateProgress() {
    var pct = totalSteps > 0 ? Math.min(100, Math.round((doneSteps / totalSteps) * 100)) : 0;
    loadBar.style.width = pct + '%';
    loadPercent.textContent = pct + '%';
    loadCounter.textContent = doneSteps + ' / ' + totalSteps;

    // Кольцо прогресса
    var circumference = 2 * Math.PI * 100; // r=100
    var offset = circumference * (1 - pct / 100);
    if (progressFill) {
      progressFill.style.strokeDasharray = circumference;
      progressFill.style.strokeDashoffset = offset;
    }
  }

  function step(statusText) {
    doneSteps++;
    if (statusText) setStatus(statusText);
    updateProgress();
  }

  function getUserId() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return 'tg_' + tg.initDataUnsafe.user.id;
      }
    } catch(e) {}
    var stored = null;
    try { stored = localStorage.getItem('pahomServerUserId'); } catch(e) {}
    if (stored) return stored;
    return null;
  }

  function loadSound(url) {
    return new Promise(function(resolve) {
      var audio = new Audio();
      audio.preload = 'auto';
      audio.muted = true;
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      audio.addEventListener('canplaythrough', finish, { once: true });
      audio.addEventListener('loadeddata', finish, { once: true });
      audio.addEventListener('error', finish, { once: true });
      audio.src = url;
      audio.load();
      setTimeout(finish, 8000);
    });
  }

  function loadImage(url) {
    return new Promise(function(resolve) {
      var img = new Image();
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      img.onload = finish;
      img.onerror = finish;
      img.src = url;
      setTimeout(finish, 8000);
    });
  }

  function loadScript(src) {
    return new Promise(function(resolve){
      if (src === 'income.js' && window.pahomApplyIncome) return resolve();
      if (src === 'server-sync.js' && window.tgSyncReady) return resolve();

      var s = document.createElement('script');
      s.src = src;
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve();
      }
      s.onload = finish;
      s.onerror = finish;
      document.head.appendChild(s);
      setTimeout(finish, 5000);
    });
  }

  function pingServer() {
    return fetch(API_BASE + '/', { method: 'GET' })
      .then(function(r) { return r.ok ? true : false; })
      .catch(function() { return false; });
  }

  function loadPlayerData(userId) {
    if (!userId) return Promise.resolve(false);
    return fetch(API_BASE + '/api/load?userId=' + encodeURIComponent(userId))
      .then(function(r) { return r.json(); })
      .then(function(resp) {
        if (!resp || !resp.data) return false;
        var count = 0;
        for (var k in resp.data) {
          try { localStorage.setItem(k, resp.data[k]); count++; } catch(e) {}
        }
        return true;
      })
      .catch(function() { return false; });
  }

  function readAllData() {
    return new Promise(function(resolve){
      try {
        var keys = [
          'pahomSexpah', 'pahomClicks', 'pahomOverexcites', 'pahomTool',
          'pahomBuffs', 'pahomKraftState', 'pahomKraftPending',
          'pahomBossInventory', 'pahomBossState', 'pahomPlayerExp',
          'pahomPlayerLevel', 'pahomNickname', 'pahomAvatar',
          'pahomSoundMuted', 'pahomUpgradeLove', 'pahomUpgradeLoot'
        ];
        for (var i = 0; i < keys.length; i++) {
          try { localStorage.getItem(keys[i]); } catch(e) {}
        }
      } catch(e) {}
      resolve();
    });
  }

  function warmupAnimations() {
    return new Promise(function(resolve){
      var warmup = document.createElement('div');
      warmup.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;';
      warmup.innerHTML =
        '<div style="animation:floatAnimation 7s ease-in-out infinite;"></div>' +
        '<div style="animation:glowPulse 3.5s ease-in-out infinite;"></div>' +
        '<div style="animation:itemFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);"></div>' +
        '<div style="animation:comboPulse 0.45s cubic-bezier(0.22, 1, 0.36, 1);"></div>';
      document.body.appendChild(warmup);

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          setTimeout(function(){
            try { document.body.removeChild(warmup); } catch(e) {}
            resolve();
          }, 300);
        });
      });
    });
  }

  function waitMinDuration() {
    var elapsed = Date.now() - startTime;
    var remaining = Math.max(0, MIN_DURATION_MS - elapsed);
    return new Promise(function(resolve){ setTimeout(resolve, remaining); });
  }

  function run() {
    totalSteps = SCRIPTS.length + 1 + 1 + SOUNDS.length + IMAGES.length + 1 + 1;
    updateProgress();

    setStatus('Загрузка скриптов...');

    var scriptsPromise = Promise.all(SCRIPTS.map(function(src){
      return loadScript(src).then(function(){
        step('Загружен: ' + src);
      });
    }));

    scriptsPromise
      .then(function(){
        setStatus('Проверка сервера...');
        return pingServer();
      })
      .then(function(serverOk){
        step(serverOk ? 'Сервер доступен' : 'Сервер недоступен, играем оффлайн');
        return serverOk;
      })
      .then(function(serverOk){
        if (!serverOk) { step('Данные не загружены'); return; }
        setStatus('Чтение данных...');
        return readAllData().then(function(){ step('Локальные данные прочитаны'); });
      })
      .then(function(){
        var userId = getUserId();
        if (!userId) {
          step('Новый игрок');
          return;
        }
        setStatus('Синхронизация с сервером...');
        return loadPlayerData(userId).then(function(loaded){
          step(loaded ? 'Данные синхронизированы' : 'Новый игрок');
        });
      })
      .then(function(){
        setStatus('Загрузка звуков...');
        var soundPromises = SOUNDS.map(function(url){
          return loadSound(url).then(function(){
            step('Звук: ' + url);
          });
        });
        return Promise.all(soundPromises);
      })
      .then(function(){
        setStatus('Загрузка иконок...');
        var imgPromises = IMAGES.map(function(url){
          return loadImage(url).then(function(){
            step('Иконка: ' + url);
          });
        });
        return Promise.all(imgPromises);
      })
      .then(function(){
        setStatus('Прогрев анимаций...');
        return warmupAnimations().then(function(){
          step('Анимации готовы');
        });
      })
      .then(function(){
        setStatus('Финальные штрихи...');
        return waitMinDuration();
      })
      .then(function(){
        step('Готово!');
        setStatus('Готово!');
        updateProgress();

        setTimeout(function(){
          loadDone.classList.add('show');
        }, 200);

        setTimeout(function(){
          document.body.classList.add('page-exit');
          setTimeout(function(){
            window.location.href = 'seks.html';
          }, 500);
        }, 900);
      })
      .catch(function(err){
        console.warn('[Index] Ошибка:', err);
        setStatus('Готово (с ошибками)');
        setTimeout(function(){
          window.location.href = 'seks.html';
        }, 900);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
</body>
</html>
