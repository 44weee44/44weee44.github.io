<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html, body {
  background:#050506;
  width:100%; height:100%;
  margin:0;
  font-family:-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Arial, sans-serif;
  color:#e8e8ec;
  overflow:hidden;
}
:root {
  --bg-0:#0a0a0c;
  --bg-2:#18181f;
  --text-2:#8a8a92;
  --text-3:#5a5a62;
  --accent-2:#7af080;
  --cyan:#7af0ff;
}

/* ==================== ЗАГРУЗКА ==================== */
.load-stage {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:28px;
  background:var(--bg-0);
  z-index:20;
  transition:opacity 1s ease, filter 1s ease, transform 1s ease;
}
.load-stage.fadeout {
  opacity:0;
  filter:blur(20px);
  transform:scale(1.05);
  pointer-events:none;
}

.load-stage::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  mask-image:radial-gradient(ellipse at 50% 50%, #000 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 30%, transparent 80%);
}
.load-stage::after {
  content:'';
  position:absolute;
  top:-40%; left:50%;
  transform:translateX(-50%);
  width:600px; height:600px;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(42,138,48,0.10) 30deg, transparent 60deg,
    transparent 300deg, rgba(42,138,48,0.10) 330deg, transparent 360deg);
  animation:spotlight 24s linear infinite;
  pointer-events:none;
  filter:blur(40px);
}
@keyframes spotlight { 0% { transform:translateX(-50%) rotate(0); } 100% { transform:translateX(-50%) rotate(360deg); } }
.load-stage > * { position:relative; z-index:2; }

.core {
  position:relative;
  width:180px; height:180px;
  display:flex; align-items:center; justify-content:center;
}
.core .ring-outer {
  position:absolute; inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0deg, rgba(122,240,128,0.6) 20deg, transparent 45deg,
    transparent 315deg, rgba(122,240,128,0.6) 340deg, transparent 360deg);
  mask:radial-gradient(circle, transparent 88%, #000 89%, #000 100%);
  -webkit-mask:radial-gradient(circle, transparent 88%, #000 89%, #000 100%);
  animation:spin 6s linear infinite;
}
.core .ring-mid {
  position:absolute; inset:20px;
  border-radius:50%;
  border:1px dashed rgba(122,240,128,0.35);
  animation:spinCCW 12s linear infinite;
}
.core .ring-inner {
  position:absolute; inset:40px;
  border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(122,240,128,0.7);
  border-right-color:rgba(122,240,128,0.2);
  animation:spin 3s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes spinCCW { to { transform:rotate(-360deg); } }

.core .diamond {
  position:relative;
  width:80px; height:80px;
  border-radius:12px;
  background:linear-gradient(135deg, rgba(42,138,48,0.3), rgba(20,60,24,0.5));
  border:2px solid var(--accent-2);
  transform:rotate(45deg);
  box-shadow:0 0 30px rgba(42,138,48,0.9), 0 0 60px rgba(42,138,48,0.4), inset 0 0 25px rgba(42,138,48,0.3);
  animation:diamondBreath 3s ease-in-out infinite;
  overflow:hidden;
}
.core .diamond::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 30%, rgba(122,240,128,0.35) 50%, transparent 70%);
  transform:translateX(-100%);
  animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine { 0% { transform:translateX(-100%); } 60% { transform:translateX(100%); } 100% { transform:translateX(100%); } }
@keyframes diamondBreath {
  0%, 100% { box-shadow:0 0 30px rgba(42,138,48,0.9), 0 0 60px rgba(42,138,48,0.4), inset 0 0 25px rgba(42,138,48,0.3); }
  50%      { box-shadow:0 0 50px rgba(42,138,48,1), 0 0 90px rgba(42,138,48,0.6), inset 0 0 35px rgba(42,138,48,0.45); }
}
.core .diamond-emoji {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%) rotate(-45deg);
  font-size:2.4rem;
  filter:drop-shadow(0 0 15px rgba(42,138,48,0.9));
}

.title {
  font-size:0.95rem; font-weight:900;
  letter-spacing:4px; text-transform:uppercase;
  display:flex; align-items:center; gap:12px;
  text-shadow:0 0 20px rgba(42,138,48,0.5);
}
.title::before, .title::after {
  content:''; width:24px; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-2));
}
.title::after { background:linear-gradient(90deg, var(--accent-2), transparent); }

.status {
  font-size:0.68rem; color:var(--text-2);
  font-family:'Courier New', monospace;
  letter-spacing:1.5px; text-transform:uppercase;
  text-align:center; min-height:1em;
  transition:opacity 0.3s ease;
}
.bar-wrap {
  width:100%; max-width:280px;
  display:flex; flex-direction:column; gap:10px;
}
.bar {
  width:100%; height:4px;
  background:var(--bg-2); border-radius:2px; overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.9);
}
.bar-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg, #2a8a30, #7af080, #b8ffb8);
  background-size:200% 100%;
  border-radius:2px;
  box-shadow:0 0 12px rgba(42,138,48,0.9);
  transition:width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  animation:barFlow 2s linear infinite;
}
@keyframes barFlow { 0% { background-position:0% 0%; } 100% { background-position:200% 0%; } }
.bar-info {
  display:flex; justify-content:space-between;
  font-size:0.62rem; color:var(--text-3);
  font-family:'Courier New', monospace;
}
.bar-info .pct {
  color:var(--accent-2); font-weight:900; font-size:0.9rem;
  text-shadow:0 0 10px rgba(42,138,48,0.8);
}

/* ==================== ВСПЫШКА ==================== */
.flash {
  position:fixed;
  inset:0;
  z-index:25;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(122,240,255,0.85) 0%,
    rgba(122,240,255,0.4) 25%,
    rgba(42,138,48,0.15) 50%,
    transparent 75%);
}
.flash.pop { animation:flashPop 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes flashPop {
  0%   { opacity:0;    transform:scale(0.7); }
  20%  { opacity:0.9;  transform:scale(1); }
  60%  { opacity:0.3;  transform:scale(1.05); }
  100% { opacity:0;    transform:scale(1.15); }
}

/* ==================== СТАРТОВЫЙ ЭКРАН ==================== */
.start-screen {
  position:fixed;
  inset:0;
  z-index:22;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:44px;
  background:#050608;
  opacity:0;
  pointer-events:none;
}
.start-screen.show {
  display:flex;
  animation:startFadeIn 1.4s ease forwards;
  pointer-events:auto;
}
@keyframes startFadeIn {
  0%   { opacity:0; filter:brightness(0.3); }
  60%  { opacity:1; filter:brightness(1.15); }
  100% { opacity:1; filter:brightness(1); }
}

.start-screen::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    repeating-linear-gradient(0deg,
      rgba(122,240,255,0.03) 0px,
      rgba(122,240,255,0.03) 1px,
      transparent 1px,
      transparent 3px);
  pointer-events:none;
  z-index:10;
}
.start-screen::after {
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
  pointer-events:none;
  z-index:11;
}

.glitch-bars {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:6;
  overflow:hidden;
}
.glitch-bars span {
  position:absolute;
  left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity:0;
  animation:barFlicker 8s steps(2) infinite;
}
.glitch-bars span:nth-child(1) { top:20%; animation-delay:0s; }
.glitch-bars span:nth-child(2) { top:45%; animation-delay:1.2s; }
.glitch-bars span:nth-child(3) { top:70%; animation-delay:2.4s; }
.glitch-bars span:nth-child(4) { top:33%; animation-delay:3.6s; }
.glitch-bars span:nth-child(5) { top:85%; animation-delay:4.8s; }
@keyframes barFlicker {
  0%, 100%   { opacity:0; }
  0.5%       { opacity:0.8; }
  1%         { opacity:0; }
  50%        { opacity:0; }
  50.5%      { opacity:0.5; }
  51%        { opacity:0; }
}

.start-title-wrap {
  position:relative;
  z-index:5;
  text-align:center;
  animation:flicker 6s linear infinite;
}
.start-title {
  font-size:2.6rem;
  font-weight:900;
  letter-spacing:14px;
  color:var(--cyan);
  text-shadow:
    0 0 6px var(--cyan),
    0 0 14px var(--cyan),
    0 0 30px rgba(122,240,255,0.7),
    0 0 60px rgba(122,240,255,0.4);
  display:flex;
  align-items:center;
  gap:16px;
  justify-content:center;
  font-family:'Courier New', monospace;
}
.start-title .q {
  display:inline-block;
  animation:qBlink 1.2s steps(2) infinite;
}
@keyframes flicker {
  0%, 100%    { opacity:1; }
  92%         { opacity:1; }
  93%         { opacity:0.6; }
  94%         { opacity:1; }
  97%         { opacity:0.8; }
  98%         { opacity:1; }
}
@keyframes qBlink {
  0%, 49%   { opacity:1; }
  50%, 100% { opacity:0.4; }
}

.start-choice {
  position:relative;
  z-index:5;
  display:flex;
  gap:90px;
  align-items:center;
  justify-content:center;
}
.start-opt {
  font-size:1.7rem;
  font-weight:900;
  letter-spacing:10px;
  color:var(--cyan);
  cursor:pointer;
  text-shadow:
    0 0 6px var(--cyan),
    0 0 16px var(--cyan),
    0 0 30px rgba(122,240,255,0.6);
  padding:8px 6px;
  position:relative;
  transition:transform 0.15s ease;
  font-family:'Courier New', monospace;
  animation:optGlow 3s ease-in-out infinite;
}
.start-opt.no {
  color:#3a7a8a;
  text-shadow:0 0 3px #3a7a8a, 0 0 10px rgba(58,122,138,0.5);
  animation:noDimmer 4s ease-in-out infinite;
}
@keyframes optGlow {
  0%, 100% { text-shadow:0 0 6px var(--cyan), 0 0 16px var(--cyan), 0 0 30px rgba(122,240,255,0.6); }
  50%      { text-shadow:0 0 10px var(--cyan), 0 0 25px var(--cyan), 0 0 50px rgba(122,240,255,0.9); }
}
@keyframes noDimmer {
  0%, 100% { opacity:0.55; }
  50%      { opacity:0.85; }
}
.start-opt.active {
  transform:scale(1.1);
  animation:optPulse 0.4s ease-in-out infinite alternate;
}
@keyframes optPulse {
  from { text-shadow:0 0 8px var(--cyan), 0 0 25px var(--cyan), 0 0 50px rgba(122,240,255,0.9); }
  to   { text-shadow:0 0 12px #fff, 0 0 40px var(--cyan), 0 0 80px rgba(122,240,255,1); }
}
.start-opt::before {
  content:'>';
  position:absolute;
  left:-32px;
  top:50%;
  transform:translateY(-50%);
  opacity:0;
  color:var(--cyan);
  text-shadow:0 0 10px var(--cyan);
  font-size:1.4rem;
  transition:opacity 0.15s ease;
}
.start-opt.active::before {
  opacity:1;
  animation:cursorBlink 0.8s steps(2) infinite;
}
@keyframes cursorBlink {
  0%, 49%   { opacity:1; }
  50%, 100% { opacity:0.3; }
}

.start-footer {
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  font-size:0.68rem;
  color:rgba(122,240,255,0.4);
  letter-spacing:5px;
  text-transform:uppercase;
  z-index:5;
  font-weight:700;
  font-family:'Courier New', monospace;
}

.start-screen.glitching {
  animation:glitch 0.6s steps(2) infinite;
}
@keyframes glitch {
  0%   { transform:translate(0,0); filter:hue-rotate(0deg); }
  20%  { transform:translate(-3px,1px); filter:hue-rotate(20deg); }
  40%  { transform:translate(3px,-1px); filter:hue-rotate(-10deg); }
  60%  { transform:translate(-2px,-2px); filter:hue-rotate(15deg); }
  80%  { transform:translate(2px,2px); filter:hue-rotate(-5deg); }
  100% { transform:translate(0,0); filter:hue-rotate(0deg); }
}

.start-screen.exiting {
  animation:exitFade 0.8s ease forwards;
}
@keyframes exitFade {
  0%   { opacity:1; filter:brightness(1); }
  30%  { opacity:1; filter:brightness(2) hue-rotate(-30deg); }
  100% { opacity:0; filter:brightness(0); }
}

@media (max-width:400px) {
  .start-title { font-size:1.85rem; letter-spacing:9px; gap:10px; }
  .start-choice { gap:55px; }
  .start-opt { font-size:1.35rem; letter-spacing:7px; }
  .start-opt::before { left:-24px; font-size:1.1rem; }
}
</style>
</head>
<body>

<!-- ==================== ЗАГРУЗКА ==================== -->
<div class="load-stage" id="loadStage">
  <div class="core">
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-inner"></div>
    <div class="diamond">
      <span class="diamond-emoji">👴</span>
    </div>
  </div>

  <div class="title">ЗАГРУЗКА</div>
  <div class="status" id="status">Подготовка...</div>

  <div class="bar-wrap">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-info"><span class="pct" id="pct">0%</span><span id="steps">0 / 0</span></div>
  </div>
</div>

<!-- ==================== ВСПЫШКА ==================== -->
<div class="flash" id="flash"></div>

<!-- ==================== СТАРТОВЫЙ ЭКРАН ==================== -->
<div class="start-screen" id="startScreen">
  <div class="glitch-bars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="start-title-wrap">
    <div class="start-title">НАЧАТЬ ИГРУ<span class="q">?</span></div>
  </div>

  <div class="start-choice" id="startChoice">
    <div class="start-opt yes active" id="btnYes" data-action="yes">ДА</div>
    <div class="start-opt no" id="btnNo" data-action="no">НЕТ</div>
  </div>

  <div class="start-footer">— PAHOM SYSTEMS —</div>
</div>

<script>
(function() {
  'use strict';

  /* ==================== КОНСТАНТЫ ЗАГРУЗКИ ==================== */
  var API_BASE = 'https://save-pahom.duckdns.org';
  var MIN_DURATION_MS = 4500;       // минимальная длительность загрузки
  var startTime = Date.now();

  var SOUNDS = [
    'A3.m4a',
    'Grahou.m4a',
    'Ihmatoov.m4a',
    'Dada.m4a',
    'Aimolodca.m4a'
  ];
  var IMAGES = [
    'Tvn.png',
    'Penis.png',
    'Seimur.png',
    'Fon.jpeg'
  ];
  var SCRIPTS = [
    'income.js',
    'server-sync.js'
  ];

  /* ==================== DOM ==================== */
  var loadStage = document.getElementById('loadStage');
  var statusEl = document.getElementById('status');
  var barFill = document.getElementById('barFill');
  var pctEl = document.getElementById('pct');
  var stepsEl = document.getElementById('steps');
  var flash = document.getElementById('flash');
  var startScreen = document.getElementById('startScreen');
  var btnYes = document.getElementById('btnYes');
  var btnNo = document.getElementById('btnNo');

  /* ==================== ПРОГРЕСС ==================== */
  var totalSteps = 0;
  var doneSteps = 0;
  var lastStatus = '';

  function setStatus(text) {
    if (text === lastStatus) return;
    lastStatus = text;
    statusEl.style.opacity = 0;
    setTimeout(function(){
      statusEl.textContent = text;
      statusEl.style.opacity = 1;
    }, 120);
  }

  function updateProgress() {
    var pct = totalSteps > 0 ? Math.min(100, Math.round((doneSteps / totalSteps) * 100)) : 0;
    barFill.style.width = pct + '%';
    pctEl.textContent = pct + '%';
    stepsEl.textContent = doneSteps + ' / ' + totalSteps;
  }

  function step(text) {
    doneSteps++;
    if (text) setStatus(text);
    updateProgress();
  }

  /* ==================== ХЕЛПЕРЫ ==================== */
  function getUserId() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return 'tg_' + tg.initDataUnsafe.user.id;
      }
    } catch(e) {}
    var stored = null;
    try { stored = localStorage.getItem('pahomServerUserId'); } catch(e) {}
    if (stored) return stored;
    return null;
  }

  function loadSound(url) {
    return new Promise(function(resolve){
      var audio = new Audio();
      audio.preload = 'auto';
      audio.muted = true;
      var done = false;
      function finish() { if (done) return; done = true; resolve(); }
      audio.addEventListener('canplaythrough', finish, { once: true });
      audio.addEventListener('loadeddata', finish, { once: true });
      audio.addEventListener('error', finish, { once: true });
      audio.src = url;
      audio.load();
      setTimeout(finish, 8000);
    });
  }

  function loadImage(url) {
    return new Promise(function(resolve){
      var img = new Image();
      var done = false;
      function finish() { if (done) return; done = true; resolve(); }
      img.onload = finish;
      img.onerror = finish;
      img.src = url;
      setTimeout(finish, 8000);
    });
  }

  function loadScript(src) {
    return new Promise(function(resolve){
      if (src === 'income.js' && window.pahomApplyIncome) return resolve();
      if (src === 'server-sync.js' && window.tgSyncReady) return resolve();

      var s = document.createElement('script');
      s.src = src;
      var done = false;
      function finish() { if (done) return; done = true; resolve(); }
      s.onload = finish;
      s.onerror = finish;
      document.head.appendChild(s);
      setTimeout(finish, 5000);
    });
  }

  function pingServer() {
    return fetch(API_BASE + '/', { method: 'GET' })
      .then(function(r){ return r.ok ? true : false; })
      .catch(function(){ return false; });
  }

  function loadPlayerData(userId) {
    if (!userId) return Promise.resolve(false);
    return fetch(API_BASE + '/api/load?userId=' + encodeURIComponent(userId))
      .then(function(r){ return r.json(); })
      .then(function(resp){
        if (!resp || !resp.data) return false;
        for (var k in resp.data) {
          try { localStorage.setItem(k, resp.data[k]); } catch(e) {}
        }
        return true;
      })
      .catch(function(){ return false; });
  }

  function readAllData() {
    return new Promise(function(resolve){
      try {
        var keys = [
          'pahomSexpah', 'pahomClicks', 'pahomOverexcites', 'pahomTool',
          'pahomBuffs', 'pahomKraftState', 'pahomKraftPending',
          'pahomBossInventory', 'pahomBossState', 'pahomPlayerExp',
          'pahomPlayerLevel', 'pahomNickname', 'pahomAvatar',
          'pahomSoundMuted', 'pahomUpgradeLove', 'pahomUpgradeLoot'
        ];
        for (var i = 0; i < keys.length; i++) {
          try { localStorage.getItem(keys[i]); } catch(e) {}
        }
      } catch(e) {}
      resolve();
    });
  }

  function warmupAnimations() {
    return new Promise(function(resolve){
      var warmup = document.createElement('div');
      warmup.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;';
      warmup.innerHTML =
        '<div style="animation:floatAnimation 7s ease-in-out infinite;"></div>' +
        '<div style="animation:glowPulse 3.5s ease-in-out infinite;"></div>' +
        '<div style="animation:itemFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);"></div>';
      document.body.appendChild(warmup);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          setTimeout(function(){
            try { document.body.removeChild(warmup); } catch(e) {}
            resolve();
          }, 300);
        });
      });
    });
  }

  function waitMinDuration() {
    var elapsed = Date.now() - startTime;
    var remaining = Math.max(0, MIN_DURATION_MS - elapsed);
    return new Promise(function(resolve){ setTimeout(resolve, remaining); });
  }

  /* ==================== ЗАПУСК ЗАГРУЗКИ ==================== */
  function run() {
    totalSteps = SCRIPTS.length + 1 + 1 + SOUNDS.length + IMAGES.length + 1 + 1;
    updateProgress();

    setStatus('Загрузка скриптов...');

    var scriptsPromise = Promise.all(SCRIPTS.map(function(src){
      return loadScript(src).then(function(){ step('Загружен: ' + src); });
    }));

    scriptsPromise
      .then(function(){
        setStatus('Проверка сервера...');
        return pingServer();
      })
      .then(function(serverOk){
        step(serverOk ? 'Сервер доступен' : 'Сервер недоступен, играем оффлайн');
        return serverOk;
      })
      .then(function(serverOk){
        if (!serverOk) { step('Данные не загружены'); return; }
        setStatus('Чтение данных...');
        return readAllData().then(function(){ step('Локальные данные прочитаны'); });
      })
      .then(function(){
        var userId = getUserId();
        if (!userId) { step('Новый игрок'); return; }
        setStatus('Синхронизация с сервером...');
        return loadPlayerData(userId).then(function(loaded){
          step(loaded ? 'Данные синхронизированы' : 'Новый игрок');
        });
      })
      .then(function(){
        setStatus('Загрузка звуков...');
        return Promise.all(SOUNDS.map(function(url){
          return loadSound(url).then(function(){ step('Звук: ' + url); });
        }));
      })
      .then(function(){
        setStatus('Загрузка иконок...');
        return Promise.all(IMAGES.map(function(url){
          return loadImage(url).then(function(){ step('Иконка: ' + url); });
        }));
      })
      .then(function(){
        setStatus('Прогрев анимаций...');
        return warmupAnimations().then(function(){ step('Анимации готовы'); });
      })
      .then(function(){
        setStatus('Финальные штрихи...');
        return waitMinDuration();
      })
      .then(function(){
        step('Готово!');
        setStatus('Готово!');
        updateProgress();
        // Дать бару дорисоваться до 100%
        setTimeout(startTransition, 500);
      })
      .catch(function(err){
        console.warn('[Index] Ошибка:', err);
        setStatus('Готово (с ошибками)');
        setTimeout(startTransition, 900);
      });
  }

  /* ==================== ПЕРЕХОД: ЗАГРУЗКА → СТАРТ ==================== */
  function startTransition() {
    // 1. Загрузка плавно тает
    loadStage.classList.add('fadeout');

    // 2. Небольшая вспышка
    setTimeout(function(){
      flash.classList.add('pop');
    }, 400);

    // 3. Параллельно проявляется стартовый экран
    setTimeout(function(){
      startScreen.classList.add('show');
    }, 500);
  }

  /* ==================== ЛОГИКА СТАРТОВОГО ЭКРАНА ==================== */
  var allOpts = [btnYes, btnNo];
  var activeIdx = 0;

  function setActive(idx) {
    activeIdx = idx;
    allOpts.forEach(function(opt, i){
      opt.classList.toggle('active', i === idx);
    });
  }

  allOpts.forEach(function(opt, i){
    opt.addEventListener('mouseenter', function(){ setActive(i); });
    opt.addEventListener('touchstart', function(){ setActive(i); }, { passive: true });
    opt.addEventListener('click', function(){
      setActive(i);
      if (opt.dataset.action === 'yes') startGame();
      else exitGame();
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      setActive(activeIdx === 0 ? 1 : 0);
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (activeIdx === 0) startGame();
      else exitGame();
    } else if (e.key === 'y' || e.key === 'Y' || e.key === 'д' || e.key === 'Д') {
      startGame();
    } else if (e.key === 'n' || e.key === 'N' || e.key === 'н' || e.key === 'Н') {
      exitGame();
    }
  });

  function startGame() {
    startScreen.classList.add('glitching');
    setTimeout(function(){
      startScreen.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      startScreen.style.opacity = '0';
      startScreen.style.transform = 'scale(1.05)';
      setTimeout(function(){
        window.location.href = 'seks.html';
      }, 500);
    }, 600);
  }

  function exitGame() {
    startScreen.classList.add('exiting');
    setTimeout(function(){
      window.open('', '_self', '');
      window.close();
      setTimeout(function(){
        window.location.href = 'about:blank';
      }, 300);
    }, 800);
  }

  // Лёгкое мерцание стартового экрана
  setInterval(function(){
    if (startScreen.classList.contains('show') && Math.random() < 0.15) {
      startScreen.style.filter = 'brightness(1.15)';
      setTimeout(function(){ startScreen.style.filter = ''; }, 60);
    }
  }, 2000);

  setActive(0);

  /* ==================== СТАРТ ==================== */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }

})();
</script>
</body>
</html>
