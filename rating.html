<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>РЕЙТИНГ — кликер Пахома</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #0a0a0a;
  --panel: #1a1a1a;
  --border: #4a4a2a;
  --text: #c4b08a;
  --accent: #8a7a5a;
  --gold: #b8962e;
  --red: #c0392b;
}

body {
  background: #0a0a0a;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  overflow: hidden;
  touch-action: manipulation;
}

.game-container {
  background-color: #1a1a1a;
  background-image:
    linear-gradient(rgba(10,10,10,0.88), rgba(10,10,10,0.96)),
    url('Fon.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: containerFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
}
@keyframes containerFadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.stars span {
  position: absolute;
  width: 2px; height: 2px;
  background: rgba(184, 150, 46, 0.7);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(184, 150, 46, 1);
  animation: starFloat linear infinite;
}
@keyframes starFloat {
  0%   { transform: translateY(105vh) scale(0.3); opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 15px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(42, 42, 26, 0.85);
  position: relative;
  z-index: 10;
  min-height: 56px;
}

.header-title {
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--text);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 20px rgba(184, 150, 46, 0.5);
  animation: titleGlow 4s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(184, 150, 46, 0.4); }
  50%      { text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 32px rgba(255, 215, 107, 0.9); }
}
.header-title svg {
  width: 26px;
  height: 26px;
  filter: drop-shadow(0 0 10px rgba(255, 215, 107, 0.9));
}

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 110px;
  z-index: 5;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 20px;
  color: var(--accent);
  text-align: center;
}
.loading-spinner {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  animation: spin 1s linear infinite;
  filter: drop-shadow(0 0 10px rgba(184, 150, 46, 0.6));
}
@keyframes spin { to { transform: rotate(360deg); } }

.podium {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 8px;
  margin-bottom: 22px;
  padding: 0 4px;
  min-height: 180px;
}

.podium-card {
  flex: 1;
  max-width: 33.33%;
  background: linear-gradient(180deg, rgba(30,30,14,0.9), rgba(15,15,8,0.95));
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(30px);
  animation: podiumIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes podiumIn {
  0%   { opacity: 0; transform: translateY(30px) scale(0.85); }
  60%  { opacity: 1; transform: translateY(-5px) scale(1.03); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.podium-card.rank-1 {
  order: 2;
  padding-top: 20px;
  padding-bottom: 20px;
  min-height: 200px;
  border-color: #ffd76b;
  background: linear-gradient(180deg, rgba(255,215,107,0.18), rgba(120,80,10,0.15));
  box-shadow: 0 0 30px rgba(255, 215, 107, 0.5), inset 0 0 20px rgba(255, 215, 107, 0.1);
  animation-delay: 0.5s;
}

.podium-card.rank-2 {
  order: 1;
  min-height: 160px;
  border-color: #c0c0c0;
  background: linear-gradient(180deg, rgba(192,192,192,0.12), rgba(60,60,60,0.15));
  box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
  animation-delay: 0.65s;
}

.podium-card.rank-3 {
  order: 3;
  min-height: 140px;
  border-color: #cd7f32;
  background: linear-gradient(180deg, rgba(205,127,50,0.12), rgba(70,40,10,0.15));
  box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
  animation-delay: 0.8s;
}

.podium-medal {
  font-size: 1.9rem;
  line-height: 1;
  filter: drop-shadow(0 0 10px currentColor);
  animation: medalFloat 3s ease-in-out infinite;
}
@keyframes medalFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-4px) rotate(3deg); }
}
.podium-card.rank-1 .podium-medal { color: #ffd76b; font-size: 2.4rem; }
.podium-card.rank-2 .podium-medal { color: #c0c0c0; }
.podium-card.rank-3 .podium-medal { color: #cd7f32; }

.podium-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, #252515, #1a1a10);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  overflow: hidden;
  border: 2px solid var(--border);
  flex-shrink: 0;
}
.podium-card.rank-1 .podium-avatar {
  width: 60px;
  height: 60px;
  font-size: 1.9rem;
  border-color: #ffd76b;
  box-shadow: 0 0 15px rgba(255,215,107,0.6);
}
.podium-card.rank-2 .podium-avatar { border-color: #c0c0c0; }
.podium-card.rank-3 .podium-avatar { border-color: #cd7f32; }
.podium-avatar img { width: 100%; height: 100%; object-fit: cover; }

.podium-name {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--text);
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 4px;
}
.podium-card.rank-1 .podium-name {
  color: #ffd76b;
  font-size: 0.95rem;
}

.podium-score {
  font-size: 0.72rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  color: var(--accent);
  letter-spacing: 0.5px;
  text-align: center;
}
.podium-card.rank-1 .podium-score {
  color: #ffd76b;
  font-size: 0.85rem;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(30, 30, 14, 0.75);
  border: 1px solid var(--border);
  border-radius: 10px;
  opacity: 0;
  transform: translateX(-15px);
  animation: rowIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
}
.row:hover {
  border-color: rgba(184, 150, 46, 0.6);
  transform: translateX(3px);
  box-shadow: 0 0 15px rgba(184, 150, 46, 0.2);
}
@keyframes rowIn {
  0%   { opacity: 0; transform: translateX(-15px); }
  100% { opacity: 1; transform: translateX(0); }
}

.row.me {
  border-color: var(--gold);
  background: rgba(184, 150, 46, 0.15);
  box-shadow: 0 0 15px rgba(184, 150, 46, 0.3);
}

.row-rank {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(60, 60, 40, 0.5);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  color: var(--accent);
  flex-shrink: 0;
}

.row-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #252515, #1a1a10);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  overflow: hidden;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.row-avatar img { width: 100%; height: 100%; object-fit: cover; }

.row-name {
  flex: 1;
  min-width: 0;
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-level {
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 700;
  margin-left: 4px;
}

.row-score {
  font-size: 0.9rem;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  color: var(--gold);
  letter-spacing: 0.5px;
  flex-shrink: 0;
  text-align: right;
  text-shadow: 0 0 8px rgba(184, 150, 46, 0.5);
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--accent);
  font-size: 0.95rem;
}
.empty-icon {
  display: block;
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: 0.5;
}

.tabs-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 30px 22px;
  z-index: 20;
  gap: 10px;
  background: linear-gradient(0deg, rgba(10,10,10,0.98), rgba(10,10,10,0.7), transparent);
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
}
.tab-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--accent);
  opacity: 0.6;
  transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  padding: 5px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tab-btn.active {
  opacity: 1;
  color: var(--text);
  transform: scale(1.12);
  filter: drop-shadow(0 0 10px rgba(180,150,90,0.7));
}
.tab-btn:hover { opacity: 0.95; transform: scale(1.08); }
.tab-btn:active { transform: scale(0.93); }
.tab-btn svg {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  transition: filter 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}
.tab-btn.home-btn svg { width: 36px; height: 36px; }
.tab-btn.boss-btn svg { width: 30px; height: 30px; }
.tab-btn.boss-btn:hover svg { filter: drop-shadow(0 0 10px rgba(200,60,60,0.9)); transform: scale(1.15); }
.tab-btn.boss-btn:hover { color: #c0392b; }

.tab-btn.rating-btn.active svg {
  filter: drop-shadow(0 0 12px rgba(255, 215, 107, 1));
}

.boss-skull-glow { animation: skullGlow 3s ease-in-out infinite; transform-origin: center; }
@keyframes skullGlow {
  0%, 100% { filter: drop-shadow(0 0 3px rgba(200, 60, 60, 0.4)); }
  50%      { filter: drop-shadow(0 0 9px rgba(200, 60, 60, 0.9)); }
}

@media (max-width: 400px) {
  .podium-card.rank-1 { min-height: 180px; padding-top: 16px; padding-bottom: 16px; }
  .podium-card.rank-2 { min-height: 145px; }
  .podium-card.rank-3 { min-height: 130px; }
  .podium-avatar { width: 42px; height: 42px; font-size: 1.3rem; }
  .podium-card.rank-1 .podium-avatar { width: 54px; height: 54px; font-size: 1.7rem; }
  .podium-name { font-size: 0.7rem; }
  .podium-card.rank-1 .podium-name { font-size: 0.85rem; }
  .podium-score { font-size: 0.65rem; }
  .podium-card.rank-1 .podium-score { font-size: 0.78rem; }
  .podium-medal { font-size: 1.6rem; }
  .podium-card.rank-1 .podium-medal { font-size: 2rem; }
  .row-name { font-size: 0.85rem; }
  .row-score { font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="game-container">

  <div class="stars" id="stars"></div>

  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8"/>
        <path d="M12 17v4"/>
        <path d="M7 4h10v5a5 5 0 01-10 0V4z"/>
        <path d="M17 5h2a2 2 0 012 2v1a3 3 0 01-3 3"/>
        <path d="M7 5H5a2 2 0 00-2 2v1a3 3 0 003 3"/>
      </svg>
      РЕЙТИНГ
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <div>Загрузка рейтинга...</div>
    </div>
  </div>

  <div class="tabs-bar">
    <a href="boss.html" class="tab-btn boss-btn" title="Боссы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="boss-skull-glow">
        <path d="M12 2C7.6 2 4 5.6 4 10c0 2.4 1 4.5 2.7 5.9V19c0 .6.4 1 1 1h1.3v-2h1.4v2h1.2v-2h1.4v2H14v-2h1.4v2H16.7c.6 0 1-.4 1-1v-3.1C19.4 14.5 20 12.4 20 10c0-4.4-3.6-8-8-8z"/>
        <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
        <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
        <path d="M12 13.5l-1.2 2.5h2.4z" fill="currentColor"/>
      </svg>
    </a>
    <a href="seks.html#shop" class="tab-btn" title="Магазин">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    </a>
    <a href="seks.html" class="tab-btn home-btn" title="Главная">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="rating.html" class="tab-btn rating-btn active" title="Рейтинг">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8"/>
        <path d="M12 17v4"/>
        <path d="M7 4h10v5a5 5 0 01-10 0V4z"/>
        <path d="M17 5h2a2 2 0 012 2v1a3 3 0 01-3 3"/>
        <path d="M7 5H5a2 2 0 00-2 2v1a3 3 0 003 3"/>
      </svg>
    </a>
    <a href="prof.html" class="tab-btn" title="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </div>
</div>

<script>
(function() {
  'use strict';

  var API_BASE = 'https://save-pahom.duckdns.org';

  // ==== ЗВЁЗДЫ ====
  (function makeStars() {
    var container = document.getElementById('stars');
    var count = 30;
    for (var i = 0; i < count; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (6 + Math.random() * 8) + 's';
      s.style.animationDelay = (Math.random() * 8) + 's';
      var size = 1 + Math.random() * 3;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      container.appendChild(s);
    }
  })();

  function fmt(n) {
    if (n >= 1000000000) { var v = n/1000000000; return (v<10?v.toFixed(1):Math.floor(v))+'B'; }
    if (n >= 1000000) { var v = n/1000000; return (v<10?v.toFixed(1):Math.floor(v))+'M'; }
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function getMyId() {
    try { return window.tgSyncUserId || localStorage.getItem('pahomServerUserId') || ''; } catch(e) { return ''; }
  }

  function esc(str) {
    return String(str || '').replace(/[<>&"']/g, function(c) {
      return { '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function avatarHTML(avatar, fallbackEmoji) {
    if (avatar && avatar.indexOf('data:image') === 0) {
      return '<img src="' + avatar + '" alt="">';
    }
    return fallbackEmoji || '👤';
  }

  var lastRenderedJson = '';

  function render(players) {
    var json = JSON.stringify(players);
    if (json === lastRenderedJson) return;
    lastRenderedJson = json;

    var content = document.getElementById('content');
    content.innerHTML = '';

    if (!players || players.length === 0) {
      content.innerHTML = '<div class="empty"><span class="empty-icon">🏆</span>Пока никто не играл.<br>Стань первым!</div>';
      return;
    }

    var myId = getMyId();

    // ==== ПОДИУМ ====
    var podium = document.createElement('div');
    podium.className = 'podium';

    var slots = [
      { idx: 1, rank: 2 },
      { idx: 0, rank: 1 },
      { idx: 2, rank: 3 }
    ];

    slots.forEach(function(slot) {
      var p = players[slot.idx];
      if (!p) return;
      var rank = slot.rank;
      var medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉';

      var card = document.createElement('div');
      card.className = 'podium-card rank-' + rank;
      card.innerHTML =
        '<div class="podium-medal">' + medal + '</div>' +
        '<div class="podium-avatar">' + avatarHTML(p.avatar, '👤') + '</div>' +
        '<div class="podium-name">' + esc(p.nickname) + '</div>' +
        '<div class="podium-score">' + fmt(p.sexpah) + ' 🔞</div>';
      podium.appendChild(card);
    });

    content.appendChild(podium);

    // ==== СПИСОК (с 4-го) ====
    if (players.length > 3) {
      var list = document.createElement('div');
      list.className = 'list';

      players.slice(3).forEach(function(p, idx) {
        var rank = idx + 4;
        var row = document.createElement('div');
        row.className = 'row';
        if (p.id === myId) row.classList.add('me');
        row.style.animationDelay = (0.05 * Math.min(idx, 20)) + 's';

        row.innerHTML =
          '<div class="row-rank">' + rank + '</div>' +
          '<div class="row-avatar">' + avatarHTML(p.avatar, '👤') + '</div>' +
          '<div class="row-name">' + esc(p.nickname) + '<span class="row-level">ур.' + p.level + '</span></div>' +
          '<div class="row-score">' + fmt(p.sexpah) + ' 🔞</div>';

        list.appendChild(row);
      });

      content.appendChild(list);
    }
  }

  function load() {
    var content = document.getElementById('content');

    fetch(API_BASE + '/api/leaderboard')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(resp) {
        render(resp.players || []);
      })
      .catch(function(err) {
        console.warn('Leaderboard error:', err);
        if (lastRenderedJson === '') {
          content.innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span>Не удалось загрузить рейтинг.<br>Проверь соединение с сервером.</div>';
        }
      });
  }

  load();
  setInterval(load, 10000);

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') load();
  });

})();
</script>
</body>
</html>
